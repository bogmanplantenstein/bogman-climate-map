name: Refresh iNat Data

on:
  schedule:
    - cron: '0 3 1 * *'   # 3am UTC on the 1st of each month
  workflow_dispatch:        # manual trigger any time via Actions tab

permissions:
  contents: write           # needed to commit updated inat/ files back to repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warnings

jobs:

  # ── Job 1: fetch all observations ──────────────────────────────────────────
  fetch-obs:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # obs fetch runs ~55-65 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Fetch iNat observations
        env:
          INAT_API_TOKEN: ${{ secrets.INAT_API_TOKEN }}
        run: node scripts/fetch-inat-data.js obs

      - name: Commit observation data
        run: |
          git config user.name  bogmanplantenstein
          git config user.email bogman@bogmanplantenstein.com
          git add inat/
          if git diff --staged --quiet; then
            echo "No changes to commit — obs data is already up to date"
          else
            git commit -m "chore: monthly iNat obs refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✓ Obs data committed and pushed"
          fi

      - name: Show fetch report
        if: always()
        run: |
          if [ -f inat/fetch-report.json ]; then
            echo "=== Fetch Report ==="
            cat inat/fetch-report.json
          fi

  # ── Job 2: precompute species climate envelopes ───────────────────────────
  species-climate:
    needs: fetch-obs        # starts only after fetch-obs succeeds
    runs-on: ubuntu-latest
    timeout-minutes: 240   # elevation + climate fetch ~170-200 min

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # get latest HEAD, not the trigger SHA — picks up obs data committed by fetch-obs

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Precompute species climate envelopes
        env:
          INAT_API_TOKEN: ${{ secrets.INAT_API_TOKEN }}
        run: node scripts/fetch-inat-data.js species

      # SUCCESS: one combined commit — elev-cache + species-data + report together.
      # Only one push happens, so there is no fast-forward conflict.
      - name: Commit species data
        if: success()
        run: |
          git config user.name  bogmanplantenstein
          git config user.email bogman@bogmanplantenstein.com
          git add inat/
          if git diff --staged --quiet; then
            echo "No changes to commit — species data is already up to date"
          else
            git commit -m "chore: monthly iNat species-climate refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✓ Species data committed and pushed"
          fi

      # FAILURE / TIMEOUT: salvage whatever elevation progress was written to disk.
      # The script flushes elev-cache.json every 1,000 cells, so even a mid-run
      # timeout preserves partial elevation data for the next attempt.
      # (Job timeout = cancelled(), script error = failure(); both are caught here.)
      - name: Commit elevation cache
        if: failure() || cancelled()
        run: |
          git config user.name  bogmanplantenstein
          git config user.email bogman@bogmanplantenstein.com
          git add inat/elev-cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No elevation cache changes to commit"
          else
            git commit -m "chore: update elevation cache $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✓ Elevation cache committed and pushed"
          fi

      - name: Show species report
        if: always()
        run: |
          if [ -f inat/species-report.json ]; then
            echo "=== Species Report ==="
            cat inat/species-report.json
          fi
