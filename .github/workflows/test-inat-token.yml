name: Test iNat API Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token authenticates
        run: |
          echo "--- Checking token authenticates with iNat ---"
          status=$(curl -s -o me.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/users/me")

          echo "HTTP status: $status"

          if [ "$status" = "200" ]; then
            echo "✓ Token is valid"
            python3 -c "
          import json, sys
          d = json.load(open('me.json'))
          print(f'  Authenticated as: {d[\"login\"]} ({d.get(\"name\", \"no display name\")})')
          print(f'  Observations:     {d[\"observations_count\"]}')
          "
          elif [ "$status" = "401" ]; then
            echo "✗ Token rejected (401) — check it was copied in full and hasn't expired"
            exit 1
          else
            echo "✗ Unexpected status $status"
            cat me.json
            exit 1
          fi

      - name: Check rate limit headers with auth
        run: |
          echo ""
          echo "--- Checking rate limit behaviour ---"
          curl -s -o /dev/null -D headers.txt \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/observations?per_page=1&taxon_name=Drosera&quality_grade=research&captive=false"

          echo "Response headers:"
          grep -i "x-ratelimit\|x-request\|retry-after" headers.txt || echo "  (no rate limit headers — iNat doesn't expose them directly, this is normal)"

      - name: Confirm observation data returns correctly
        run: |
          echo ""
          echo "--- Spot-check: Drosera research-grade wild observations ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/observations?per_page=1&taxon_name=Drosera&quality_grade=research&captive=false" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          total = d['total_results']
          print(f'  Total Drosera research-grade wild observations: {total:,}')
          if total > 0:
              obs = d['results'][0]
              print(f'  Sample obs ID:    {obs[\"id\"]}')
              print(f'  Sample taxon:     {obs[\"taxon\"][\"name\"]}')
              print(f'  Sample location:  {obs.get(\"place_guess\", \"(none)\")}')
              print(f'  Geoprivacy:       {obs.get(\"geoprivacy\", \"open\")}')
              print(f'  Photos:           {len(obs.get(\"photos\", []))}')
              print('✓ Data structure looks correct')
          else:
              print('✗ No results returned — unexpected')
              sys.exit(1)
          "

      - name: Count check for a small genus (Aldrovanda)
        run: |
          echo ""
          echo "--- Count check: Aldrovanda (small genus, quick sanity check) ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/observations?per_page=1&taxon_name=Aldrovanda&quality_grade=research&captive=false" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          total = d['total_results']
          print(f'  Aldrovanda research-grade wild: {total:,}')
          if total > 0:
              print('✓ Count endpoint working correctly')
          else:
              print('  (0 results — may be a taxon name issue, check manually)')
          "
