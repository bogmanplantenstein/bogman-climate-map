name: Test iNat API Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token authenticates
        run: |
          echo "--- Checking token authenticates with iNat ---"
          status=$(curl -s -o me.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/users/me")

          echo "HTTP status: $status"
          echo "Raw response:"
          cat me.json

          if [ "$status" = "200" ]; then
            echo ""
            echo "✓ Token is valid — parsing user info..."
            python3 -c "
          import json, sys
          raw = open('me.json').read()
          d = json.loads(raw)
          # /users/me may return the user directly or wrapped in results[]
          user = d['results'][0] if 'results' in d else d
          print(f'  Authenticated as: {user[\"login\"]}')
          print(f'  Display name:     {user.get(\"name\", \"(none)\")}')
          print(f'  Observations:     {user.get(\"observations_count\", \"?\")}')
          "
          elif [ "$status" = "401" ]; then
            echo ""
            echo "✗ 401 Unauthorized — token was rejected by iNat"
            echo "  Check: Settings → Secrets → INAT_API_TOKEN is set and not truncated"
            echo "  Refresh at: https://www.inaturalist.org/users/api_token"
            exit 1
          else
            echo ""
            echo "✗ Unexpected HTTP status: $status"
            exit 1
          fi

      - name: Spot-check observation data
        run: |
          echo ""
          echo "--- Spot-check: Drosera research-grade wild ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/observations?per_page=1&taxon_name=Drosera&quality_grade=research&captive=false" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          total = d.get('total_results', 0)
          print(f'  Total Drosera research-grade wild: {total:,}')
          if total > 0:
              obs = d['results'][0]
              print(f'  Sample obs ID:   {obs[\"id\"]}')
              print(f'  Sample taxon:    {obs[\"taxon\"][\"name\"]}')
              print(f'  Sample location: {obs.get(\"place_guess\", \"(obscured)\")}')
              print(f'  Geoprivacy:      {obs.get(\"geoprivacy\") or \"open\"}')
              print(f'  Photos:          {len(obs.get(\"photos\", []))}')
              print('✓ Observation data structure looks correct')
          else:
              print('✗ Zero results — unexpected, check API connectivity')
              sys.exit(1)
          "

      - name: Count check — Aldrovanda (small genus)
        run: |
          echo ""
          echo "--- Count check: Aldrovanda ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.INAT_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.inaturalist.org/v1/observations?per_page=1&taxon_name=Aldrovanda&quality_grade=research&captive=false" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          total = d.get('total_results', 0)
          print(f'  Aldrovanda research-grade wild: {total:,}')
          print('✓ Count endpoint working')
          "
