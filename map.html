<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bogman Climate Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
<script src="https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:           #0d1117;
  --bg-panel:     #161b22;
  --bg-elevated:  #1f2937;
  --border:       #30363d;
  --text-primary: #e6edf3;
  --text-muted:   #8b949e;
  --accent:       #3fb950;
  --accent-dim:   #1a4a2a;
  --danger:       #f85149;
  --warning:      #d29922;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ── Loading bar ─────────────────────────────────────────── */
#loading-bar-wrap {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  z-index: 9999;
  background: rgba(63,185,80,0.12);
}
#loading-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.35s ease;
  border-radius: 0 2px 2px 0;
}

/* ── App shell ───────────────────────────────────────────── */
#bmg-map-app {
  display: flex;
  width: 100%;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

#map-container {
  flex: 1;
  height: 100%;
  min-width: 0;
  transition: flex 0.3s ease;
  position: relative;
}

#map { width: 100%; height: 100%; }

/* ── Side panel ──────────────────────────────────────────── */
#side-panel {
  width: 0;
  height: 100%;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  transition: width 0.3s ease;
  display: flex;
  flex-direction: column;
}
#side-panel.open {
  width: 40%;
  min-width: 320px;
  max-width: 520px;
}

#panel-drag-handle {
  width: 44px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
  display: none;
  flex-shrink: 0;
}

#panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#panel-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 4px;
  transition: color 0.15s;
}
#panel-close:hover { color: var(--text-primary); }

.temp-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  font-size: 11px;
}
.temp-toggle button {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 3px 9px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.temp-toggle button.active {
  background: var(--accent-dim);
  color: var(--accent);
}

#panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 18px 18px 24px;
}
#panel-scroll::-webkit-scrollbar { width: 4px; }
#panel-scroll::-webkit-scrollbar-track { background: transparent; }
#panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Panel content ───────────────────────────────────────── */
.p-species-name {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--text-primary);
  line-height: 1.3;
  margin-bottom: 3px;
}
.p-common-name {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.p-location {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.5;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 11px;
  border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
}
.badge-koppen {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.badge-muted {
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.section-divider {
  height: 1px;
  background: var(--border);
  margin: 14px 0;
}
.section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 7px;
}
.description-text {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.65;
  margin-bottom: 14px;
}

/* ── Climate stats ───────────────────────────────────────── */
.climate-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.climate-stat {
  background: var(--bg-elevated);
  border-radius: 6px;
  padding: 10px 12px;
}
.climate-stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.climate-stat-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}
.climate-stat-unit {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 1px;
}
.climate-pending {
  background: var(--bg-elevated);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 14px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
}

.expand-btn {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 9px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 2px;
}
.expand-btn:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

#climate-expanded { display: none; }
#climate-expanded.open { display: block; }

.chart-wrap {
  position: relative;
  height: 190px;
  margin: 14px 0;
}

/* ── Climate table ───────────────────────────────────────── */
.climate-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 16px;
}
.climate-table th {
  color: var(--text-muted);
  text-align: left;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
}
.climate-table td {
  padding: 5px 6px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  color: var(--text-primary);
}
.climate-table tr:last-child td { border-bottom: none; }
.climate-table .annual-row td {
  color: var(--accent);
  border-top: 1px solid var(--border);
  font-weight: 600;
}

/* ── Gallery link ────────────────────────────────────────── */
.gallery-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 6px;
  text-decoration: none;
  font-size: 13px;
  margin-top: 14px;
  transition: background 0.15s;
}
.gallery-link:hover { background: #234f2e; }

/* ── Map overlay controls ────────────────────────────────── */
.map-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 15px;
  transition: background 0.15s;
  user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.map-btn:hover { background: var(--bg-elevated); }
.map-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ── Filter toggle + panel ───────────────────────────────── */
#filter-toggle {
  position: absolute;
  top: 10px; left: 10px;
  z-index: 1001;
}

#filter-panel {
  position: absolute;
  top: 54px; left: 10px;
  z-index: 1000;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 210px;
  max-width: 240px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  display: none;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
}
#filter-panel.open { display: block; }
#filter-panel::-webkit-scrollbar { width: 3px; }
#filter-panel::-webkit-scrollbar-thumb { background: var(--border); }

#filter-panel-inner { padding: 12px; }

.filter-group-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 5px;
  margin-top: 10px;
}
.filter-group-title:first-child { margin-top: 0; }

.filter-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
  padding: 2px 0;
  user-select: none;
}
.filter-label input[type=checkbox] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.genus-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.filter-count {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: auto;
}

#filter-reset {
  width: 100%;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  padding: 5px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 10px;
  transition: color 0.15s, border-color 0.15s;
  display: none;
}
#filter-reset:hover { color: var(--text-primary); border-color: var(--text-muted); }

/* ── Unmapped toggle + panel ─────────────────────────────── */
#unmapped-toggle {
  position: absolute;
  bottom: 10px; left: 10px;
  z-index: 1001;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 12px;
  padding: 6px 11px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
#unmapped-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); }

#unmapped-panel {
  position: absolute;
  bottom: 54px; left: 10px;
  z-index: 1000;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 330px;
  max-height: 380px;
  display: none;
  flex-direction: column;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
#unmapped-panel.open { display: flex; }

#unmapped-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#unmapped-header span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.copy-csv-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s;
}
.copy-csv-btn:hover { color: var(--text-primary); }

#unmapped-list {
  overflow-y: auto;
  flex: 1;
}
#unmapped-list::-webkit-scrollbar { width: 3px; }
#unmapped-list::-webkit-scrollbar-thumb { background: var(--border); }

.unmapped-row {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  gap: 7px;
  font-size: 12px;
}
.unmapped-row:last-child { border-bottom: none; }
.unmapped-name {
  font-family: 'Lora', serif;
  font-style: italic;
  flex: 1;
  color: var(--text-primary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unmapped-country {
  color: var(--text-muted);
  font-size: 11px;
  flex-shrink: 0;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unmapped-icons { display: flex; gap: 2px; flex-shrink: 0; }
.unmapped-icon { font-size: 10px; opacity: 0.55; }

/* ── Overlap popup ───────────────────────────────────────── */
.overlap-popup {
  background: var(--bg-panel);
  border-radius: 6px;
  min-width: 180px;
  overflow: hidden;
}
.overlap-popup-title {
  padding: 6px 10px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.overlap-item {
  padding: 7px 10px;
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  transition: background 0.1s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.overlap-item:last-child { border-bottom: none; }
.overlap-item:hover { background: var(--bg-elevated); }
.overlap-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Leaflet overrides ───────────────────────────────────── */
.leaflet-popup-content-wrapper {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  border-radius: 6px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
  color: var(--text-primary) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; }
.leaflet-popup-tip-container { display: none !important; }
.leaflet-popup-close-button { color: var(--text-muted) !important; }

.leaflet-tooltip {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  font-family: 'Lora', serif !important;
  font-style: italic !important;
  font-size: 12px !important;
  border-radius: 4px !important;
  box-shadow: none !important;
  white-space: nowrap;
}
.leaflet-tooltip::before { display: none !important; }

.koppen-tooltip {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 11px !important;
  border-radius: 4px !important;
  box-shadow: none !important;
  padding: 4px 8px !important;
}
.koppen-tooltip::before { display: none !important; }

.leaflet-control-zoom a {
  background: var(--bg-panel) !important;
  color: var(--text-primary) !important;
  border-color: var(--border) !important;
}
.leaflet-control-zoom a:hover { background: var(--bg-elevated) !important; }
.leaflet-bar { border: none !important; box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important; }
.leaflet-bar a { border-bottom-color: var(--border) !important; }
.leaflet-control-attribution {
  background: rgba(13,17,23,0.7) !important;
  color: var(--text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--text-muted) !important; }

/* ── Köppen click popup ──────────────────────────────────── */
.kp-popup { padding: 10px 12px; min-width: 170px; }
.kp-popup-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.kp-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.kp-code { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text-primary); }
.kp-desc { font-size: 12px; color: var(--text-primary); margin-bottom: 3px; }
.kp-group { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
.kp-climate-btn {
  display: block; width: 100%;
  margin-top: 9px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s;
}
.kp-climate-btn:hover { background: #234f2e; }

/* ── Köppen Legend Panel ─────────────────────────────────── */
.koppen-legend-wrap { position: relative; }
.koppen-legend-panel {
  display: none;
  position: absolute;
  right: 0;
  top: 38px;
  width: 210px;
  max-height: 72vh;
  overflow-y: auto;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.55);
  z-index: 800;
}
.koppen-legend-panel.open { display: block; }
.legend-group-label {
  padding: 6px 10px 4px;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
.koppen-legend-panel .legend-group-label:first-child { border-top: none; }
.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 2px 10px 2px 12px;
}
.legend-swatch {
  width: 11px; height: 11px;
  border-radius: 2px;
  flex-shrink: 0;
  opacity: 0.9;
}
.legend-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-primary);
  width: 30px;
  flex-shrink: 0;
}
.legend-desc { font-size: 11px; color: var(--text-muted); }

/* ── Location Search ─────────────────────────────────────── */
#search-container {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1001;
  width: 300px;
  max-width: calc(100% - 140px);
}
#search-input-wrap {
  display: flex;
  align-items: center;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
#search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  padding: 8px 10px;
  min-width: 0;
}
#search-input::placeholder { color: var(--text-muted); }
#search-clear {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1;
  padding: 4px 10px 4px 4px;
  cursor: pointer;
  display: none;
  flex-shrink: 0;
}
#search-clear:hover { color: var(--text-primary); }
#search-clear.visible { display: block; }
#search-suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  overflow: hidden;
  display: none;
  z-index: 1002;
  max-height: 260px;
  overflow-y: auto;
}
#search-suggestions.open { display: block; }
.search-suggestion {
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  transition: background 0.1s;
}
.search-suggestion:last-child { border-bottom: none; }
.search-suggestion:hover, .search-suggestion.highlighted { background: var(--bg-elevated); }
.search-suggestion-name {
  font-size: 13px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-suggestion-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-suggestion-sep {
  padding: 4px 12px 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}
.search-suggestion-taxon-name {
  font-size: 13px;
  color: var(--text-primary);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-suggestion-taxon-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.search-suggestion-genus-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
  #search-container { width: calc(100% - 100px); max-width: none; }
  #side-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    width: 100% !important;
    max-width: none !important;
    min-width: unset !important;
    height: 0;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;

  #panel-scroll { max-height: calc(72vh - 80px); }

  #filter-panel { max-width: calc(100vw - 20px); }
}

/* ── iNat filter panel ───────────────────────────────────────── */
#inat-panel {
  display: none;
  position: absolute;
  top: 10px;
  right: 54px;
  width: 280px;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  z-index: 900;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  font-size: 12px;
}
#inat-panel.open { display: block; }
#inat-panel::-webkit-scrollbar { width: 4px; }
#inat-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.inat-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.inat-toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.inat-toggle-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  text-transform: none;
  letter-spacing: 0;
}
/* pill toggle */
.inat-switch { position: relative; display: inline-block; width: 36px; height: 20px; }
.inat-switch input { opacity: 0; width: 0; height: 0; }
.inat-slider {
  position: absolute; inset: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}
.inat-slider:before {
  content: '';
  position: absolute;
  left: 2px; top: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: transform 0.2s, background 0.2s;
}
.inat-switch input:checked + .inat-slider { background: var(--accent-dim); border-color: var(--accent); }
.inat-switch input:checked + .inat-slider:before { transform: translateX(16px); background: var(--accent); }

.inat-section {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.inat-section:last-child { border-bottom: none; }
.inat-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  padding: 2px 0 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.inat-section-head .inat-chevron { transition: transform 0.2s; }
.inat-section-head.collapsed .inat-chevron { transform: rotate(-90deg); }
.inat-section-body { display: flex; flex-direction: column; gap: 3px; }
.inat-section-body.hidden { display: none; }

.inat-check-label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-primary);
  cursor: pointer;
  padding: 1px 0;
}
.inat-check-label input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
.inat-genus-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.inat-check-all {
  font-size: 10px;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0 0 4px;
  text-align: left;
  opacity: 0.8;
}
.inat-check-all:hover { opacity: 1; }

.inat-status {
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}
.inat-loading-bar {
  height: 2px;
  background: var(--accent-dim);
  margin: 0 12px 8px;
  border-radius: 1px;
  overflow: hidden;
}
.inat-loading-bar-inner {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.3s ease;
  animation: inat-indeterminate 1.5s ease infinite;
}
@keyframes inat-indeterminate {
  0%   { margin-left: 0%;    width: 30%; }
  50%  { margin-left: 50%;   width: 40%; }
  100% { margin-left: 100%;  width: 0%; }
}

/* ── iNat map markers ────────────────────────────────────────── */
.inat-cluster-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 1px 6px rgba(0,0,0,0.5);
  transition: transform 0.1s;
}
.inat-cluster-icon:hover { transform: scale(1.1); }
.inat-obscured-rect {
  stroke-dasharray: 5, 4;

  stroke-width: 1.5;
}

/* ── iNat side panel content ─────────────────────────────────── */
.inat-panel-back {

}
.inat-panel-back:hover { opacity: 0.8; }

.inat-cluster-title {
  font-size: 13px;
  font-weight: 600;

}
.inat-cluster-sub {
  font-size: 11px;

}

.inat-species-list { display: flex; flex-direction: column; gap: 4px; }
.inat-species-row {

  justify-content: space-between;

}

.inat-obs-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.inat-obs-card {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg-elevated);
  border-radius: 6px;

  border: 1px solid transparent;
  transition: border-color 0.15s;
  align-items: flex-start;
}
.inat-obs-card:hover { border-color: var(--border); }
.inat-obs-thumb {
  width: 48px;

}

.inat-obs-taxon {
  font-style: italic;
  font-size: 12px;

  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.inat-obs-date { font-size: 11px; color: var(--text-muted); }
.inat-obs-user { font-size: 11px; color: var(--text-muted); }
.inat-obs-badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.inat-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.inat-badge-rg  { background: rgba(63,185,80,0.15); color: var(--accent); border: 1px solid rgba(63,185,80,0.3); }
.inat-badge-nid { background: rgba(210,153,34,0.15); color: var(--warning); border: 1px solid rgba(210,153,34,0.3); }
.inat-badge-obs { background: rgba(100,130,200,0.15); color: #7ba4f0; border: 1px solid rgba(100,130,200,0.3); }

.inat-load-more {
  width: 100%;
  margin-top: 6px;
  padding: 7px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  transition: color 0.15s;
}
.inat-load-more:hover { color: var(--text-primary); }

/* iNat detail view */
.inat-detail-photo-gallery {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.inat-detail-photo {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  background: var(--bg-elevated);
}
.inat-detail-photo-loading {
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: 6px;
  background: var(--bg-elevated);
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
.inat-detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 5px; }
.inat-detail-notes {
  font-size: 12px;
  color: var(--text-primary);
  line-height: 1.6;
  margin-bottom: 12px;
  background: var(--bg-elevated);
  border-radius: 6px;
  padding: 8px 10px;
}
.inat-detail-id-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.inat-detail-id-row:last-child { border-bottom: none; }
.inat-detail-id-taxon { font-style: italic; color: var(--text-primary); }
.inat-detail-id-user  { color: var(--text-muted); font-size: 11px; }
.inat-view-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 12px;
  padding: 8px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
  transition: border-color 0.15s;
}
.inat-view-link:hover { border-color: var(--accent); }

/* ── iNat collapsible sections ───────────────────────── */
.inat-section {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-top: 8px;
  overflow: hidden;
}
.inat-section > summary {
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
  background: var(--bg-elevated);
}
.inat-section > summary::-webkit-details-marker { display: none; }
.inat-section > summary::after {
  content: '›';
  margin-left: auto;
  font-size: 16px;
  color: var(--text-muted);
  transition: transform 0.2s;
}
.inat-section[open] > summary::after { transform: rotate(90deg); }
.inat-section > summary:hover { background: var(--bg-panel); }
.inat-section-body {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
}

@media (max-width: 768px) {
  #inat-panel { right: 10px; top: auto; bottom: 80px; width: calc(100vw - 20px); max-height: 55vh; }
}

/* ── Species sidebar ─────────────────────────────────────── */
.sp-header {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.sp-photo {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  border: 1px solid var(--border);

}
.sp-photo-placeholder {
  width: 80px;
  height: 80px;
  border-radius: 8px;
  flex-shrink: 0;

  align-items: center;

}
.sp-header-text {

  flex-direction: column;

  min-width: 0;
}
.sp-scientific-name {
  font-size: 16px;

  font-weight: 600;

}
.sp-common-name { font-size: 12px; color: var(--text-muted); }
.sp-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.sp-meta a { color: var(--accent); text-decoration: none; }
.sp-meta a:hover { text-decoration: underline; }

.sp-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;

}
.sp-stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.sp-stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.sp-stat-value {
  font-size: 19px;
  font-weight: 600;
  color: var(--text-primary);

}
.sp-stat-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

.sp-chart-section { margin: 12px 0; }
.sp-chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.sp-chart-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.sp-hemi-btn {
  font-size: 11px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 4px;
  padding: 3px 8px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;

}
.sp-hemi-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.sp-hemi-btn.active-sh { border-color: var(--accent); color: var(--accent); }
#sp-chart-container { height: 200px; position: relative; }
.sp-chart-note {
  font-size: 10px;
  color: var(--text-muted);

}

.sp-koppen-row {

  align-items: center;

  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.sp-koppen-row:last-child { border-bottom: none; }
.sp-koppen-name { flex: 1; font-size: 11px; color: var(--text-muted); }
.sp-koppen-pct { font-size: 11px; font-weight: 600; color: var(--text-primary); min-width: 32px; text-align: right; }

.sp-expand-btn {

  margin-top: 8px;
  padding: 6px;

  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}

.sp-wiki-text { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.sp-sample-note {

  margin-top: 12px;

}

<body>

<div id="loading-bar-wrap"><div id="loading-bar"></div></div>

<div id="bmg-map-app">

  <div id="map-container">
    <div id="map"></div>

    <div id="search-container">
      <div id="search-input-wrap">
        <input id="search-input" type="text" placeholder="Search location…" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
        <button id="search-clear" title="Clear search">×</button>
      </div>
      <div id="search-suggestions"></div>
    </div>

    <!-- iNat filter panel -->
    <div id="inat-panel">
      <div class="inat-panel-header">
        <span>iNaturalist</span>
        <div class="inat-toggle-row">
          <span class="inat-toggle-label">Show pins</span>
          <label class="inat-switch">
            <input type="checkbox" id="inat-visible-toggle">
            <span class="inat-slider"></span>
          </label>
        </div>
      </div>
      <div id="inat-status" class="inat-status" style="display:none"></div>
      <div id="inat-loading-bar" class="inat-loading-bar" style="display:none">
        <div class="inat-loading-bar-inner"></div>
      </div>

      <!-- Genera -->
      <div class="inat-section">
        <div class="inat-section-head" data-target="inat-genera-body">
          Genera <span class="inat-chevron">▾</span>
        </div>
        <div class="inat-section-body" id="inat-genera-body">
          <button class="inat-check-all" id="inat-genera-all">Select all</button>
          <div id="inat-genera-checks"></div>
        </div>
      </div>

      <!-- Quality -->
      <div class="inat-section">
        <div class="inat-section-head" data-target="inat-quality-body">
          Quality <span class="inat-chevron">▾</span>
        </div>
        <div class="inat-section-body" id="inat-quality-body">
          <label class="inat-check-label">
            <input type="checkbox" id="inat-rg" checked> Research grade
          </label>
          <label class="inat-check-label">
            <input type="checkbox" id="inat-nid"> Needs ID
          </label>
        </div>
      </div>

      <!-- Köppen zones -->
      <div class="inat-section">
        <div class="inat-section-head" data-target="inat-koppen-body">
          Köppen Zone <span class="inat-chevron">▾</span>
        </div>
        <div class="inat-section-body hidden" id="inat-koppen-body">
          <button class="inat-check-all" id="inat-koppen-all">Select all</button>
          <div id="inat-koppen-checks"></div>
        </div>
      </div>
    </div>

    <!-- Positioned inside map-container so they sit over the map only -->
    <button id="filter-toggle" class="map-btn" title="Filters">☰</button>
    <div id="filter-panel">
      <div id="filter-panel-inner">
        <div class="filter-group-title">Genus</div>
        <div id="filter-genus"></div>
        <div class="filter-group-title">Köppen Group</div>
        <div id="filter-koppen"></div>
        <div class="filter-group-title">Elevation Band</div>
        <div id="filter-elev"></div>
        <button id="filter-reset">↺ Reset filters</button>
      </div>
    </div>

    <button id="unmapped-toggle">📋 Unmapped (<span id="unmapped-count">…</span>)</button>
    <div id="unmapped-panel">
      <div id="unmapped-header">
        <span>Unmapped Taxa</span>
        <button class="copy-csv-btn" id="copy-csv">Copy CSV</button>
      </div>
      <div id="unmapped-list"></div>
    </div>
  </div>

  <div id="side-panel">
    <div id="panel-drag-handle"></div>
    <div id="panel-header">
      <div class="temp-toggle">
        <button id="unit-f">°F</button>
        <button id="unit-c">°C</button>
      </div>
      <button id="panel-close">×</button>
    </div>
    <div id="panel-scroll">
      <div id="panel-content"></div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════

const DATA_URL    = 'https://raw.githubusercontent.com/bogmanplantenstein/bogmangallery/main/data/data.json';
const KOPPEN_URL_LOCAL    = './koppen.geojson';
const KOPPEN_URL_FALLBACK = 'https://raw.githubusercontent.com/circleofconfusion/climate-map/master/topojson/1976-2000.geojson';
const GALLERY_BASE = 'https://www.burymeinthebog.com/species#/taxon/';

const GENUS_COLORS = {
  'Dionaea':     '#FF4444',
  'Drosera':     '#FF69B4',
  'Pinguicula':  '#9B7FD4',
  'Utricularia': '#00CED1',
  'Byblis':      '#7FBA00',

  'Nepenthes':   '#20B2AA',
  'Cephalotus':  '#DAA520',
  'Heliamphora': '#87CEEB',
  'Aldrovanda':  '#98FB98',
  'default':     '#888888'

const KOPPEN_COLORS = {
  'Af':'#0000FF','Am':'#0077FF','Aw':'#46AAFA','As':'#46AAFA',
  'BWh':'#FF0000','BWk':'#FF9696','BSh':'#F5A500','BSk':'#FFDB63',
  'Csa':'#FFFF00','Csb':'#C6C700','Csc':'#969600',
  'Cwa':'#96FF96','Cwb':'#64C864','Cwc':'#329632',
  'Cfa':'#C8FF50','Cfb':'#64FF50','Cfc':'#32C800',

function genusColor(genus) {
  return GENUS_COLORS[genus] || GENUS_COLORS['default'];
}

function toDisplay(celsius, unit) {
  if (celsius == null) return '—';
  return unit === 'F'
    ? Math.round(celsius * 9/5 + 32) + '°F'
    : Math.round(celsius) + '°C';
}

function koppenGroup(code) {
  if (!code) return '?';
  const g = code[0];
  return ['A','B','C','D','E','H'].includes(g) ? g : '?';
}

function getElevBand(taxon) {
  return taxon.elevationBand || taxon.mapPin?.elevationBand || null;
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pinHtml(genus, precise, selected) {
  const color = genusColor(genus);
  const dash  = precise ? '' : 'stroke-dasharray="3,2"';
  const op    = precise ? '0.9' : '0.7';
  const scale = selected ? 'transform:scale(1.45)' : '';
  return `<div style="transition:transform 0.15s;${scale}">
    <svg width="20" height="20" viewBox="0 0 20 20" style="display:block">
      <circle cx="10" cy="10" r="8" fill="${color}" stroke="white" stroke-width="2" ${dash} opacity="${op}"/>
    </svg>
  </div>`;
}

function makeIcon(taxon, selected = false) {
  const precise = !taxon.mapPin || taxon.mapPin.coordinatePrecision === 'exact';
  return L.divIcon({
    className: '',
    html: pinHtml(taxon.genus, precise, selected),
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -14]
  });
}

function updateKoppenBlur() {
  const pane = map.getPane('koppenPane');
  if (!pane) return;
  const z = map.getZoom();
  // 0.1° ≈ 11km resolution; meaningful through zoom ~8
  const blur    = z <= 9 ? 0 : z === 10 ? 1 : 2;
  const opacity = z <= 10 ? 1 : z === 11 ? 0.6 : z === 12 ? 0.25 : 0;
  pane.style.filter  = blur > 0 ? `blur(${blur}px)` : '';
  pane.style.opacity = opacity;
}

function initMap() {
  map = L.map('map', {
    center: [20, 10], zoom: 3,
    minZoom: 2, maxZoom: 16,
    zoomControl: false,
    worldCopyJump: true
  });

  map.createPane('koppenPane');
  map.getPane('koppenPane').style.zIndex = 250;
  map.on('zoomend', updateKoppenBlur);

  // Re-render map tiles whenever the side panel finishes opening/closing.
  // Without this Leaflet leaves a blank strip where the panel was.
  document.getElementById('side-panel').addEventListener('transitionend', e => {
    if (e.propertyName === 'width') map.invalidateSize({ animate: false });
  });

  // Labels pane sits above the Köppen overlay so country names are always readable
  map.createPane('labelsPane');
  map.getPane('labelsPane').style.zIndex = 350;
  map.getPane('labelsPane').style.pointerEvents = 'none';

  darkTiles = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
    { attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>', subdomains: 'abcd', maxZoom: 20 }
  ).addTo(map);

  darkLabelsTiles = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',
    { pane: 'labelsPane', subdomains: 'abcd', maxZoom: 20 }
  ).addTo(map);

  satTiles = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: '© Esri, Maxar, Earthstar Geographics', maxZoom: 20 }
  );

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Close panel when clicking empty map
  map.on('click', e => {
    if (selectedId) { closePanel(); return; }
    if (searchPanelOpen) { closeLocationPanel(); return; }
    if (koppenVisible && koppenGeoRaster) showKoppenPopup(e.latlng);
  });
}

function koppenCodeFromProps(props) {
  return props.CODE || props.code || props.Cls || props.GRIDCODE || props.Koppen || null;
}

async function loadKoppen() {
  const PATH_01 = './koppen_geiger_tif/1991_2020/koppen_geiger_0p1.tif';

  const colorFn = values => {
    const v = values[0];
    if (!v || v < 1 || v > 30) return null;
    const c = BECK_COLORS[v];
    return c ? `rgb(${c[0]},${c[1]},${c[2]})` : null;
  };

  try {
    const buf = await fetch(PATH_01).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
    if (!buf) return;
    koppenGeoRaster = await parseGeoraster(buf);
    koppenLayer = new GeoRasterLayer({
      georaster: koppenGeoRaster, pane: 'koppenPane',
      opacity: satelliteActive ? 0.35 : 0.55,
      resolution: 64, pixelValuesToColorFn: colorFn
    });
    if (koppenVisible) koppenLayer.addTo(map);
    updateKoppenBlur();
  } catch { /* overlay unavailable */ }
}

function getKoppenAt(lat, lng) {
  const g = koppenGeoRaster;
  if (!g || !g.values || !g.values[0]) return 0;
  const col = Math.floor((lng - g.xmin) / g.pixelWidth);
  const row = Math.floor((g.ymax - lat) / g.pixelHeight);
  if (row < 0 || row >= g.height || col < 0 || col >= g.width) return 0;
  return g.values[0][row][col];
}

function showKoppenPopup(latlng) {
  const v = getKoppenAt(latlng.lat, latlng.lng);
  if (!v || v < 1 || v > 30) return;
  const zone = BECK_ZONES[v];
  const [r, g, b] = BECK_COLORS[v];
  L.popup({ maxWidth: 240 })
    .setLatLng(latlng)
    .setContent(
      `<div class="kp-popup">` +
      `<div class="kp-popup-head"><span class="kp-swatch" style="background:rgb(${r},${g},${b})"></span><span class="kp-code">${zone.code}</span></div>` +
      `<div class="kp-desc">${zone.desc}</div>` +
      `<div class="kp-group">${zone.group}</div>` +
      `<button class="kp-climate-btn" onclick="openClimateAt(${latlng.lat},${latlng.lng})">↓ Load climate data</button>` +
      `</div>`
    )
    .openOn(map);
}

function renderPins(taxa) {
  taxa.forEach(taxon => {
    const { lat, lng, rangeRadiusKm, coordinatePrecision } = taxon.mapPin;
    const color = genusColor(taxon.genus);

    const marker = L.marker([lat, lng], { icon: makeIcon(taxon), zIndexOffset: 100 });
    marker.bindTooltip(taxon.displayName, { direction: 'top' });
    marker.on('click', e => { L.DomEvent.stopPropagation(e); handlePinClick(e, taxon); });
    marker.addTo(map);

    let circle = null;
    if (rangeRadiusKm) {
      circle = L.circle([lat, lng], {
        radius:      rangeRadiusKm * 1000,
        color,
        fillColor:   color,
        fillOpacity: 0.07,
        weight:      1,
        opacity:     0.28,
        interactive: false
      }).addTo(map);
    }

    markerStore.set(taxon.id, { marker, circle, taxon });
  });

  updatePinCount();
}

function updatePinCount() {
  let n = 0;
  markerStore.forEach(({ marker }) => { if (map.hasLayer(marker)) n++; });
  // Update unmapped toggle label with pin count hint
  const toggleEl = document.getElementById('unmapped-toggle');
  if (toggleEl) {
    const cnt = document.getElementById('unmapped-count');
    // cnt text is set in buildUnmappedList
  }
}

// ═══════════════════════════════════════════════════════════
//  OVERLAP DETECTION
// ═══════════════════════════════════════════════════════════

function handlePinClick(e, taxon) {
  const clickPt = map.latLngToContainerPoint(e.latlng);
  const nearby  = [];

  markerStore.forEach(({ marker, taxon: t }) => {
    if (!map.hasLayer(marker)) return;
    const pt = map.latLngToContainerPoint(marker.getLatLng());
    const dx = pt.x - clickPt.x, dy = pt.y - clickPt.y;
    if (Math.sqrt(dx*dx + dy*dy) < 14) nearby.push(t);
  });

  if (nearby.length > 1) {
    showOverlapPopup(e.latlng, nearby);
  } else {
    openPanel(taxon);
    flyToTaxon(taxon);
  }
}

function showOverlapPopup(latlng, taxa) {
  const items = taxa.map(t =>
    `<div class="overlap-item" data-id="${esc(t.id)}">
      <div class="overlap-dot" style="background:${genusColor(t.genus)}"></div>
      ${esc(t.displayName)}
    </div>`
  ).join('');

  const popup = L.popup({ className: '', closeButton: false, offset: [0, -5] })
    .setLatLng(latlng)
    .setContent(`<div class="overlap-popup">
      <div class="overlap-popup-title">${taxa.length} species at this location</div>
      ${items}
    </div>`)
    .openOn(map);

  setTimeout(() => {
    document.querySelectorAll('.overlap-item').forEach(el => {
      el.addEventListener('click', () => {
        map.closePopup(popup);
        const t = taxa.find(x => x.id === el.dataset.id);
        if (t) { openPanel(t); flyToTaxon(t); }
      });
    });
  }, 0);
}

function flyToTaxon(taxon) {
  const prec = taxon.mapPin?.coordinatePrecision || 'exact';
  const zoom = FLY_ZOOM[prec] || 9;
  map.flyTo([taxon.mapPin.lat, taxon.mapPin.lng], zoom, { duration: 0.8 });
}

// ═══════════════════════════════════════════════════════════
//  REGION HIGHLIGHT
// ═══════════════════════════════════════════════════════════

function clearRegionHighlight() {
  if (regionHighlight) { map.removeLayer(regionHighlight); regionHighlight = null; }
}

async function highlightRegion(taxon) {
  clearRegionHighlight();
  const prec  = taxon.mapPin?.coordinatePrecision;
  const color = genusColor(taxon.genus);

  if (prec === 'regional' && taxon.mapPin?.regionCode) {
    if (!statesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_1_states_provinces.geojson');
        statesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.regionCode;
    const feat = statesGeoJSON.features.find(f =>
      f.properties.iso_3166_2 === code || f.properties.adm1_code === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }

  if (prec === 'country' && taxon.mapPin?.countryCode) {
    if (!countriesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
        countriesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.countryCode;
    const feat = countriesGeoJSON.features.find(f =>
      f.properties.ISO_A2 === code || f.properties.ADM0_A3 === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }
}

function openPanel(taxon) {
  if (searchPanelOpen) closeLocationPanel();
  // Deselect previous marker
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon: prev } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(prev, false));
  }
  selectedId = taxon.id;
  markerStore.get(taxon.id).marker.setIcon(makeIcon(taxon, true));

  renderPanel(taxon);
  document.getElementById('side-panel').classList.add('open');
  highlightRegion(taxon);
  setUrlParam('taxon', taxon.id);
}

function closePanel() {
  if (searchPanelOpen) { closeLocationPanel(); return; }
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(taxon, false));
  }
  selectedId = null;
  document.getElementById('side-panel').classList.remove('open');
  clearRegionHighlight();
  setUrlParam('taxon', null);
  if (climateChart) { climateChart.destroy(); climateChart = null; }
}

function renderPanel(taxon) {
  const pin = taxon.mapPin || {};
  const cn  = taxon.climateNormals;

  // Location string
  const locParts = [];
  if (taxon.country) locParts.push(taxon.country);
  if (pin.elevationM != null) locParts.push(pin.elevationM + 'm');
  const locStr = locParts.join(' · ');

  const coordStr = (pin.lat != null && pin.lng != null)
    ? `${pin.lat.toFixed(2)}, ${pin.lng.toFixed(2)}`
    : '';

  // Badges
  let koppenBadge = '';
  if (taxon.koppenZone) {
    const zc = KOPPEN_COLORS[taxon.koppenZone] || '#888';
    koppenBadge = `<span class="badge badge-koppen" style="color:${zc};border-color:${zc}50;background:${zc}1a">
      ${esc(taxon.koppenZone)} · ${esc(taxon.koppenLabel || KOPPEN_LABELS[taxon.koppenZone] || '')}
    </span>`;
  }

  const elev = getElevBand(taxon);
  const elevBadge = elev
    ? `<span class="badge badge-muted">${esc(elev.charAt(0).toUpperCase()+elev.slice(1))}</span>` : '';

  const habitatName = taxon.habitatId
    ? (habitatsMap[taxon.habitatId] || taxon.habitatId.replace(/_/g,' ')) : '';
  const habitatBadge = habitatName
    ? `<span class="badge badge-muted">${esc(habitatName)}</span>` : '';

  const entryBadge = `<span class="badge badge-muted">${esc(ENTRY_LABELS[taxon.entryType] || taxon.entryType)}</span>`;

  // Climate section
  let climateHtml = '';
  if (cn && (cn.tempMax || cn.tempMin) && cn.precipMm) {
    const peakHigh    = cn.tempMax ? Math.max(...cn.tempMax) : null;
    const peakLow     = cn.tempMin ? Math.min(...cn.tempMin) : null;
    const annualPrecip = Math.round(cn.precipMm.reduce((a,b)=>a+b,0));
    const meanTemp    = cn.tempMean ? cn.tempMean.reduce((a,b)=>a+b,0)/12 : null;

    climateHtml = `
      <div class="climate-grid" id="climate-grid">
        <div class="climate-stat">
          <div class="climate-stat-label">Peak High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Peak Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annualPrecip}<span class="climate-stat-unit">mm</span></div>
        </div>
        ${meanTemp != null ? `<div class="climate-stat">
          <div class="climate-stat-label">Mean Temp</div>
          <div class="climate-stat-value" data-celsius="${meanTemp}">${toDisplay(meanTemp, tempUnit)}</div>
        </div>` : ''}
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(cn)}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data not yet recorded for this taxon</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(taxon.displayName)}</div>
    ${taxon.commonName ? `<div class="p-common-name">${esc(taxon.commonName)}</div>` : ''}
    ${locStr ? `<div class="p-location">${esc(locStr)}</div>` : ''}
    ${coordStr ? `<div class="p-location" style="margin-top:-8px;opacity:0.55">${coordStr}</div>` : ''}

    <div class="badge-row">${koppenBadge}${elevBadge}${habitatBadge}${entryBadge}</div>

    ${taxon.nativeRange ? `
      <div class="section-label">Native Range</div>
      <div class="description-text">${esc(taxon.nativeRange)}</div>` : ''}

    ${taxon.nativeHabitat ? `
      <div class="section-label">Habitat</div>
      <div class="description-text">${esc(taxon.nativeHabitat)}</div>` : ''}

    <div class="section-divider"></div>
    <div class="section-label">Climate</div>
    ${climateHtml}

    <a class="gallery-link" href="${GALLERY_BASE}${esc(taxon.slug)}" target="_blank">
      View in Bogman Gallery →
    </a>
  `;

  // Wire expand button
  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && cn) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening  = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(cn);
    });
  }
}

//  CLIMATE TABLE
// ═══════════════════════════════════════════════════════════

function buildClimateTable(cn) {
  const hasMean = !!(cn.tempMean && cn.tempMean.length);
  const rows = MONTHS.map((m, i) => {
    const hi    = cn.tempMax   ? cn.tempMax[i]   : null;
    const lo    = cn.tempMin   ? cn.tempMin[i]   : null;
    const mean  = hasMean       ? cn.tempMean[i]  : null;
    const prec  = cn.precipMm  ? cn.precipMm[i]  : null;
    return `<tr>
      <td>${m}</td>
      <td data-celsius="${hi}">${toDisplay(hi, tempUnit)}</td>
      <td data-celsius="${lo}">${toDisplay(lo, tempUnit)}</td>
      ${hasMean ? `<td data-celsius="${mean}">${toDisplay(mean, tempUnit)}</td>` : ''}
      <td>${prec != null ? Math.round(prec)+'mm' : '—'}</td>
    </tr>`;
  }).join('');

  const annHi   = cn.tempMax  ? Math.max(...cn.tempMax)              : null;
  const annLo   = cn.tempMin  ? Math.min(...cn.tempMin)              : null;
  const annPrec = cn.precipMm ? Math.round(cn.precipMm.reduce((a,b)=>a+b,0)) : null;

  return `<table class="climate-table">
    <thead><tr>
      <th>Month</th><th>High</th><th>Low</th>
      ${hasMean ? '<th>Mean</th>' : ''}
      <th>Precip</th>
    </tr></thead>
    <tbody>
      ${rows}
      <tr class="annual-row">
        <td>Annual</td>
        <td data-celsius="${annHi}">${toDisplay(annHi, tempUnit)}</td>
        <td data-celsius="${annLo}">${toDisplay(annLo, tempUnit)}</td>
        ${hasMean ? '<td>—</td>' : ''}
        <td>${annPrec != null ? annPrec+'mm' : '—'}</td>
      </tr>
    </tbody>
  </table>`;
}

function buildLightTable(cn) {
  const hasRH   = cn.rhMean && cn.rhMean.some(v => v != null);

  const rows = MONTHS.map((mon, i) => {
    const dl   = cn.daylightHrs?.[i];
    const dli  = cn.dli?.[i];
    const ppfd = cn.ppfd?.[i];
    const rhHi  = cn.rhHigh?.[i];
    const rhAvg = cn.rhMean?.[i];
    const rhLo  = cn.rhLow?.[i];
    return `<tr>

                   <td>${rhLo  != null ? Math.round(rhLo)  + '%' : '—'}</td>` : ''}
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;margin-bottom:16px">
    <table class="climate-table">

        ${hasPPFD ? '<th title="Avg PPFD during daylight (μmol/m²/s)">PPFD</th>' : ''}
        ${hasRH   ? '<th title="RH high — overnight/dawn">RH High</th><th title="Mean relative humidity">RH Avg</th><th title="RH low — peak afternoon">RH Low</th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function nominatimZoom(result) {
  const rank = parseInt(result.place_rank) || 20;
  if (rank <= 4)  return 4;
  if (rank <= 8)  return 5;
  if (rank <= 12) return 7;
  if (rank <= 16) return 9;
  if (rank <= 22) return 11;
  return 13;
}

async function fetchNominatim(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1`;
  try {
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function fetchSearchClimateNormals(lat, lng) {
  // 10-year window: smaller payload than 30yr, still statistically solid for normals
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&start_date=2014-01-01&end_date=2023-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,daylight_duration,shortwave_radiation_sum&timezone=UTC`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const raw = d.daily;
    if (!raw || !raw.time) return null;

    const tmaxSum  = new Array(12).fill(0), tmaxCnt  = new Array(12).fill(0);
    const tminSum  = new Array(12).fill(0), tminCnt  = new Array(12).fill(0);
    const precSum  = new Array(12).fill(0);
    const precYrs  = Array.from({length: 12}, () => new Set());
    const dlSum    = new Array(12).fill(0), dlCnt    = new Array(12).fill(0);
    const radSum   = new Array(12).fill(0), radCnt   = new Array(12).fill(0);

    raw.time.forEach((date, i) => {
      const m = parseInt(date.substring(5, 7)) - 1;
      const y = date.substring(0, 4);
      const tmax = raw.temperature_2m_max[i];
      if (tmax != null) { tmaxSum[m] += tmax; tmaxCnt[m]++; }
      const tmin = raw.temperature_2m_min[i];
      if (tmin != null) { tminSum[m] += tmin; tminCnt[m]++; }
      const p = raw.precipitation_sum[i];
      if (p != null) { precSum[m] += p; precYrs[m].add(y); }
      const dl = raw.daylight_duration[i];
      if (dl != null) { dlSum[m] += dl; dlCnt[m]++; }
      const rad = raw.shortwave_radiation_sum[i];
      if (rad != null) { radSum[m] += rad; radCnt[m]++; }
    });

    // Monthly avg daylight in hours
    const daylightHrs = dlSum.map((s, m) => dlCnt[m] ? s / dlCnt[m] / 3600 : null);
    // Monthly avg shortwave radiation MJ/m²/day
    const radiation = radSum.map((s, m) => radCnt[m] ? s / radCnt[m] : null);
    // DLI mol/m²/day = radiation × 2.02 (PAR fraction × photon conversion)
    const dli = radiation.map(r => r != null ? r * 2.02 : null);
    // Avg PPFD μmol/m²/s = (radiation MJ/m² × 1e6 J) / daylight_seconds × 2.02
    const ppfd = radiation.map((r, m) => {
      const dlSec = dlCnt[m] ? dlSum[m] / dlCnt[m] : null;
      return (r != null && dlSec) ? (r * 1e6 / dlSec) * 2.02 : null;
    });

    return {
      tempMax:    tmaxSum.map((s, m) => tmaxCnt[m] ? s / tmaxCnt[m] : null),
      tempMin:    tminSum.map((s, m) => tminCnt[m] ? s / tminCnt[m] : null),
      precipMm:   precSum.map((s, m) => precYrs[m].size ? s / precYrs[m].size : null),
      daylightHrs, dli, ppfd
    };
  } catch { return null; }
}

async function fetchRHNormals(lat, lng) {
  // 5-year hourly RH → daily high/low/mean → monthly averages
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&start_date=2019-01-01&end_date=2023-12-31&hourly=relative_humidity_2m&timezone=UTC`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const raw = d.hourly;
    if (!raw || !raw.time) return null;

    // Roll up hourly → daily stats
    const daily = {}; // "YYYY-MM-DD" → {max, min, sum, cnt}
    raw.time.forEach((dt, i) => {
      const date = dt.substring(0, 10);
      const v = raw.relative_humidity_2m[i];
      if (v == null) return;
      if (!daily[date]) daily[date] = { max: -Infinity, min: Infinity, sum: 0, cnt: 0 };
      const s = daily[date];
      if (v > s.max) s.max = v;
      if (v < s.min) s.min = v;
      s.sum += v; s.cnt++;
    });

    // Roll up daily → monthly averages of high/mean/low
    const hiSum  = new Array(12).fill(0), hiCnt  = new Array(12).fill(0);
    const loSum  = new Array(12).fill(0), loCnt  = new Array(12).fill(0);
    const avgSum = new Array(12).fill(0), avgCnt = new Array(12).fill(0);
    Object.entries(daily).forEach(([date, s]) => {
      const m = parseInt(date.substring(5, 7)) - 1;
      if (s.max > -Infinity) { hiSum[m]  += s.max;         hiCnt[m]++; }
      if (s.min <  Infinity) { loSum[m]  += s.min;         loCnt[m]++; }
      if (s.cnt > 0)         { avgSum[m] += s.sum / s.cnt; avgCnt[m]++; }
    });

    return {
      rhHigh: hiSum.map((s, m)  => hiCnt[m]  ? s / hiCnt[m]  : null),
      rhLow:  loSum.map((s, m)  => loCnt[m]  ? s / loCnt[m]  : null),
      rhMean: avgSum.map((s, m) => avgCnt[m] ? s / avgCnt[m] : null)
    };
  } catch { return null; }
}

function buildLocationPanel(state) {
  const { result, lat, lng, normals, loading } = state;
  const name = result._name || result.display_name.split(',')[0];
  const a = result.address || {};
  const subLabel = [a.state, a.country].filter(Boolean).join(', ');

  const v = getKoppenAt(lat, lng);
  let koppenBadgeHtml = '';
  if (v >= 1 && v <= 30) {
    const zone = BECK_ZONES[v];
    const [cr, cg, cb] = BECK_COLORS[v];
    koppenBadgeHtml = `<div class="badge-row"><span class="badge badge-koppen" style="color:rgb(${cr},${cg},${cb});border-color:rgba(${cr},${cg},${cb},0.3);background:rgba(${cr},${cg},${cb},0.1)">${esc(zone.code)} · ${esc(zone.desc)}</span></div>`;
  }

  // Destroy any stale charts before re-rendering panel content
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  if (lightChart)   { lightChart.destroy();   lightChart   = null; }

  let climateHtml;
  if (loading) {
    climateHtml = `<div class="climate-pending">Loading climate data…</div>`;
  } else if (normals && normals.tempMax && normals.tempMin && normals.precipMm) {
    const validMax = normals.tempMax.filter(x => x != null);
    const validMin = normals.tempMin.filter(x => x != null);
    const peakHigh = validMax.length ? Math.max(...validMax) : null;
    const peakLow  = validMin.length ? Math.min(...validMin) : null;
    const annPrec  = Math.round(normals.precipMm.reduce((a, b) => a + (b || 0), 0));

    const validDLI = normals.dli ? normals.dli.filter(x => x != null) : [];
    const avgDLI   = validDLI.length ? validDLI.reduce((a, b) => a + b, 0) / validDLI.length : null;

    const validRH = normals.rhMean ? normals.rhMean.filter(v => v != null) : [];
    const annRHAvg = validRH.length ? validRH.reduce((a, b) => a + b, 0) / validRH.length : null;

    climateHtml = `
      <div class="climate-grid">
        <div class="climate-stat"><div class="climate-stat-label">Avg Daily High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div></div>
        <div class="climate-stat"><div class="climate-stat-label">Avg Daily Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div></div>
        <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
        ${avgDLI != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg DLI</div>
          <div class="climate-stat-value">${avgDLI.toFixed(1)}<span class="climate-stat-unit">mol/m²</span></div></div>` : ''}
        ${annRHAvg != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg RH</div>
          <div class="climate-stat-value">${Math.round(annRHAvg)}<span class="climate-stat-unit">%</span></div></div>` : ''}
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="section-label">Temperature &amp; Precipitation</div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(normals)}
        ${normals.daylightHrs ? `
          <div class="section-divider"></div>
          <div class="section-label">Light &amp; Atmosphere</div>
          <div class="chart-wrap"><canvas id="light-chart"></canvas></div>
          ${buildLightTable(normals)}
        ` : ''}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data unavailable for this location</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(name)}</div>
    ${subLabel ? `<div class="p-common-name">${esc(subLabel)}</div>` : ''}
    <div class="p-location">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
    ${koppenBadgeHtml}
    <div class="section-divider"></div>
    <div class="section-label">Climate (2014–2023 avg)</div>
    ${climateHtml}
  `;

  document.getElementById('side-panel').classList.add('open');

  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && normals && !loading) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(normals);
      if (opening && !lightChart && normals.daylightHrs) buildLightChart(normals);
    });
  }
}

window.openClimateAt = async function(lat, lng) {
  map.closePopup();

  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  // Clear search bar since this is a raw map click, not a search result
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950', weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  const coordName = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
  const token = {};
  const fakeResult = { _name: coordName, display_name: coordName, lat: String(lat), lon: String(lng), place_rank: 30, address: {} };

  searchState = { result: fakeResult, lat, lng, normals: null, loading: true, token };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  const [geocode, normals, rh] = await Promise.all([
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&format=json`, { headers: { 'Accept-Language': 'en' } })
      .then(r => r.ok ? r.json() : null).catch(() => null),
    fetchSearchClimateNormals(lat, lng),
    fetchRHNormals(lat, lng)
  ]);

  if (!searchPanelOpen || !searchState || searchState.token !== token) return;

  if (geocode && geocode.display_name) {
    searchState.result = {
      _name: geocode.display_name.split(',')[0],
      display_name: geocode.display_name,
      lat: String(lat), lon: String(lng),
      place_rank: 30,
      address: geocode.address || {}
    };
  }
  searchState.normals = normals ? { ...normals, ...(rh || {}) } : null;
  searchState.loading = false;
  buildLocationPanel(searchState);
};

let searchCurrentSuggestions = [];
let searchHighlightedIdx = -1;

function renderSuggestions(results) {
  searchCurrentSuggestions = results;
  searchHighlightedIdx = -1;
  const el = document.getElementById('search-suggestions');
  if (!results.length) { el.classList.remove('open'); return; }

  const taxa   = results.filter(r => r._type === 'inat-taxon');
  const locs   = results.filter(r => r._type !== 'inat-taxon');
  const showSep = taxa.length > 0 && locs.length > 0;

  const taxaHtml = taxa.map((r, _) => {
    const i = results.indexOf(r);
    const dot   = `<span class="search-suggestion-genus-dot" style="background:${INAT_GENUS_COLORS[r.genus] || '#aaa'}"></span>`;
    const count = r.count > 0 ? `<span style="color:var(--text-muted);font-size:11px;font-style:normal">${r.count.toLocaleString()} sightings</span>` : '';
    const sub   = [r.commonName, r.genus].filter(Boolean);
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-taxon-row">${dot}<div class="search-suggestion-taxon-name">${esc(r.taxonName)}</div>${count}</div>
      ${sub.length ? `<div class="search-suggestion-sub">${esc(sub.join(' · '))}</div>` : ''}
    </div>`;
  }).join('');

  const locsHtml = locs.map(r => {
    const i = results.indexOf(r);
    const name = r.display_name.split(',')[0];
    const a = r.address || {};
    const sub = [a.state, a.country].filter(Boolean).join(', ') || (r.type || '').replace(/_/g, ' ');
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-name">${esc(name)}</div>
      ${sub ? `<div class="search-suggestion-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML =
    (taxa.length ? `<div class="search-suggestion-sep">Species</div>${taxaHtml}` : '') +
    (showSep     ? `<div class="search-suggestion-sep">Locations</div>` : '') +
    locsHtml;

  el.classList.add('open');
}

function selectSearchResult(result) {
  if (result._type === 'inat-taxon') { selectInatTaxon(result); return; }
  // Clear any active species filter when a location is chosen
  if (inatSpeciesFilter) { inatSpeciesFilter = null; rebuildInatIndex(); }
  const lat = parseFloat(result.lat);
  const lng = parseFloat(result.lon);
  const zoom = nominatimZoom(result);
  const name = result.display_name.split(',')[0];

  document.getElementById('search-input').value = name;
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  // Close taxon panel if open
  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }

  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  map.flyTo([lat, lng], zoom, { duration: 1.0 });

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950',
    weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  searchState = { result, lat, lng, normals: null, loading: true };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  Promise.all([fetchSearchClimateNormals(lat, lng), fetchRHNormals(lat, lng)])
    .then(([normals, rh]) => {
      if (!searchPanelOpen || !searchState || searchState.result !== result) return;
      searchState.normals = normals ? { ...normals, ...(rh || {}) } : null;
      searchState.loading = false;
      buildLocationPanel(searchState);
    });
}

function searchInatTaxa(q) {
  if (!inatTaxa.length) return [];
  const ql = q.toLowerCase();

  // Lazy taxon count map
  if (!searchInatTaxa._counts) {
    const counts = new Map();
    for (const o of inatObs) counts.set(o[OBS_TI], (counts.get(o[OBS_TI]) || 0) + 1);
    searchInatTaxa._counts = counts;
  }
  const counts = searchInatTaxa._counts;

  const seen = new Set();
  const top = [], rest = [];

  for (let ti = 0; ti < inatTaxa.length; ti++) {
    const [taxonId, taxonName, genus, commonName] = inatTaxa[ti];
    if (seen.has(taxonName)) continue;
    const sciL  = taxonName.toLowerCase();
    const comL  = (commonName || '').toLowerCase();
    const matchSci = sciL.includes(ql);
    const matchCom = comL.includes(ql);
    if (!matchSci && !matchCom) continue;
    seen.add(taxonName);
    const entry = { _type: 'inat-taxon', taxonId, taxonName, genus, commonName, count: counts.get(ti) || 0 };
    (sciL.startsWith(ql) || comL.startsWith(ql) ? top : rest).push(entry);
    if (top.length + rest.length >= 12) break;
  }

  return [...top, ...rest].slice(0, 7);
}

function loadSpeciesData() {
  if (!inatSpeciesDataPromise) {
    inatSpeciesDataPromise = fetch('./inat/species-data.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(d => { inatSpeciesData = d.species; return d.species; })
      .catch(err => {
        console.error('Failed to load species-data.json:', err);
        inatSpeciesDataPromise = null; // allow retry
        return null;
      });
  }
  return inatSpeciesDataPromise;
}

async function openSpeciesSidebar(taxonId, taxonName) {

  inatNav.speciesTaxonName = taxonName;
