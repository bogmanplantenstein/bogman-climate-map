function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function nominatimZoom(result) {
  const rank = parseInt(result.place_rank) || 20;
  if (rank <= 4)  return 4;
  if (rank <= 8)  return 5;
  if (rank <= 12) return 7;
  if (rank <= 16) return 9;
  if (rank <= 22) return 11;
  return 13;
}

async function fetchNominatim(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1`;
  try {
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    return r.ok ? r.json() : [];
  } catch { return []; }
}

// ════════════════════════════════════════════════════════════
//  POINT CLIMATE + ELEVATION  (live per-point fetch, lapse, daylight)
// ════════════════════════════════════════════════════════════

// Astronomical monthly average daylight hours from latitude (no API call needed).
// Computed for the 15th of each month using standard solar declination formula.
// Returns 12 monthly values. Handles polar day (24) and polar night (0).
function computeMonthlyDaylightHours(lat) {
  const monthMidDoys = [15, 46, 75, 106, 136, 167, 197, 228, 259, 289, 320, 350];
  const latRad = lat * Math.PI / 180;
  return monthMidDoys.map(doy => {
    const decl  = 23.45 * Math.sin(2 * Math.PI * (284 + doy) / 365) * Math.PI / 180;
    const arg   = -Math.tan(latRad) * Math.tan(decl);
    if (arg >=  1) return 0;     // polar night
    if (arg <= -1) return 24;    // polar day
    return 24 / Math.PI * Math.acos(arg);
  });
}

async function fetchSearchClimateNormals(lat, lng) {
  // 10-year window: smaller payload than 30yr, still statistically solid for normals.
  // Switched from Open-Meteo to NASA POWER (MERRA-2) in 2026-05 after Open-Meteo's
  // 10k/day per-IP cap caused live queries to fail from throttled residential IPs.
  // POWER has no documented per-IP cap and returns temp + precip + RH + radiation
  // in a single request.
  const url = `https://power.larc.nasa.gov/api/temporal/daily/point` +
    `?parameters=T2M_MAX,T2M_MIN,PRECTOTCORR,RH2M,ALLSKY_SFC_SW_DWN` +
    `&community=AG&latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}` +
    `&start=20140101&end=20231231&format=JSON`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const params = d?.properties?.parameter;
    if (!params || !params.T2M_MAX) return null;

    const FILL    = -999;
    const isValid = v => v != null && v !== FILL && isFinite(v);

    // Per-month buckets of DAILY values (not just sums). We need the full
    // distribution to compute extreme percentiles (p10 of daily mins, p90 of
    // daily maxes) for the "typical cold snap / heat wave" display. Means
    // are computed from these buckets at the end so we don't double-iterate.
    const tmaxByMonth = Array.from({ length: 12 }, () => []);
    const tminByMonth = Array.from({ length: 12 }, () => []);
    const yearlyMin   = {};   // year → minimum daily temp (for USDA zone)
    // Precip/RH/radiation only need monthly sums + counts.
    const precSum = new Array(12).fill(0);
    const precYrs = Array.from({ length: 12 }, () => new Set());
    const rhSum   = new Array(12).fill(0), rhCnt   = new Array(12).fill(0);
    const radSum  = new Array(12).fill(0), radCnt  = new Array(12).fill(0);

    for (const dateKey of Object.keys(params.T2M_MAX)) {
      const m = parseInt(dateKey.substring(4, 6), 10) - 1;   // YYYYMMDD → month
      const y = dateKey.substring(0, 4);

      const tmax = params.T2M_MAX[dateKey];
      if (isValid(tmax)) tmaxByMonth[m].push(tmax);
      const tmin = params.T2M_MIN[dateKey];
      if (isValid(tmin)) {
        tminByMonth[m].push(tmin);
        if (yearlyMin[y] == null || tmin < yearlyMin[y]) yearlyMin[y] = tmin;
      }
      const p = params.PRECTOTCORR?.[dateKey];
      if (isValid(p))    { precSum[m] += p;    precYrs[m].add(y); }
      const rh = params.RH2M?.[dateKey];
      if (isValid(rh))   { rhSum[m]   += rh;   rhCnt[m]++; }
      const rad = params.ALLSKY_SFC_SW_DWN?.[dateKey];
      if (isValid(rad))  { radSum[m]  += rad;  radCnt[m]++; }
    }

    // Inline percentile helper (used several times below). Linear-interpolated
    // percentile on a sorted array. p in 0–100.
    const percentile = (arr, p) => {
      if (!arr.length) return null;
      const s = [...arr].sort((a, b) => a - b);
      const i = (p / 100) * (s.length - 1);
      const lo = Math.floor(i), hi = Math.ceil(i);
      return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (i - lo);
    };

    // Monthly averages of daily highs/lows (the existing visualisation lines)
    const tempMax = tmaxByMonth.map(arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
    const tempMin = tminByMonth.map(arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
    // Monthly extreme bands: p90 of daily highs (typical hot extreme that
    // month), p10 of daily lows (typical cold extreme that month). These
    // shade the band on the chart.
    const tempMaxHi = tmaxByMonth.map(arr => percentile(arr, 90));
    const tempMinLo = tminByMonth.map(arr => percentile(arr,  10));

    // Annual extreme stats (computed across ALL daily values in the window)
    const allTmaxs = tmaxByMonth.flat();
    const allTmins = tminByMonth.flat();
    const typicalHottestDay = percentile(allTmaxs, 95);   // 95th percentile of daily highs
    const typicalColdestDay = percentile(allTmins,  5);   // 5th percentile of daily lows
    // Days below freezing per year (averaged over the years in the dataset)
    const years = Object.keys(yearlyMin).length || 1;
    const daysBelowFreezing = Math.round(allTmins.filter(v => v < 0).length / years);
    // USDA hardiness zone computed from average annual min (mean of yearly
    // coldest daily temps).
    const yearlyMins = Object.values(yearlyMin);
    const avgAnnualMin = yearlyMins.length
      ? yearlyMins.reduce((a, b) => a + b, 0) / yearlyMins.length
      : null;
    const usdaZone = avgAnnualMin != null ? toUSDAZone(avgAnnualMin) : null;

    // Astronomical daylight hours per month (no API needed — POWER doesn't return this).
    const daylightHrs = computeMonthlyDaylightHours(lat);
    // Monthly avg shortwave radiation MJ/m²/day (same units as Open-Meteo's
    // shortwave_radiation_sum, so DLI/PPFD conversion factors carry over unchanged).
    const radiation = radSum.map((s, m) => radCnt[m] ? s / radCnt[m] : null);
    // DLI mol/m²/day = radiation × 2.02 (PAR fraction × photon conversion)
    const dli = radiation.map(r => r != null ? r * 2.02 : null);
    // Avg PPFD μmol/m²/s = (radiation MJ/m² × 1e6 J) / daylight_seconds × 2.02
    const ppfd = radiation.map((r, m) => {
      const dlSec = daylightHrs[m] != null ? daylightHrs[m] * 3600 : null;
      return (r != null && dlSec) ? (r * 1e6 / dlSec) * 2.02 : null;
    });

    return {
      // POWER returns [lng, lat, elev_m] — modelElev is the MERRA-2 grid elevation,
      // used for lapse-rate correction against terrain elevation.
      modelElev:  d.geometry?.coordinates?.[2] ?? null,
      tempMax,
      tempMin,
      tempMaxHi,        // NEW: p90 of daily highs per month (typical heat-wave high)
      tempMinLo,        // NEW: p10 of daily lows per month (typical cold-snap low)
      precipMm:   precSum.map((s, m) => precYrs[m].size ? s / precYrs[m].size : null),
      daylightHrs, dli, ppfd,
      // POWER /daily returns only daily-mean RH (no diurnal max/min). The old
      // Open-Meteo hourly path used to compute rhHigh/rhLow; those fields have
      // been removed since no UI surfaces them anymore.
      rhMean:     rhSum.map((s, m) => rhCnt[m] ? s / rhCnt[m] : null),
      // Annual extreme summary stats (computed across all daily values in the 10-yr window)
      typicalHottestDay,        // 95th percentile of all daily highs
      typicalColdestDay,        // 5th  percentile of all daily lows
      daysBelowFreezing,        // average # of frost days per year
      avgAnnualMin,             // mean of yearly coldest temps (drives USDA zone)
      usdaZone,                 // string like "7a" or null
    };
  } catch { return null; }
}

// ── USDA hardiness zone ──────────────────────────────────────────────
// Map average annual minimum temperature (°C) to USDA zone code (e.g. "7a").
// Each zone is 5°F wide, with 'a' and 'b' subzones 2.5°F apart. Table from
// USDA Agricultural Research Service (2023 update).
const USDA_ZONES = [
  { min: -Infinity, max: -51.1, code: '1a' },
  { min: -51.1,     max: -48.3, code: '1b' },
  { min: -48.3,     max: -45.6, code: '2a' },
  { min: -45.6,     max: -42.8, code: '2b' },
  { min: -42.8,     max: -40.0, code: '3a' },
  { min: -40.0,     max: -37.2, code: '3b' },
  { min: -37.2,     max: -34.4, code: '4a' },
  { min: -34.4,     max: -31.7, code: '4b' },
  { min: -31.7,     max: -28.9, code: '5a' },
  { min: -28.9,     max: -26.1, code: '5b' },
  { min: -26.1,     max: -23.3, code: '6a' },
  { min: -23.3,     max: -20.6, code: '6b' },
  { min: -20.6,     max: -17.8, code: '7a' },
  { min: -17.8,     max: -15.0, code: '7b' },
  { min: -15.0,     max: -12.2, code: '8a' },
  { min: -12.2,     max: -9.4,  code: '8b' },
  { min:  -9.4,     max: -6.7,  code: '9a' },
  { min:  -6.7,     max: -3.9,  code: '9b' },
  { min:  -3.9,     max: -1.1,  code: '10a' },
  { min:  -1.1,     max:  1.7,  code: '10b' },
  { min:   1.7,     max:  4.4,  code: '11a' },
  { min:   4.4,     max:  7.2,  code: '11b' },
  { min:   7.2,     max: 10.0,  code: '12a' },
  { min:  10.0,     max: 12.8,  code: '12b' },
  { min:  12.8,     max: 15.6,  code: '13a' },
  { min:  15.6,     max: Infinity, code: '13b' },
];
function toUSDAZone(avgAnnualMinC) {
  const z = USDA_ZONES.find(z => avgAnnualMinC >= z.min && avgAnnualMinC < z.max);
  return z?.code || null;
}

// Kept as a no-op for backward compatibility with existing Promise.all() callers.
// RH is now bundled into fetchSearchClimateNormals above (single POWER request).
// Returning null is safe: the post-Promise merge only writes rh* fields if non-null,
// so the rhMean already on `normals` from the main fetch is preserved.
async function fetchRHNormals(_lat, _lng) {
  return null;
}

async function _retired_fetchRHNormals_oldOpenMeteo(lat, lng) {
  // Retained as reference. The old hourly Open-Meteo path computed rhHigh / rhLow
  // from per-day max/min of hourly relative_humidity_2m values. Replaced because
  // (a) Open-Meteo throttles aggressively at 10k/day per IP and (b) downstream
  // species rendering only ever read rhMean.
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&start_date=2019-01-01&end_date=2023-12-31&hourly=relative_humidity_2m&timezone=UTC`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const raw = d.hourly;
    if (!raw || !raw.time) return null;

    // Roll up hourly → daily stats
    const daily = {}; // "YYYY-MM-DD" → {max, min, sum, cnt}
    raw.time.forEach((dt, i) => {
      const date = dt.substring(0, 10);
      const v = raw.relative_humidity_2m[i];
      if (v == null) return;
      if (!daily[date]) daily[date] = { max: -Infinity, min: Infinity, sum: 0, cnt: 0 };
      const s = daily[date];
      if (v > s.max) s.max = v;
      if (v < s.min) s.min = v;
      s.sum += v; s.cnt++;
    });

    // Roll up daily → monthly averages of high/mean/low
    const hiSum  = new Array(12).fill(0), hiCnt  = new Array(12).fill(0);
    const loSum  = new Array(12).fill(0), loCnt  = new Array(12).fill(0);
    const avgSum = new Array(12).fill(0), avgCnt = new Array(12).fill(0);
    Object.entries(daily).forEach(([date, s]) => {
      const m = parseInt(date.substring(5, 7)) - 1;
      if (s.max > -Infinity) { hiSum[m]  += s.max;         hiCnt[m]++; }
      if (s.min <  Infinity) { loSum[m]  += s.min;         loCnt[m]++; }
      if (s.cnt > 0)         { avgSum[m] += s.sum / s.cnt; avgCnt[m]++; }
    });

    return {
      rhHigh: hiSum.map((s, m)  => hiCnt[m]  ? s / hiCnt[m]  : null),
      rhLow:  loSum.map((s, m)  => loCnt[m]  ? s / loCnt[m]  : null),
      rhMean: avgSum.map((s, m) => avgCnt[m] ? s / avgCnt[m] : null)
    };
  } catch { return null; }
}

async function fetchTerrainElevation(lat, lng) {
  // Open-Meteo Elevation (Copernicus GLO-90, ~90 m) — CORS-enabled & keyless.
  // (OpenTopoData, used by the Node pipeline, can't be called from the browser
  // because it sends no CORS headers.)
  const r = await fetchElevationBatch([[lat, lng]]);
  return (r && r[0] != null) ? r[0] : null;
}

// ── Humidity/temperature-aware lapse rate ────────────────────────────
// Returns the local lapse rate in °C per km for the given monthly mean
// temperature, relative humidity, and elevation. Instead of a flat 6.5°C/km,
// we blend the dry adiabatic rate (~9.77°C/km, dry air cools fast) toward the
// moist adiabatic rate (~4–6°C/km, latent-heat release slows cooling in humid
// air) by relative humidity. So a humid summer bog gets a shallow rate and a
// dry/cold month gets a steep one — the seasonal/spatial variation a flat
// constant ignores. This is a physically-motivated proxy for the environmental
// lapse rate, not a measured value (it can't see inversions or cold-air
// pooling), but it uses only data we already have (T from T2M_MAX/MIN, RH from
// RH2M) and brackets the 6.5 standard at moderate conditions.
function lapseRateCkm(tempC, rhPct, elevM) {
  const g = 9.81, cpd = 1004.6, Hv = 2.501e6, Rsd = 287.05, eps = 0.622;
  const T = tempC + 273.15;
  // Surface pressure from elevation (barometric formula), hPa
  const P  = 1013.25 * Math.pow(1 - 2.25577e-5 * (elevM || 0), 5.25588);
  // Saturation vapour pressure (Tetens), hPa → saturation mixing ratio, kg/kg
  const es = 6.112 * Math.exp(17.67 * tempC / (tempC + 243.5));
  const rs = eps * es / Math.max(P - es, 1e-3);
  // Moist (saturated) adiabatic lapse rate, K/m → K/km
  const gMoist = g * (1 + Hv * rs / (Rsd * T)) /
                 (cpd + Hv * Hv * rs * eps / (Rsd * T * T)) * 1000;
  const gDry = g / cpd * 1000;   // ≈ 9.77 °C/km
  const rh = Math.max(0, Math.min(100, rhPct == null ? 55 : rhPct));
  const gamma = gDry - (gDry - gMoist) * (rh / 100);
  return Math.max(4.0, Math.min(9.8, gamma));
}

// Apply a per-month, humidity-aware lapse correction to every temperature
// field, moving from the climate model's grid elevation to a target elevation.
// Each month uses its own mean T and RH to pick the rate.
function applyHumidityLapse(normals, targetElevM) {
  const modelElev = normals.modelElev;
  if (targetElevM == null || modelElev == null) return normals;
  const dzKm = (targetElevM - modelElev) / 1000;
  const out = { ...normals };
  for (const f of ['tempMax', 'tempMin', 'tempMaxHi', 'tempMinLo']) {
    if (!Array.isArray(normals[f])) continue;
    out[f] = normals[f].map((v, m) => {
      if (v == null) return null;
      const meanT = (normals.tempMax?.[m] != null && normals.tempMin?.[m] != null)
        ? (normals.tempMax[m] + normals.tempMin[m]) / 2 : v;
      const rate = lapseRateCkm(meanT, normals.rhMean?.[m], modelElev);
      return Math.round((v - rate * dzKm) * 10) / 10;
    });
  }
  return out;
}

// Mean monthly lapse rate (°C/km) for a set of normals — used for the obscured
// cell's "temperatures may vary by ~X°C" caveat.
function meanLapseRate(normals, elevM) {
  const rates = [];
  for (let m = 0; m < 12; m++) {
    const hi = normals.tempMax?.[m], lo = normals.tempMin?.[m];
    if (hi == null || lo == null) continue;
    rates.push(lapseRateCkm((hi + lo) / 2, normals.rhMean?.[m], elevM));
  }
  return rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : 6.5;
}

// Backwards-compatible wrapper: exact-point elevation correction (used by the
// search/click path). Delegates to the humidity-aware per-month correction.
function applyLapseRateCorrection(normals, terrainElev) {
  return applyHumidityLapse(normals, terrainElev);
}

// ── Batch elevation + obscured-cell elevation range ──────────────────
// Open-Meteo Elevation API (Copernicus GLO-90, ~90 m): CORS-enabled and
// keyless, up to 100 coordinates per request. We use it instead of OpenTopoData
// because OpenTopoData's public API doesn't send CORS headers, so it can't be
// called from the browser (the Node data pipeline still uses OpenTopoData).
async function fetchElevationBatch(points) {
  if (!points.length) return [];
  const lats = points.map(p => p[0].toFixed(5)).join(',');
  const lngs = points.map(p => p[1].toFixed(5)).join(',');
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
    if (!r.ok) return null;
    const d = await r.json();
    return Array.isArray(d.elevation) ? d.elevation.map(v => (v != null && isFinite(v)) ? v : null) : null;
  } catch { return null; }
}

// Adaptive 2-pass min/max/median elevation across an obscured 0.2° cell.
// Pass 1: a coarse 9×9 grid (~2.4 km). Pass 2: a fine 5×5 grid (~0.5 km) around
// the coarse min and max points. Cached per cell (in-memory + sessionStorage).
const _cellElevCache = new Map();
async function sampleCellElevationRange(swLat, swLng, sizeDeg = 0.2) {
  const key = `${swLat.toFixed(4)},${swLng.toFixed(4)}`;
  if (_cellElevCache.has(key)) return _cellElevCache.get(key);
  try {
    const ss = sessionStorage.getItem('bmg_cellelev_' + key);
    if (ss) { const v = JSON.parse(ss); _cellElevCache.set(key, v); return v; }
  } catch {}

  const N = 9, coarse = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    coarse.push([swLat + (i + 0.5) / N * sizeDeg, swLng + (j + 0.5) / N * sizeDeg]);
  const e1 = await fetchElevationBatch(coarse);
  if (!e1) return null;

  const all = [];
  let minPt = null, maxPt = null, minV = Infinity, maxV = -Infinity;
  e1.forEach((e, idx) => {
    if (e == null) return;
    all.push(e);
    if (e < minV) { minV = e; minPt = coarse[idx]; }
    if (e > maxV) { maxV = e; maxPt = coarse[idx]; }
  });

  // Pass 2: refine ±1 coarse-cell around min and max points.
  const step = sizeDeg / N, M = 5;
  const refine = (ctr) => {
    const pts = [];
    for (let i = 0; i < M; i++) for (let j = 0; j < M; j++)
      pts.push([ctr[0] - step + (i / (M - 1)) * 2 * step,
                ctr[1] - step + (j / (M - 1)) * 2 * step]);
    return pts;
  };
  let refinePts = [];
  if (minPt) refinePts = refinePts.concat(refine(minPt));
  if (maxPt) refinePts = refinePts.concat(refine(maxPt));
  if (refinePts.length) {
    const e2 = await fetchElevationBatch(refinePts);
    if (e2) e2.forEach(e => { if (e != null) all.push(e); });
  }

  if (!all.length) return null;
  all.sort((a, b) => a - b);
  const res = {
    min:    Math.round(all[0]),
    max:    Math.round(all[all.length - 1]),
    median: Math.round(all[Math.floor(all.length / 2)]),
  };
  _cellElevCache.set(key, res);
  try { sessionStorage.setItem('bmg_cellelev_' + key, JSON.stringify(res)); } catch {}
  return res;
}

// ─── Climate-match feature ─────────────────────────────────────────────
// "Find species that grow in a similar native climate to this location."
//
// TWO-PART METHOD:
//
// 1. SURVIVAL GATES (pass / marginal / fail → badges, hides unsuitable).
//    Extreme-based (extremes, not averages, decide survival):
//    - Cold: user's coldest p10 daily-low extreme (min of tempMinLo) vs the
//      species' coldLimit. pass if warmer; marginal within 2°C; fail beyond.
//    - Heat: user's hottest p90 daily-high extreme (max of tempMaxHi) vs the
//      species' hotLimit. pass if cooler; marginal up to +3°C; fail beyond.
//
// 2. MATCH SCORE 0–100 (for survivors; ranks them). Weighted blend of six
//    per-attribute sub-scores, each 0–1 by how close the user's value sits to
//    the species' typical p25–p75 band (inside band ≈ 1.0, falls off outside):
//      low temp 20 · high temp 20 · monthly alignment 20 · sunlight/DLI 15 ·
//      RH 15 · precip 10.   Sunlight contributes 0 until species DLI is present
//      (next data-refresh) — remaining weights renormalise meanwhile.
//
// Hemisphere: the species' monthly_nh / monthly_sh are chosen / rotated so the
// seasonal phase aligns with the user's location before comparing curves.
const MATCH_WEIGHTS = { low: 20, high: 20, monthly: 20, sun: 15, rh: 15, precip: 10 };

// ════════════════════════════════════════════════════════════
//  CLIMATE MATCH  (species ↔ location scoring + compare UI)
// ════════════════════════════════════════════════════════════

// Score how well `userVal` fits a species' [p25, p50, p75] band. Inside the
// band → 1.0; outside → falls off over `tol` (the attribute's tolerance in its
// own units). Symmetric. Returns 0–1, or null when data is missing.
function bandFit(userVal, band, tol) {
  if (userVal == null || !band) return null;
  const [p25, p50, p75] = Array.isArray(band) ? band : [band, band, band];
  if (p25 == null || p75 == null) return null;
  let d = 0;
  if (userVal < p25)      d = p25 - userVal;
  else if (userVal > p75) d = userVal - p75;
  return Math.max(0, 1 - d / tol);
}

// Pick the species monthly block whose seasons align with the user's hemisphere,
// rotating the opposite hemisphere's data by 6 months if only it exists. Returns
// a 12-element-array monthly object in the user's calendar.
function speciesMonthlyForUser(species, userLat) {
  const nh = species.monthly_nh, sh = species.monthly_sh;
  const wantNH = userLat >= 0;
  const have   = wantNH ? (nh || sh) : (sh || nh);
  if (!have) return null;
  const isOpposite = wantNH ? !nh : !sh;
  if (!isOpposite) return have;
  // Rotate every 12-element array by +6 months to map the opposite hemisphere's
  // seasonal phase onto the user's calendar.
  const out = {};
  for (const k of Object.keys(have)) {
    const arr = have[k];
    out[k] = (Array.isArray(arr) && arr.length === 12)
      ? arr.map((_, i) => arr[(i + 6) % 12]) : arr;
  }
  return out;
}

// Like speciesMonthlyForUser but WITHOUT the +6 hemisphere rotation — returns the
// species' monthly block on its OWN native calendar. The climate-match uses this so
// the best-fit shift search can discover (and report) the full seasonal offset,
// including the ~+6-month hemisphere flip, instead of having it pre-applied/hidden.
function speciesMonthlyRaw(species, userLat) {
  const nh = species.monthly_nh, sh = species.monthly_sh;
  return (userLat >= 0 ? (nh || sh) : (sh || nh)) || null;
}

// Monthly temperature alignment: average per-month gap between the user's
// high/low curves and the species' median high/low curves, mapped to 0–1 over
// `tol`°C of average deviation. Rewards matching seasonal shape AND level.
function monthlyAlignFit(userNormals, mon, tol = 8) {
  if (!mon?.tempMax || !mon?.tempMin) return null;
  const uHi = userNormals.tempMax, uLo = userNormals.tempMin;
  if (!uHi || !uLo) return null;
  let sum = 0, n = 0;
  for (let m = 0; m < 12; m++) {
    const sHi = mon.tempMax[m]?.[1], sLo = mon.tempMin[m]?.[1];   // species median
    if (uHi[m] != null && sHi != null) { sum += Math.abs(uHi[m] - sHi); n++; }
    if (uLo[m] != null && sLo != null) { sum += Math.abs(uLo[m] - sLo); n++; }
  }
  if (!n) return null;
  return Math.max(0, 1 - (sum / n) / tol);
}

// Linear-interpolate 12 monthly values (placed at month midpoints) to 52 weekly
// values, cyclically. Lets us test fine-grained seasonal phase shifts even though
// the source data is monthly. Nulls fall back to whichever neighbour is present.
function monthlyToWeekly(m12) {
  if (!m12 || m12.length !== 12) return null;
  const wk = new Array(52);
  for (let w = 0; w < 52; w++) {
    const monthPos = (w / 52) * 12 - 0.5;     // continuous month index at week w (midpoint-aligned)
    let m0 = Math.floor(monthPos);
    const frac = monthPos - m0;
    m0 = ((m0 % 12) + 12) % 12;
    const m1 = (m0 + 1) % 12;
    const a = m12[m0], b = m12[m1];
    wk[w] = (a == null && b == null) ? null : a == null ? b : b == null ? a : a + (b - a) * frac;
  }
  return wk;
}

// Find the cyclic weekly shift that best aligns a species' weekly hi/lo temperature
// curves to the user's. Plants respond to the *sequence* of warm/cool, not the
// calendar month, so the best-fit shift estimates how well the location's seasonal
// pattern could support the species if its growth cycle were phase-shifted (e.g.
// the +6-month hemisphere flip emerges naturally). Returns fits in 0..1.
//   calendarFit = alignment with no extra shift (same-calendar / hemisphere-aware)
//   bestFit     = alignment at the optimal shift
//   shiftWeeks  = that optimal shift (0..51)
function bestSeasonalShift(userNormals, mon, tol = 8) {
  if (!mon?.tempMax || !mon?.tempMin || !userNormals?.tempMax || !userNormals?.tempMin) return null;
  const uHi = monthlyToWeekly(userNormals.tempMax);
  const uLo = monthlyToWeekly(userNormals.tempMin);
  const sHi = monthlyToWeekly(mon.tempMax.map(x => (x ? x[1] : null)));   // species median
  const sLo = monthlyToWeekly(mon.tempMin.map(x => (x ? x[1] : null)));
  if (!uHi || !uLo || !sHi || !sLo) return null;
  const devAt = s => {
    let sum = 0, n = 0;
    for (let w = 0; w < 52; w++) {
      const i = (w + s) % 52;
      if (uHi[w] != null && sHi[i] != null) { sum += Math.abs(uHi[w] - sHi[i]); n++; }
      if (uLo[w] != null && sLo[i] != null) { sum += Math.abs(uLo[w] - sLo[i]); n++; }
    }
    return n ? sum / n : null;
  };
  const fit = d => (d == null ? null : Math.max(0, 1 - d / tol));
  const calDev = devAt(0);
  let bestS = 0, bestDev = calDev;
  for (let s = 1; s < 52; s++) {
    const d = devAt(s);
    if (d != null && (bestDev == null || d < bestDev)) { bestDev = d; bestS = s; }
  }
  // Only treat it as a real shift if it meaningfully improves alignment (>=0.5°C
  // avg) — avoids reporting trivial 1-week jitter for same-calendar species.
  const improved = calDev != null && bestDev != null && (calDev - bestDev) >= 0.5;
  if (!improved) { bestS = 0; bestDev = calDev; }
  // Report the minimal signed magnitude (−26..+26) so we never say "+51 weeks".
  const signedWeeks = bestS > 26 ? bestS - 52 : bestS;
  return { shiftWeeks: signedWeeks, calendarFit: fit(calDev), bestFit: fit(bestDev) };
}

// Annual mean of a 12×[p25,p50,p75] monthly field → [p25,p50,p75] band.
function annualBandFromMonthly(monthlyField) {
  if (!monthlyField) return null;
  const acc = [0, 0, 0], cnt = [0, 0, 0];
  for (const mo of monthlyField) {
    if (!mo) continue;
    for (let i = 0; i < 3; i++) if (mo[i] != null) { acc[i] += mo[i]; cnt[i]++; }
  }
  if (!cnt[1]) return null;
  return [0, 1, 2].map(i => cnt[i] ? acc[i] / cnt[i] : null);
}

// A real species (or finer: subspecies/variety/hybrid) name is binomial — it has
// a space. Genus / subgenus / section identifications are a single word; iNat
// returns those when an observation isn't pinned to a species. We don't present
// them as "species" in search, climate-match, or the cluster species list (their
// observations still appear on the map under their genus).
function isSpeciesRankName(name) {
  return !!name && name.trim().includes(' ');
}

// Temperature-only score uses just these three sub-scores; the rest (sun/rh/precip)
// are dropped when the "Temperatures only" toggle is on.
const MATCH_TEMP_KEYS = ['low', 'high', 'monthly'];

// Blend the sub-scores into a 0–100 number. Missing factors are dropped and the
// weights renormalised. When tempOnly, only the temperature factors count.
function blendMatchScore(sub, tempOnly = false) {
  let wSum = 0, sSum = 0;
  for (const k of Object.keys(MATCH_WEIGHTS)) {
    if (tempOnly && !MATCH_TEMP_KEYS.includes(k)) continue;
    if (sub[k] == null) continue;
    wSum += MATCH_WEIGHTS[k];
    sSum += MATCH_WEIGHTS[k] * sub[k];
  }
  return wSum ? Math.round((sSum / wSum) * 100) : 0;
}

// Precompute the user-location aggregates the scorer needs (extremes for the
// survival gates + typical values for the sub-scores). Returns null if the
// location lacks usable monthly temperatures.
function buildUserMatchCtx(userNormals) {
  const uTmaxHi = (userNormals.tempMaxHi || []).filter(v => v != null);
  const uTminLo = (userNormals.tempMinLo || []).filter(v => v != null);
  const uTmin   = (userNormals.tempMin   || []).filter(v => v != null);
  const uTmax   = (userNormals.tempMax   || []).filter(v => v != null);
  if (!uTmin.length || !uTmax.length) return null;
  const uRH   = (userNormals.rhMean   || []).filter(v => v != null);
  const uPrec = (userNormals.precipMm || []).filter(v => v != null);
  const uDli  = (userNormals.dli      || []).filter(v => v != null);
  return {
    userNormals,
    userColdExt:   uTminLo.length ? Math.min(...uTminLo) : Math.min(...uTmin),  // gate extremes
    userHotExt:    uTmaxHi.length ? Math.max(...uTmaxHi) : Math.max(...uTmax),
    userColdMonth: Math.min(...uTmin),
    userHotMonth:  Math.max(...uTmax),
    userRH:     uRH.length   ? uRH.reduce((a, b) => a + b, 0) / uRH.length : null,
    userPrecAn: uPrec.length ? uPrec.reduce((a, b) => a + b, 0) : null,        // annual mm
    userDliAvg: uDli.length  ? uDli.reduce((a, b) => a + b, 0) / uDli.length : null,
  };
}

// Score ONE species against a user location (ctx from buildUserMatchCtx). Returns
// the match result object, or null if the species lacks usable limits. Used by the
// bulk match and the single-species "rate my location" (reverse) flow.
function scoreSpeciesAtLocation(species, u, userLat = 0) {
  const stats = species.stats;
  if (!stats) return null;
  if (!isSpeciesRankName(species.scientific_name)) return null;  // skip genus/subgenus pages
  const spColdLimit = stats.coldLimit != null ? stats.coldLimit : stats.tempMin?.p10;
  const spHotLimit  = stats.hotLimit  != null ? stats.hotLimit  : stats.tempMax?.p90;
  if (spColdLimit == null || spHotLimit == null) return null;

  // ── Survival gates (extreme vs limit) ──
  let coldTier;
  if      (u.userColdExt >= spColdLimit)      coldTier = 'pass';
  else if (u.userColdExt >= spColdLimit - 2)  coldTier = 'marginal';
  else                                         coldTier = 'fail';
  let heatTier;
  if      (u.userHotExt <= spHotLimit)        heatTier = 'pass';
  else if (u.userHotExt <= spHotLimit + 3)    heatTier = 'marginal';
  else                                         heatTier = 'fail';

  // ── Per-attribute sub-scores (0–1) ──
  const mon = speciesMonthlyRaw(species, userLat);
  const sub = {};
  sub.low     = bandFit(u.userColdMonth, stats.tempMin && [stats.tempMin.p25, stats.tempMin.p50, stats.tempMin.p75], 10);
  sub.high    = bandFit(u.userHotMonth,  stats.tempMax && [stats.tempMax.p25, stats.tempMax.p50, stats.tempMax.p75], 10);
  const seas  = bestSeasonalShift(u.userNormals, mon, 8);   // best-fit over 52 weekly shifts
  sub.monthly = seas ? seas.bestFit : monthlyAlignFit(u.userNormals, mon, 8);
  sub.sun     = (u.userDliAvg != null && mon?.dli) ? bandFit(u.userDliAvg, annualBandFromMonthly(mon.dli), 12) : null;
  sub.rh      = bandFit(u.userRH, stats.rhMean && [stats.rhMean.p25, stats.rhMean.p50, stats.rhMean.p75], 20);
  sub.precip  = (u.userPrecAn != null && stats.precip)
    ? bandFit(u.userPrecAn, [stats.precip.p25, stats.precip.p50, stats.precip.p75], 700) : null;

  const score = blendMatchScore(sub, false);

  let tier;
  if      (coldTier === 'fail')                                tier = 'unsuitable';
  else if (heatTier === 'fail')                                tier = 'too-hot';
  else if (coldTier === 'marginal' || heatTier === 'marginal') tier = 'marginal';
  else if (score >= 70)                                        tier = 'excellent';
  else                                                          tier = 'possible';

  return {
    taxonId: +species.taxon_id || +species.taxonId || 0,
    species, tier, score, coldTier, heatTier, sub,
    monthlyCal: seas ? seas.calendarFit : sub.monthly,
    shiftWeeks: seas ? seas.shiftWeeks : 0,
    userColdExt: u.userColdExt, userHotExt: u.userHotExt, spColdLimit, spHotLimit,
  };
}

function matchSpeciesToLocation(userNormals, userKoppen, userLat = 0) {
  if (!inatSpeciesData) return [];
  const u = buildUserMatchCtx(userNormals);
  if (!u) return [];

  const results = [];
  for (const [taxonIdStr, species] of Object.entries(inatSpeciesData)) {
    const r = scoreSpeciesAtLocation(species, u, userLat);
    if (r) { r.taxonId = +taxonIdStr; results.push(r); }   // key is the authoritative id
  }

  // Survivors ranked by score (best first); failures pushed to the end.
  const survivable = t => (t !== 'unsuitable' && t !== 'too-hot');
  results.sort((a, b) => {
    const sa = survivable(a.tier), sb = survivable(b.tier);
    if (sa !== sb) return sa ? -1 : 1;
    return b.score - a.score;
  });
  return results;
}

// Small coloured score chip (0–100) — green high, amber mid, grey low.
function matchScoreChipHtml(score) {
  const hue = score >= 75 ? 134 : score >= 50 ? 45 : 210;
  const sat = score >= 50 ? 60 : 8;
  return `<span class="match-score" style="color:hsl(${hue},${sat}%,72%);border-color:hsl(${hue},${sat}%,42%);background:hsla(${hue},${sat}%,40%,0.15)">${score}</span>`;
}

// Temperature pass/marginal/fail badges from the gate tiers.
function matchTempBadgesHtml(m) {
  const b = (label, tier) => {
    const cls = tier === 'pass' ? 'ok' : tier === 'marginal' ? 'warn' : 'bad';
    const mark = tier === 'pass' ? '✓' : tier === 'marginal' ? '⚠' : '✗';
    return `<span class="match-badge match-badge-${cls}">${mark} ${label}</span>`;
  };
  return b('Cold', m.coldTier) + b('Heat', m.heatTier);
}

// Collapsible legend explaining what triggers the ✓ / ⚠ / ✗ Cold & Heat labels
// (the survival gates) and the score chip colours.
function matchBadgeLegendHtml() {
  return `
    <details class="match-legend">
      <summary>What do the ✓ ⚠ ✗ Cold / Heat labels mean?</summary>
      <div class="match-legend-body">
        <p>They are <b>survival gates</b> — whether your location's temperature <i>extremes</i> fall within the species' tolerance (its coldest/hottest survivable temperatures, from the coldest 10% / hottest 10% of days across its native range):</p>
        <ul>
          <li><b>✓ Cold</b> — your coldest extreme is at or above the species' cold limit.</li>
          <li><b>⚠ Cold</b> — within 2&nbsp;°C below the limit (borderline; winter protection helps).</li>
          <li><b>✗ Cold</b> — colder than it experiences in the wild.</li>
          <li><b>✓ Heat</b> — your hottest extreme is at or below its heat limit.</li>
          <li><b>⚠ Heat</b> — within 3&nbsp;°C above the limit.</li>
          <li><b>✗ Heat</b> — hotter than it experiences in the wild.</li>
        </ul>
        <p>A ✗ on either gate means <b>your extremes exceed its native heat/cold range.</b> The 0–100 <b>score</b> then ranks the survivors by overall climate similarity — <span style="color:hsl(134,60%,72%)">green ≥75</span>, <span style="color:hsl(45,60%,72%)">amber ≥50</span>, grey below.</p>
      </div>
    </details>`;
}

// Tiny note listing the score weights (derived from MATCH_WEIGHTS so it can't drift).
function matchWeightsNoteHtml() {
  const labels = { low: 'Low temp', high: 'High temp', monthly: 'Monthly alignment', sun: 'Sunlight', rh: 'Humidity', precip: 'Rainfall' };
  const parts = Object.keys(MATCH_WEIGHTS).map(k => `${labels[k]} ${MATCH_WEIGHTS[k]}%`);
  return `<div class="cmp-weights-note">How the score is weighted: ${parts.join(' · ')}. Survival depends on the temperature gates above; any factor with no data is dropped and the rest rescaled.</div>`;
}

// Render the match results in the side panel. Survivors are ranked by score;
// failures (too cold / too hot) are hidden behind a toggle.
function renderSpeciesMatchPanel(state, matches) {
  const { result } = state;
  const locName = result._name || result.display_name.split(',')[0];

  const survivable = m => (m.tier !== 'unsuitable' && m.tier !== 'too-hot');
  const survivors  = matches.filter(survivable);
  const failures   = matches.filter(m => !survivable(m));

  // Reset the genus filter when a fresh match runs (new matches array); keep it
  // when navigating back to the same results.
  if (renderSpeciesMatchPanel._lastMatches !== matches) {
    matchGenusFilter = null;
    renderSpeciesMatchPanel._lastMatches = matches;
  }
  const genusOf = m => m.species.genus || '—';
  const genusCounts = {};
  for (const m of survivors) genusCounts[genusOf(m)] = (genusCounts[genusOf(m)] || 0) + 1;
  const genera = Object.entries(genusCounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const inGenus = m => !matchGenusFilter || genusOf(m) === matchGenusFilter;
  // Effective score honours the "Temperatures only" toggle; re-rank survivors by it.
  const effScore = m => blendMatchScore(m.sub, matchTempOnly);
  let shownSurvivors = survivors.filter(inGenus);
  if (matchTempOnly) shownSurvivors = [...shownSurvivors].sort((a, b) => effScore(b) - effScore(a));
  const shownFailures  = failures.filter(inGenus);

  const cardHtml = (m) => {
    const s = m.species;
    const photo = s.photo_url || '';
    const common = s.common_name ? esc(s.common_name) : '';
    return `
      <div class="match-card" data-taxon-id="${m.taxonId}">
        ${photo ? `<img class="match-card-photo" src="${esc(photo)}" loading="lazy" onerror="this.style.background='var(--bg-elevated)';this.src='';">` : '<div class="match-card-photo"></div>'}
        <div class="match-card-body">
          <div class="match-card-toprow">
            <div class="match-card-name">${esc(s.scientific_name)}</div>
            ${matchScoreChipHtml(effScore(m))}
          </div>
          ${common ? `<div class="match-card-common">${common}</div>` : ''}
          <div class="match-card-badges">${matchTempBadgesHtml(m)}</div>
        </div>
      </div>`;
  };

  const failHtml = shownFailures.length ? `
    <details class="match-tier-group" id="match-failures">
      <summary>
        <span class="match-tier-dot" style="background:#d4534b"></span>
        <span>Won't survive outdoors</span>
        <span class="match-tier-count">${shownFailures.length}</span>
      </summary>
      <div class="match-card-list">${shownFailures.map(cardHtml).join('')}</div>
    </details>` : '';

  const filterRowHtml = `
    <div class="match-filter-row">
      ${genera.length > 1 ? `<label for="match-genus-filter">Genus</label>
      <select id="match-genus-filter" class="match-genus-filter">
        <option value="">All genera (${survivors.length})</option>
        ${genera.map(([g, c]) => `<option value="${esc(g)}" ${matchGenusFilter === g ? 'selected' : ''}>${esc(g)} (${c})</option>`).join('')}
      </select>` : '<span style="flex:1"></span>'}
      <label class="match-temp-toggle" title="Score on temperature factors only — Low temp, High temp, Monthly alignment"><input type="checkbox" id="match-temp-only" ${matchTempOnly ? 'checked' : ''}> Temp only</label>
    </div>`;

  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="match-panel-header">
      <div class="p-species-name">Species suited to ${esc(locName)}</div>
      <button class="loc-set-home" id="match-change-loc" title="Compare against a different location"><span class="btn-icon">${BMG_ICONS.pin}</span> Change location</button>
      <div class="match-panel-subtitle">
        ${survivors.length} species that can survive here, ranked by an overall climate-match
        score (0–100). Tap a species to see how each factor compares.
      </div>
    </div>
    <div class="match-dormancy-note">
      <strong>These scores are a guide, not a guarantee.</strong> They estimate how closely your
      climate resembles where each species grows wild, based on observation data. Many carnivorous
      plants tolerate conditions beyond their native range with the right care (and temperate
      species' winter dormancy can be provided artificially). Treat low scores as "needs more
      attention," not "impossible."
    </div>
    ${matchBadgeLegendHtml()}
    ${filterRowHtml}
    <div class="match-card-list">${shownSurvivors.map(cardHtml).join('')}</div>
    ${failHtml}
  `;

  // Wire interactions
  wireNavBackBtn();
  document.getElementById('match-genus-filter')?.addEventListener('change', e => {
    matchGenusFilter = e.target.value || null;
    renderSpeciesMatchPanel(state, matches);
  });
  document.getElementById('match-temp-only')?.addEventListener('change', e => {
    matchTempOnly = e.target.checked;
    renderSpeciesMatchPanel(state, matches);
  });
  document.getElementById('match-change-loc')?.addEventListener('click', openMatchLocationModal);
  document.querySelectorAll('.match-card').forEach(card => {
    card.addEventListener('click', () => {
      const tid = +card.dataset.taxonId;
      const m   = matches.find(x => x.taxonId === tid);
      if (!m) return;
      navPush({
        label:   'Climate matches',
        restore: () => renderSpeciesMatchPanel(state, matches),
      });
      renderSpeciesComparePanel(state, m, matches);
    });
  });
}

// ── Per-species comparison view ────────────────────────────────────────────
// Overlays the species' native range (band + median) against the user's
// location curve for each attribute, with the per-attribute sub-score shown.
let matchCompareCharts = [];
let speciesCompareCtx  = null;   // {state, m, matches} — lets the °F/°C toggle re-render
let matchCompareShiftAll = false; // compare view: shift ALL graphs by the seasonal shift, not just temp
let matchGenusFilter = null;      // match results: show only this genus (null = all)
let matchTempOnly = false;        // match: score on temperature factors only (Low/High/Monthly)
function destroyMatchCompareCharts() {
  matchCompareCharts.forEach(c => { try { c.destroy(); } catch {} });
  matchCompareCharts = [];
}

function renderSpeciesComparePanel(state, m, matches) {
  destroyMatchCompareCharts();
  speciesCompareCtx = { state, m, matches };   // so the °F/°C toggle can re-render
  const s   = m.species;
  const mon = speciesMonthlyRaw(s, state.lat);
  const n   = state.normals;

  // Best-fit seasonal shift (signed weeks → months). shiftMoSigned is for display;
  // shiftMo (0..11) is the cyclic rotation applied to the monthly chart.
  const shiftWk = m.shiftWeeks || 0;
  const shiftMoSigned = Math.round(shiftWk * 12 / 52);
  const shiftMo = ((shiftMoSigned % 12) + 12) % 12;
  const shiftLbl = `${shiftWk > 0 ? '+' : ''}${shiftWk} wk (~${shiftMoSigned > 0 ? '+' : ''}${shiftMoSigned} mo)`;

  // Sub-score → 0–100 + colour
  const pct = v => v == null ? null : Math.round(v * 100);
  const subRow = (label, key, note) => {
    const counted = !matchTempOnly || MATCH_TEMP_KEYS.includes(key);
    const v = pct(m.sub[key]);
    const chip = v == null
      ? `<span class="match-score" style="color:var(--text-muted);border-color:var(--border);background:transparent">—</span>`
      : matchScoreChipHtml(v);
    return `<div class="cmp-sub-row${counted ? '' : ' cmp-sub-muted'}"><span>${label}</span>${chip}<span class="cmp-sub-note">${counted ? note : 'not counted (temp-only)'}</span></div>`;
  };

  const photo = s.photo_url || '';
  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="sp-header">
      ${photo ? `<img class="sp-photo" src="${esc(photo)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="sp-photo-placeholder">${BMG_ICONS.leaf}</div>`}
      <div class="sp-header-text">
        <div class="sp-scientific-name">${esc(s.scientific_name)}</div>
        ${s.common_name ? `<div class="sp-common-name">${esc(s.common_name)}</div>` : ''}
        <div class="sp-meta">Overall match ${matchScoreChipHtml(blendMatchScore(m.sub, matchTempOnly))}${matchTempOnly ? ' <span style="opacity:0.7">(temp only)</span>' : ''} to ${esc(state.result._name || state.result.display_name.split(',')[0])}</div>
      </div>
    </div>
    <div class="match-card-badges" style="margin:6px 0 10px">${matchTempBadgesHtml(m)}</div>
    ${matchBadgeLegendHtml()}

    <div class="cmp-sub-list">
      ${subRow('Low temperature',   'low',     'coldest month vs native')}
      ${subRow('High temperature',  'high',    'hottest month vs native')}
      ${(() => {
        const best = pct(m.sub.monthly), cal = pct(m.monthlyCal);
        const chip = best == null
          ? `<span class="match-score" style="color:var(--text-muted);border-color:var(--border);background:transparent">—</span>`
          : matchScoreChipHtml(best);
        const note = shiftWk === 0
          ? 'seasonal curve match (no shift needed)'
          : `best fit at ${shiftLbl} · calendar ${cal == null ? '—' : cal}`;
        return `<div class="cmp-sub-row"><span>Monthly alignment</span>${chip}<span class="cmp-sub-note">${note}</span></div>`;
      })()}
      ${subRow('Sunlight (DLI)',    'sun',     m.sub.sun == null ? 'awaiting data refresh' : 'light levels vs native')}
      ${subRow('Humidity',          'rh',      'RH vs native range')}
      ${subRow('Rainfall',          'precip',  'annual precip vs native')}
    </div>

    <div class="section-label" style="margin-top:14px">Temperature — your location vs native range${shiftWk ? ' (season-shifted)' : ''}</div>
    <div class="cmp-chart-legend"><span class="cmp-leg-band">native range</span> <span class="cmp-leg-you">your location</span></div>
    <div class="chart-wrap"><canvas id="cmp-temp-chart"></canvas></div>
    ${shiftWk ? `
      <div class="cmp-shift-note">${matchCompareShiftAll
        ? `↻ <b>All</b> native climate curves shifted <b>${shiftLbl}</b> to show the species' whole native climate aligned to your seasons. ⚠ Your location's actual day length still follows the real calendar, so light timing won't truly line up — this view is for comparing the climate shapes.`
        : `↻ Native <i>temperature</i> curve shifted <b>${shiftLbl}</b> to best-align the seasonal pattern with your location (alignment ${pct(m.monthlyCal) == null ? '—' : pct(m.monthlyCal)} → ${pct(m.sub.monthly)}). Light, humidity &amp; rainfall stay on the real calendar.`}</div>
      <label class="cmp-shift-toggle"><input type="checkbox" id="cmp-shift-all" ${matchCompareShiftAll ? 'checked' : ''}> Shift all graphs by ${shiftLbl} (visualize the aligned climate)</label>
    ` : ''}

    ${(n.dli && mon?.dli) ? `
      <div class="section-label" style="margin-top:14px">Sunlight (DLI)</div>
      <div class="chart-wrap" style="height:140px"><canvas id="cmp-dli-chart"></canvas></div>` : ''}

    ${(n.rhMean && mon?.rh) ? `
      <div class="section-label" style="margin-top:14px">Humidity (RH%)</div>
      <div class="chart-wrap" style="height:140px"><canvas id="cmp-rh-chart"></canvas></div>` : ''}

    ${(n.precipMm && mon?.precip) ? `
      <div class="section-label" style="margin-top:14px">Rainfall (mm/month)</div>
      <div class="chart-wrap" style="height:140px"><canvas id="cmp-precip-chart"></canvas></div>` : ''}

    <button class="find-species-btn" id="cmp-open-species" style="margin-top:14px">
      <span class="find-species-icon">${BMG_ICONS.leaf}</span> Full species details
    </button>
    ${matchWeightsNoteHtml()}
  `;
  wireNavBackBtn();
  document.getElementById('cmp-shift-all')?.addEventListener('change', e => {
    matchCompareShiftAll = e.target.checked;
    renderSpeciesComparePanel(state, m, matches);   // re-render with all graphs shifted/unshifted
  });

  // Month labels (user's calendar)
  const labels = MONTHS;
  const bandOf  = (mf, idx) => (mf || []).map(v => v ? v[idx] : null);   // [p25,p50,p75] → one series
  const medOf   = mf => bandOf(mf, 1);
  // Rotate a native monthly series by the best-fit shift so it overlays on the
  // user's calendar at the best-aligned phase. Temperature is always shifted;
  // light/humidity/rainfall shift too only when "shift all" is on (rotOther) —
  // showing the species' whole native climate repositioned on the user's calendar.
  const rot      = arr => (shiftMo ? arr.map((_, i) => arr[(i + shiftMo) % 12]) : arr);
  const rotOther = (matchCompareShiftAll && shiftMo) ? rot : (arr => arr);

  // Temperature: species hi/lo band (p25–p75) + median lines, user hi/lo lines.
  // Data is stored in °C; convert to the active unit so the chart tracks the
  // °F/°C toggle (defaults to °F via tempUnit).
  const cv    = v => (v == null ? null : (tempUnit === 'F' ? v * 9 / 5 + 32 : v));
  const cvArr = a => (a || []).map(cv);
  matchCompareCharts.push(buildCompareChart('cmp-temp-chart', {
    labels,
    datasets: [
      cmpBand(cvArr(rot(bandOf(mon.tempMax, 2))), cvArr(rot(bandOf(mon.tempMax, 0))), 'rgba(255,140,60,0.12)'),
      cmpBand(cvArr(rot(bandOf(mon.tempMin, 2))), cvArr(rot(bandOf(mon.tempMin, 0))), 'rgba(100,180,255,0.12)'),
      cmpLine('Native high', cvArr(rot(medOf(mon.tempMax))), 'rgba(255,140,60,0.55)', true),
      cmpLine('Native low',  cvArr(rot(medOf(mon.tempMin))), 'rgba(100,180,255,0.55)', true),
      cmpLine('Your high',   cvArr(n.tempMax), 'rgba(255,140,60,1)', false),
      cmpLine('Your low',    cvArr(n.tempMin), 'rgba(100,180,255,1)', false),
    ],
    unit: tempUnit === 'F' ? '°F' : '°C',
  }));

  if (n.dli && mon?.dli) matchCompareCharts.push(buildCompareChart('cmp-dli-chart', {
    labels,
    datasets: [
      cmpBand(rotOther(bandOf(mon.dli, 2)), rotOther(bandOf(mon.dli, 0)), 'rgba(255,200,50,0.14)'),
      cmpLine('Native', rotOther(medOf(mon.dli)), 'rgba(255,200,50,0.55)', true),
      cmpLine('You', n.dli, 'rgba(255,200,50,1)', false),
    ], unit: '',
  }));

  if (n.rhMean && mon?.rh) matchCompareCharts.push(buildCompareChart('cmp-rh-chart', {
    labels,
    datasets: [
      cmpBand(rotOther(bandOf(mon.rh, 2)), rotOther(bandOf(mon.rh, 0)), 'rgba(120,200,160,0.14)'),
      cmpLine('Native', rotOther(medOf(mon.rh)), 'rgba(120,200,160,0.55)', true),
      cmpLine('You', n.rhMean, 'rgba(120,200,160,1)', false),
    ], unit: '%',
  }));

  if (n.precipMm && mon?.precip) matchCompareCharts.push(buildCompareChart('cmp-precip-chart', {
    labels,
    datasets: [
      cmpBand(rotOther(bandOf(mon.precip, 2)), rotOther(bandOf(mon.precip, 0)), 'rgba(80,160,240,0.14)'),
      cmpLine('Native', rotOther(medOf(mon.precip)), 'rgba(80,160,240,0.55)', true),
      cmpLine('You', n.precipMm, 'rgba(80,160,240,1)', false),
    ], unit: 'mm',
  }));

  document.getElementById('cmp-open-species')?.addEventListener('click', () => {
    navPush({ label: esc(s.scientific_name), restore: () => renderSpeciesComparePanel(state, m, matches) });
    openSpeciesSidebar(m.taxonId, s.scientific_name);
  });
}

// ── Reverse match: "Will it grow at my location?" (species → one location) ──────
// Opens a small modal to pick a location (geolocate or search), then scores THIS
// species at that location and shows the per-species comparison view.
// Shared location-picker modal: home (if set, first) / geolocate / search.
// `onPick(lat, lng, name, statusEl)` runs whatever action the caller wants.
function openLocationPickerModal({ title, intro, onPick }) {
  bmgModalMode = 'rate';
  const h = getHomeLocation();
  document.getElementById('bmg-modal-body').innerHTML = `
    <h2 class="bmg-modal-title">${title}</h2>
    <p class="bmg-modal-text">${intro}</p>
    ${h ? `<button class="find-species-btn" id="pick-home" style="width:100%;justify-content:center;margin-bottom:8px"><span class="find-species-icon">${BMG_ICONS.pin}</span> Use my home (${esc(h.name)})</button>` : ''}
    <button class="find-species-btn" id="pick-geolocate" style="width:100%;justify-content:center">
      <span class="find-species-icon">${BMG_ICONS.pin}</span> Use my current location
    </button>
    <div class="rate-or">— or search a place —</div>
    <div class="rate-search-row">
      <input type="text" id="pick-search-input" class="rate-search-input" placeholder="City, region, or place…" autocomplete="off">
      <button class="rate-search-go" id="pick-search-go">Go</button>
    </div>
    <div class="rate-status" id="pick-status"></div>
  `;
  document.getElementById('bmg-modal-overlay').classList.remove('hidden');
  const status = document.getElementById('pick-status');

  document.getElementById('pick-home')?.addEventListener('click', () => {
    const hh = getHomeLocation();
    if (hh) onPick(hh.lat, hh.lng, hh.name, status);
  });
  document.getElementById('pick-geolocate').addEventListener('click', () => {
    if (!navigator.geolocation) { status.textContent = 'Geolocation unavailable — search a place instead.'; return; }
    status.textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(
      pos => onPick(pos.coords.latitude, pos.coords.longitude, 'Your location', status),
      err => { status.textContent = `Couldn't get your location (${err.code === 1 ? 'permission denied' : 'unavailable'}). Search a place instead.`; },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
    );
  });
  const doSearch = async () => {
    const q = document.getElementById('pick-search-input').value.trim();
    if (q.length < 2) return;
    status.textContent = 'Searching…';
    const results = await fetchNominatim(q).catch(() => []);
    const place = results && results[0];
    if (!place) { status.textContent = `No place found for "${q}". Try another.`; return; }
    onPick(parseFloat(place.lat), parseFloat(place.lon), place.display_name.split(',')[0], status);
  };
  document.getElementById('pick-search-go').addEventListener('click', doSearch);
  const input = document.getElementById('pick-search-input');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  input.focus();
}

// Reverse match: "will THIS species grow at a location I pick?"
function openRateLocationModal(entry) {
  openLocationPickerModal({
    title: `Will <i>${esc(entry.scientific_name)}</i> grow where you are?`,
    intro: `Compare your local <b>outdoor</b> climate to this species' native range. (Greenhouse/terrarium conditions will differ.)`,
    onPick: (lat, lng, name, status) => runReverseMatch(entry, lat, lng, name, status),
  });
}

// Forward match: "find species suited to a location I pick" (used by the home
// chip and the match panel's Change-location button).
function openMatchLocationModal() {
  openLocationPickerModal({
    title: 'Find species suited to a climate',
    intro: 'Pick a location and see which carnivorous plants could grow there outdoors.',
    onPick: (lat, lng, name, status) => runMatchForLocation(lat, lng, name, status),
  });
}

async function runMatchForLocation(lat, lng, name, status) {
  if (status) status.textContent = `Fetching climate for ${name}…`;
  else { openSidePanelForInat(); document.getElementById('panel-content').innerHTML = `<div class="climate-pending" style="margin-top:18px">Fetching climate for ${esc(name)}…</div>`; }
  const [normals, rh] = await Promise.all([
    fetchSearchClimateNormals(lat, lng).catch(() => null),
    fetchRHNormals(lat, lng).catch(() => null),
  ]);
  const merged = normals ? { ...normals, ...(rh || {}) } : null;
  if (!merged) {
    const msg = 'Climate data unavailable for that location.';
    if (status) status.textContent = msg;
    else { const p = document.getElementById('panel-content'); if (p) p.innerHTML = `<div class="climate-pending">${msg}</div>`; }
    return;
  }
  bmgCloseModal();
  openSidePanelForInat();
  runSpeciesMatch({ lat, lng, result: { _name: name, display_name: name }, normals: merged });
}

async function runReverseMatch(entry, lat, lng, placeName, statusEl) {
  const status = statusEl || document.getElementById('pick-status');
  if (status) status.textContent = `Fetching climate for ${placeName}…`;
  const [normals, rh] = await Promise.all([
    fetchSearchClimateNormals(lat, lng).catch(() => null),
    fetchRHNormals(lat, lng).catch(() => null),
  ]);
  const merged = normals ? { ...normals, ...(rh || {}) } : null;
  const u = merged ? buildUserMatchCtx(merged) : null;
  if (!u) { if (status) status.textContent = 'Climate data unavailable for that location.'; return; }
  const m = scoreSpeciesAtLocation(entry, u, lat);
  if (!m) { if (status) status.textContent = "Couldn't score this species here."; return; }
  m.taxonId = entry.taxon_id;

  bmgCloseModal();
  const state = { lat, lng, result: { _name: placeName, display_name: placeName }, normals: merged };
  // Back from the comparison returns to this species' page.
  navPush({ label: esc(entry.scientific_name), restore: () => openSpeciesSidebar(entry.taxon_id, entry.scientific_name) });
  openSidePanelForInat();
  renderSpeciesComparePanel(state, m, [m]);
}

// Dataset helpers for the comparison charts.
function cmpBand(top, bottom, fillColor) {
  return {           // top line fills DOWN to the next dataset (the bottom line)
    type: 'line', label: '_band', data: top,
    borderWidth: 0, backgroundColor: fillColor, fill: '+1',
    tension: 0.35, pointRadius: 0, _bottom: bottom,
  };
}
function cmpLine(label, data, color, dashed) {
  return {
    type: 'line', label, data,
    borderColor: color, backgroundColor: 'transparent', fill: false,
    borderDash: dashed ? [5, 3] : [], borderWidth: dashed ? 1.5 : 2.5,
    tension: 0.35, pointRadius: 0, pointHoverRadius: 4,
  };
}
function buildCompareChart(canvasId, cfg) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  // Expand any band's hidden bottom line into a real dataset right after it.
  const datasets = [];
  for (const d of cfg.datasets) {
    if (d._bottom) {
      const bottom = d._bottom; delete d._bottom;
      datasets.push(d);
      datasets.push({ type: 'line', label: '_bandbot', data: bottom, borderWidth: 0,
        backgroundColor: 'transparent', fill: false, tension: 0.35, pointRadius: 0 });
    } else datasets.push(d);
  }
  return new Chart(ctx, {
    data: { labels: cfg.labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: 'rgba(255,255,255,0.55)', font: { size: 10 }, boxWidth: 10,
          filter: i => !i.text.startsWith('_') } },
        tooltip: { backgroundColor: '#161b22', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#e6edf3', bodyColor: '#8b949e',
          callbacks: { label: c => c.dataset.label.startsWith('_') ? null
            : `${c.dataset.label}: ${c.raw != null ? Math.round(c.raw) + (cfg.unit || '') : '—'}` } },
      },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 },
          callback: v => Math.round(v) + (cfg.unit || '') } },
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 9 } } },
      },
    },
  });
}

// Button click handler. Loads species data if needed, runs matching, renders.
// Pushes the location panel onto the nav stack so the match results show a
// "← {locName}" back button that returns to the climate display.
async function runSpeciesMatch(state) {
  const panel = document.getElementById('panel-content');
  if (!panel) return;
  const locLabel = state.result?._name || state.result?.display_name?.split(',')[0] || 'Location';
  navPush({
    label:   locLabel,
    restore: () => buildLocationPanel(state),
  });
  // Loading state
  panel.innerHTML = `
    <div class="climate-pending" style="margin-top:18px">Loading species data and matching to your climate…</div>
  `;
  const data = await loadSpeciesData();
  if (!data) {
    panel.innerHTML = `<div class="climate-pending" style="margin-top:18px">Species climate data not available. Run the monthly data refresh workflow to generate it.</div>`;
    return;
  }
  const userKoppen = getKoppenAt(state.lat, state.lng);
  const matches    = matchSpeciesToLocation(state.normals, userKoppen, state.lat);
  renderSpeciesMatchPanel(state, matches);
}

// ════════════════════════════════════════════════════════════
//  CLICKED-LOCATION PANEL  (search result / map click → climate panel)
// ════════════════════════════════════════════════════════════

function buildLocationPanel(state) {
  const { result, lat, lng, normals, loading, elevInfo } = state;
  const name = result._name || result.display_name.split(',')[0];
  const a = result.address || {};
  const subLabel = [a.state, a.country].filter(Boolean).join(', ');

  const v = getKoppenAt(lat, lng);
  let koppenBadgeHtml = '';
  if (v >= 1 && v <= 30) {
    const zone = BECK_ZONES[v];
    const [cr, cg, cb] = BECK_COLORS[v];
    koppenBadgeHtml = `<div class="badge-row"><span class="badge badge-koppen" style="color:rgb(${cr},${cg},${cb});border-color:rgba(${cr},${cg},${cb},0.3);background:rgba(${cr},${cg},${cb},0.1)">${esc(zone.code)} · ${esc(zone.desc)}</span></div>`;
  }

  // Destroy any stale charts before re-rendering panel content
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  if (lightChart)   { lightChart.destroy();   lightChart   = null; }

  let climateHtml;
  if (loading) {
    climateHtml = `<div class="climate-pending">Loading climate data…</div>`;
  } else if (normals && normals.tempMax && normals.tempMin && normals.precipMm) {
    const validMax = normals.tempMax.filter(x => x != null);
    const validMin = normals.tempMin.filter(x => x != null);
    const peakHigh = validMax.length ? Math.max(...validMax) : null;
    const peakLow  = validMin.length ? Math.min(...validMin) : null;
    const annPrec  = Math.round(normals.precipMm.reduce((a, b) => a + (b || 0), 0));

    const validRH = normals.rhMean ? normals.rhMean.filter(v => v != null) : [];
    const annRHAvg = validRH.length ? validRH.reduce((a, b) => a + b, 0) / validRH.length : null;

    // USDA hardiness zone only shown for US locations — outside the US the
    // zoning system has different meaning / different names in use.
    const inUS = (a.country_code || '').toLowerCase() === 'us';
    const { extHigh: hotEx, extLow: coldEx } = extremeBoxVals(normals);
    const freezeDays = normals.daysBelowFreezing;

    climateHtml = `
      <div class="climate-grid">
        <div class="climate-stat" title="Hottest month's average daily high">
          <div class="climate-stat-label">Avg High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div></div>
        <div class="climate-stat" title="Coldest month's average daily low">
          <div class="climate-stat-label">Avg Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div></div>
        ${hotEx != null ? `<div class="climate-stat" title="Hottest month's p90 daily high — a hot day in the warmest part of the year (exceeded ~10% of that month's days)">
          <div class="climate-stat-label">Extreme High</div>
          <div class="climate-stat-value" data-celsius="${hotEx}">${toDisplay(hotEx, tempUnit)}</div></div>` : ''}
        ${coldEx != null ? `<div class="climate-stat" title="Coldest month's p10 daily low — a cold day in the coldest part of the year (below this ~10% of that month's days)">
          <div class="climate-stat-label">Extreme Low</div>
          <div class="climate-stat-value" data-celsius="${coldEx}">${toDisplay(coldEx, tempUnit)}</div></div>` : ''}
        ${freezeDays != null ? `<div class="climate-stat" title="Average number of days per year with daily minimum below 0°C">
          <div class="climate-stat-label">Freeze Days/yr</div>
          <div class="climate-stat-value">${freezeDays}</div></div>` : ''}
        ${inUS && normals.usdaZone ? `<div class="climate-stat" title="USDA Plant Hardiness Zone based on mean annual minimum (${toDisplay(normals.avgAnnualMin, tempUnit)})">
          <div class="climate-stat-label">USDA Zone</div>
          <div class="climate-stat-value">${normals.usdaZone}</div></div>` : ''}
        <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
        ${annRHAvg != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg RH</div>
          <div class="climate-stat-value">${Math.round(annRHAvg)}<span class="climate-stat-unit">%</span></div></div>` : ''}
        ${elevInfo ? `<div class="climate-stat"><div class="climate-stat-label">Elevation</div>
          <div class="climate-stat-value">${elevInfo.terrainElev.toLocaleString()}<span class="climate-stat-unit">m</span></div></div>` : ''}
      </div>
      ${elevInfo ? (() => {
        const diff    = elevInfo.elevDiff;
        const diffAbs = Math.abs(diff);
        const dir     = diff > 0 ? 'higher' : 'lower';
        const sign    = diff > 0 ? '−' : '+';  // higher → cooler → negative adjustment
        const adj     = Math.abs(elevInfo.tempDelta).toFixed(1);
        return `<div class="sp-chart-note">Climate-model grid elevation: ${elevInfo.modelElev.toLocaleString()} m. ` +
               `This location is ${diffAbs.toLocaleString()} m ${dir} (${elevInfo.terrainElev.toLocaleString()} m), ` +
               `so temperatures are adjusted ~${sign}${adj}°C using a humidity-aware lapse rate ` +
               `(~${elevInfo.lapseRate}°C/1000 m here, applied per month).</div>`;
      })() : ''}
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="section-label">Temperature &amp; Precipitation</div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(normals)}
        ${normals.daylightHrs ? `
          <div class="section-divider"></div>
          <div class="section-label">Light &amp; Atmosphere</div>
          <div class="chart-wrap"><canvas id="light-chart"></canvas></div>
          ${buildLightTable(normals)}
        ` : ''}
        ${climateMethodologyHtml()}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data unavailable for this location</div>`;
  }

  // "Find matching species" is only meaningful once climate is loaded — we
  // need normals to run the algorithm. Hidden during loading; shown when
  // both climate normals and a valid location are available.
  const findSpeciesBtnHtml = (!loading && normals && normals.tempMax && normals.tempMin)
    ? `<button class="find-species-btn" id="find-species-btn" title="Find carnivorous plant species that grow in a similar climate to this location">
         <span class="find-species-icon">${BMG_ICONS.leaf}</span>
         Find species suited to this climate
       </button>`
    : '';

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(name)}</div>
    ${subLabel ? `<div class="p-common-name">${esc(subLabel)}</div>` : ''}
    <div class="p-location">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
    ${copyLinkBtnHtml('at', `${lat.toFixed(4)},${lng.toFixed(4)},${Math.round(map.getZoom())}`, 'loc-copy-link')}
    <button class="loc-set-home" id="loc-set-home" title="Save this place to reuse for climate comparisons"><span class="btn-icon">${BMG_ICONS.pin}</span> Set as home</button>
    ${koppenBadgeHtml}
    <div class="section-divider"></div>
    <div class="section-label">Climate (2014–2023 avg)</div>
    ${climateHtml}
    ${findSpeciesBtnHtml}
    ${!loading ? buildSoilSectionHtml(true) : ''}
  `;

  document.getElementById('side-panel').classList.add('open');
  wireCopyLinkButtons(document.getElementById('panel-content'));
  if (!loading) setDeepLink('at', `${lat.toFixed(4)},${lng.toFixed(4)},${Math.round(map.getZoom())}`);

  // Wire the climate-match button (only present when climate has loaded)
  document.getElementById('find-species-btn')?.addEventListener('click', () => runSpeciesMatch(state));

  // "Set as home" — save this place for repeated climate comparisons.
  const setHomeBtn = document.getElementById('loc-set-home');
  if (setHomeBtn) {
    const home = getHomeLocation();
    const isHome = home && Math.abs(home.lat - lat) < 0.01 && Math.abs(home.lng - lng) < 0.01;
    if (isHome) { setHomeBtn.innerHTML = `<span class="btn-icon">${BMG_ICONS.pin}</span> This is your home`; setHomeBtn.classList.add('is-home'); }
    setHomeBtn.addEventListener('click', () => {
      setHomeLocation({ lat, lng, name });
      setHomeBtn.innerHTML = `<span class="btn-icon">${BMG_ICONS.check}</span> Saved as home`;
      setHomeBtn.classList.add('is-home');
    });
  }

  // Fetch soil data asynchronously and populate the section once data arrives
  if (!loading) loadAndRenderSoilSection(lat, lng);

  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && normals && !loading) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(normals);
      if (opening && !lightChart && normals.daylightHrs) buildLightChart(normals);
    });
  }
}

function closeLocationPanel() {

}

window.openClimateAt = async function(lat, lng) {
  map.closePopup();

  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  // Clear search bar since this is a raw map click, not a search result
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950', weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  const coordName = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
  const token = {};
  const fakeResult = { _name: coordName, display_name: coordName, lat: String(lat), lon: String(lng), place_rank: 30, address: {} };

  navClear();   // fresh location — drop any back-history from a prior view
  searchState = { result: fakeResult, lat, lng, normals: null, loading: true, token };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  const [geocode, normals, rh, terrainElev] = await Promise.all([
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&format=json`, { headers: { 'Accept-Language': 'en' } })
      .then(r => r.ok ? r.json() : null).catch(() => null),
    fetchSearchClimateNormals(lat, lng),
    fetchRHNormals(lat, lng),
    fetchTerrainElevation(lat, lng)
  ]);

  if (!searchPanelOpen || !searchState || searchState.token !== token) return;

  if (geocode && geocode.display_name) {
    searchState.result = {
      _name: geocode.display_name.split(',')[0],
      display_name: geocode.display_name,
      lat: String(lat), lon: String(lng),
      place_rank: 30,
      address: geocode.address || {}
    };
  }

  let mergedNormals = normals ? { ...normals, ...(rh || {}) } : null;
  let elevInfo = null;
  if (mergedNormals && terrainElev != null && mergedNormals.modelElev != null) {
    const modelElev = mergedNormals.modelElev;
    const elevDiff  = terrainElev - modelElev;
    // Humidity/temperature-aware mean lapse rate for the explanatory note
    // (the actual correction applied below is per-month, not this average).
    const rate      = meanLapseRate(mergedNormals, modelElev);
    const tempDelta = (rate / 1000) * elevDiff;  // °C subtracted from raw temps
    mergedNormals   = applyHumidityLapse(mergedNormals, terrainElev);
    elevInfo = {
      terrainElev: Math.round(terrainElev),
      modelElev:   Math.round(modelElev),
      elevDiff:    Math.round(elevDiff),
      lapseRate:   Math.round(rate * 10) / 10,
      tempDelta:   Math.round(tempDelta * 10) / 10,
    };
  }

  searchState.normals  = mergedNormals;
  searchState.elevInfo = elevInfo;
  searchState.loading  = false;
  buildLocationPanel(searchState);
};

function renderSuggestions(results) {
  searchCurrentSuggestions = results;
  searchHighlightedIdx = -1;
  const el = document.getElementById('search-suggestions');
  if (!results.length) { el.classList.remove('open'); return; }

  const taxa   = results.filter(r => r._type === 'inat-taxon');
  const locs   = results.filter(r => r._type !== 'inat-taxon');
  const showSep = taxa.length > 0 && locs.length > 0;

  const taxaHtml = taxa.map((r, _) => {
    const i = results.indexOf(r);
    const dot   = `<span class="search-suggestion-genus-dot" style="background:${INAT_GENUS_COLORS[r.genus] || '#aaa'}"></span>`;
    const count = r.count > 0 ? `<span style="color:var(--text-muted);font-size:11px;font-style:normal">${r.count.toLocaleString()} sightings</span>` : '';
    const sub   = [r.commonName, r.genus].filter(Boolean);
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-taxon-row">${dot}<div class="search-suggestion-taxon-name">${esc(r.taxonName)}</div>${count}</div>
      ${sub.length ? `<div class="search-suggestion-sub">${esc(sub.join(' · '))}</div>` : ''}
    </div>`;
  }).join('');

  const locsHtml = locs.map(r => {
    const i = results.indexOf(r);
    const name = r.display_name.split(',')[0];
    const a = r.address || {};
    const sub = [a.state, a.country].filter(Boolean).join(', ') || (r.type || '').replace(/_/g, ' ');
    const region = isAdminRegionResult(r)
      ? `<span style="color:var(--accent);font-size:10px;font-style:normal;margin-left:6px">▦ filter region</span>` : '';
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-name">${esc(name)}${region}</div>
      ${sub ? `<div class="search-suggestion-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML =
    (taxa.length ? `<div class="search-suggestion-sep">Species</div>${taxaHtml}` : '') +
    (showSep     ? `<div class="search-suggestion-sep">Locations</div>` : '') +
    locsHtml;

  el.classList.add('open');
}

// Nominatim "class"/"type" combos that represent an administrative area we can
// filter observations within (state, province, county, country, island, etc.).
function isAdminRegionResult(r) {
  if (r._type === 'inat-taxon') return false;
  // City-level and smaller places are treated as POINTS (so the search opens the
  // climate panel for that spot — useful for climate comparison / find-species),
  // not as a region filter. Nominatim place_rank: country~4, state~8, county~12,
  // city~16, town~18. Only county-or-larger (rank <= 12) becomes a region filter.
  const rank = parseInt(r.place_rank);
  if (!isNaN(rank) && rank > 12) return false;
  if (r.class === 'boundary' && r.type === 'administrative') return true;
  if (r.class === 'place' && ['state','region','province','county','island','archipelago','country'].includes(r.type)) return true;
  return false;
}

// ── Home location ──────────────────────────────────────────────────────────
// A saved {lat,lng,name} the user can reuse to compare climates repeatedly.
function getHomeLocation() {
  try { const s = lsGet('bmg_home_location'); return s ? JSON.parse(s) : null; } catch { return null; }
}
function setHomeLocation(loc) {
  lsSet('bmg_home_location', JSON.stringify({ lat: loc.lat, lng: loc.lng, name: loc.name || 'Home' }));
  refreshHomeChip();
}
function refreshHomeChip() {
  const chip = document.getElementById('home-chip');
  if (!chip) return;
  const home = getHomeLocation();
  if (home) {
    chip.style.display = 'inline-flex';
    document.getElementById('home-chip-name').textContent = home.name || 'Home';
