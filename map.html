<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bogman Climate Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
<link rel="preload" href="./koppen_geiger_tif/1991_2020/koppen_geiger_0p00833333.tif" as="fetch" crossorigin="anonymous">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:           #0d1117;
  --bg-panel:     #161b22;
  --bg-elevated:  #1f2937;
  --border:       #30363d;
  --text-primary: #e6edf3;
  --text-muted:   #8b949e;
  --accent:       #3fb950;
  --accent-dim:   #1a4a2a;
  --danger:       #f85149;
  --warning:      #d29922;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ── Loading bar ─────────────────────────────────────────── */
#loading-bar-wrap {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  z-index: 9999;
  background: rgba(63,185,80,0.12);
}
#loading-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.35s ease;
  border-radius: 0 2px 2px 0;
}

/* ── App shell ───────────────────────────────────────────── */
#bmg-map-app {
  display: flex;
  width: 100%;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

#map-container {
  flex: 1;
  height: 100%;
  min-width: 0;
  transition: flex 0.3s ease;
  position: relative;
}

#map { width: 100%; height: 100%; }

/* ── Side panel ──────────────────────────────────────────── */
#side-panel {
  width: 0;
  height: 100%;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  transition: width 0.3s ease;
  display: flex;
  flex-direction: column;
}
#side-panel.open {
  width: 40%;
  min-width: 320px;
  max-width: 520px;
}

#panel-drag-handle {
  width: 44px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
  display: none;
  flex-shrink: 0;
}

#panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#panel-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 4px;
  transition: color 0.15s;
}
#panel-close:hover { color: var(--text-primary); }

.temp-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  font-size: 11px;
}
.temp-toggle button {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 3px 9px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.temp-toggle button.active {
  background: var(--accent-dim);
  color: var(--accent);
}

#panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 18px 18px 24px;
}
#panel-scroll::-webkit-scrollbar { width: 4px; }
#panel-scroll::-webkit-scrollbar-track { background: transparent; }
#panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Panel content ───────────────────────────────────────── */
.p-species-name {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--text-primary);
  line-height: 1.3;
  margin-bottom: 3px;
}
.p-common-name {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.p-location {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.5;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 11px;
  border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
}
.badge-koppen {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.badge-muted {
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.section-divider {
  height: 1px;
  background: var(--border);
  margin: 14px 0;
}
.section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 7px;
}
.description-text {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.65;
  margin-bottom: 14px;
}

/* ── Climate stats ───────────────────────────────────────── */
.climate-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.climate-stat {
  background: var(--bg-elevated);
  border-radius: 6px;
  padding: 10px 12px;
}
.climate-stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.climate-stat-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}
.climate-stat-unit {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 1px;
}
.climate-pending {
  background: var(--bg-elevated);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 14px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
}

.expand-btn {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 9px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 2px;
}
.expand-btn:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

#climate-expanded { display: none; }
#climate-expanded.open { display: block; }

.chart-wrap {
  position: relative;
  height: 190px;
  margin: 14px 0;
}

/* ── Climate table ───────────────────────────────────────── */
.climate-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 16px;
}
.climate-table th {
  color: var(--text-muted);
  text-align: left;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
}
.climate-table td {
  padding: 5px 6px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  color: var(--text-primary);
}
.climate-table tr:last-child td { border-bottom: none; }
.climate-table .annual-row td {
  color: var(--accent);
  border-top: 1px solid var(--border);
  font-weight: 600;
}

/* ── Gallery link ────────────────────────────────────────── */
.gallery-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 6px;
  text-decoration: none;
  font-size: 13px;
  margin-top: 14px;
  transition: background 0.15s;
}
.gallery-link:hover { background: #234f2e; }

/* ── Map overlay controls ────────────────────────────────── */
.map-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 15px;
  transition: background 0.15s;
  user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.map-btn:hover { background: var(--bg-elevated); }
.map-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ── Filter toggle + panel ───────────────────────────────── */
#filter-toggle {
  position: absolute;
  top: 10px; left: 10px;
  z-index: 1001;
}

#filter-panel {
  position: absolute;
  top: 54px; left: 10px;
  z-index: 1000;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 210px;
  max-width: 240px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  display: none;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
}
#filter-panel.open { display: block; }
#filter-panel::-webkit-scrollbar { width: 3px; }
#filter-panel::-webkit-scrollbar-thumb { background: var(--border); }

#filter-panel-inner { padding: 12px; }

.filter-group-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 5px;
  margin-top: 10px;
}
.filter-group-title:first-child { margin-top: 0; }

.filter-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
  padding: 2px 0;
  user-select: none;
}
.filter-label input[type=checkbox] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.genus-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.filter-count {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: auto;
}

#filter-reset {
  width: 100%;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  padding: 5px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 10px;
  transition: color 0.15s, border-color 0.15s;
  display: none;
}
#filter-reset:hover { color: var(--text-primary); border-color: var(--text-muted); }

/* ── Unmapped toggle + panel ─────────────────────────────── */
#unmapped-toggle {
  position: absolute;
  bottom: 10px; left: 10px;
  z-index: 1001;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 12px;
  padding: 6px 11px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
#unmapped-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); }

#unmapped-panel {
  position: absolute;
  bottom: 54px; left: 10px;
  z-index: 1000;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 330px;
  max-height: 380px;
  display: none;
  flex-direction: column;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
#unmapped-panel.open { display: flex; }

#unmapped-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#unmapped-header span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.copy-csv-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s;
}
.copy-csv-btn:hover { color: var(--text-primary); }

#unmapped-list {
  overflow-y: auto;
  flex: 1;
}
#unmapped-list::-webkit-scrollbar { width: 3px; }
#unmapped-list::-webkit-scrollbar-thumb { background: var(--border); }

.unmapped-row {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  gap: 7px;
  font-size: 12px;
}
.unmapped-row:last-child { border-bottom: none; }
.unmapped-name {
  font-family: 'Lora', serif;
  font-style: italic;
  flex: 1;
  color: var(--text-primary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unmapped-country {
  color: var(--text-muted);
  font-size: 11px;
  flex-shrink: 0;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unmapped-icons { display: flex; gap: 2px; flex-shrink: 0; }
.unmapped-icon { font-size: 10px; opacity: 0.55; }

/* ── Overlap popup ───────────────────────────────────────── */
.overlap-popup {
  background: var(--bg-panel);
  border-radius: 6px;
  min-width: 180px;
  overflow: hidden;
}
.overlap-popup-title {
  padding: 6px 10px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.overlap-item {
  padding: 7px 10px;
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  transition: background 0.1s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.overlap-item:last-child { border-bottom: none; }
.overlap-item:hover { background: var(--bg-elevated); }
.overlap-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Leaflet overrides ───────────────────────────────────── */
.leaflet-popup-content-wrapper {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  border-radius: 6px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
  color: var(--text-primary) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; }
.leaflet-popup-tip-container { display: none !important; }
.leaflet-popup-close-button { color: var(--text-muted) !important; }

.leaflet-tooltip {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  font-family: 'Lora', serif !important;
  font-style: italic !important;
  font-size: 12px !important;
  border-radius: 4px !important;
  box-shadow: none !important;
  white-space: nowrap;
}
.leaflet-tooltip::before { display: none !important; }

.koppen-tooltip {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 11px !important;
  border-radius: 4px !important;
  box-shadow: none !important;
  padding: 4px 8px !important;
}
.koppen-tooltip::before { display: none !important; }

.leaflet-control-zoom a {
  background: var(--bg-panel) !important;
  color: var(--text-primary) !important;
  border-color: var(--border) !important;
}
.leaflet-control-zoom a:hover { background: var(--bg-elevated) !important; }
.leaflet-bar { border: none !important; box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important; }
.leaflet-bar a { border-bottom-color: var(--border) !important; }
.leaflet-control-attribution {
  background: rgba(13,17,23,0.7) !important;
  color: var(--text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--text-muted) !important; }

/* ── Köppen click popup ──────────────────────────────────── */
.kp-popup { padding: 10px 12px; min-width: 170px; }
.kp-popup-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.kp-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.kp-code { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text-primary); }
.kp-desc { font-size: 12px; color: var(--text-primary); margin-bottom: 3px; }
.kp-group { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
.kp-climate-btn {
  display: block; width: 100%;
  margin-top: 9px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s;
}
.kp-climate-btn:hover { background: #234f2e; }

/* ── Köppen Legend Panel ─────────────────────────────────── */
.koppen-legend-wrap { position: relative; }
.koppen-legend-panel {
  display: none;
  position: absolute;
  right: 0;
  top: 38px;
  width: 210px;
  max-height: 72vh;
  overflow-y: auto;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.55);
  z-index: 800;
}
.koppen-legend-panel.open { display: block; }
.legend-group-label {
  padding: 6px 10px 4px;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
.koppen-legend-panel .legend-group-label:first-child { border-top: none; }
.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 2px 10px 2px 12px;
}
.legend-swatch {
  width: 11px; height: 11px;
  border-radius: 2px;
  flex-shrink: 0;
  opacity: 0.9;
}
.legend-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-primary);
  width: 30px;
  flex-shrink: 0;
}
.legend-desc { font-size: 11px; color: var(--text-muted); }

/* ── Location Search ─────────────────────────────────────── */
#search-container {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1001;
  width: 300px;
  max-width: calc(100% - 140px);
}
#search-input-wrap {
  display: flex;
  align-items: center;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
#search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  padding: 8px 10px;
  min-width: 0;
}
#search-input::placeholder { color: var(--text-muted); }
#search-clear {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1;
  padding: 4px 10px 4px 4px;
  cursor: pointer;
  display: none;
  flex-shrink: 0;
}
#search-clear:hover { color: var(--text-primary); }
#search-clear.visible { display: block; }
#search-suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  overflow: hidden;
  display: none;
  z-index: 1002;
  max-height: 260px;
  overflow-y: auto;
}
#search-suggestions.open { display: block; }
.search-suggestion {
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  transition: background 0.1s;
}
.search-suggestion:last-child { border-bottom: none; }
.search-suggestion:hover, .search-suggestion.highlighted { background: var(--bg-elevated); }
.search-suggestion-name {
  font-size: 13px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-suggestion-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
  #search-container { width: calc(100% - 100px); max-width: none; }
  #side-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    width: 100% !important;
    max-width: none !important;
    min-width: unset !important;
    height: 0;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    transition: height 0.3s ease;
    z-index: 500;
  }

      <circle cx="10" cy="10" r="8" fill="${color}" stroke="white" stroke-width="2" ${dash} opacity="${op}"/>
    </svg>
  </div>`;
}

function makeIcon(taxon, selected = false) {

function updateKoppenBlur() {
  const pane = map.getPane('koppenPane');
  if (!pane) return;
  const z = map.getZoom();
  // 0.1° ≈ 11km resolution; meaningful through zoom ~8
  const blur    = z <= 9 ? 0 : z === 10 ? 1 : 2;
  const opacity = z <= 10 ? 1 : z === 11 ? 0.6 : z === 12 ? 0.25 : 0;
  pane.style.filter  = blur > 0 ? `blur(${blur}px)` : '';
  pane.style.opacity = opacity;
}

// ═══════════════════════════════════════════════════════════
//  KÖPPEN OVERLAY
// ═══════════════════════════════════════════════════════════

function koppenCodeFromProps(props) {
  return props.CODE || props.code || props.Cls || props.GRIDCODE || props.Koppen || null;
}

async function loadKoppen() {
  const PATH_1KM = './koppen_geiger_tif/1991_2020/koppen_geiger_0p00833333.tif';
  const PATH_01  = './koppen_geiger_tif/1991_2020/koppen_geiger_0p1.tif';

  const colorFn = values => {
    const v = values[0];
    if (!v || v < 1 || v > 30) return null;
    const c = BECK_COLORS[v];
    return c ? `rgb(${c[0]},${c[1]},${c[2]})` : null;
  };

  const makeLayer = gr => new GeoRasterLayer({
    georaster: gr, pane: 'koppenPane',
    opacity: satelliteActive ? 0.35 : 0.55,
    resolution: 64, pixelValuesToColorFn: colorFn
  });

  const swapLayer = newLayer => {
    if (koppenLayer && map.hasLayer(koppenLayer)) map.removeLayer(koppenLayer);
    koppenLayer = newLayer;
    if (koppenVisible) koppenLayer.addTo(map);
    updateKoppenBlur();
  };

  // Start both fetches simultaneously — don't wait for one before the other
  const p1km = fetch(PATH_1KM).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
  const p01  = fetch(PATH_01).then(r  => r.ok ? r.arrayBuffer() : null).catch(() => null);

  // 0.1° arrives fast (~217 KB) — parse immediately for overlay + click queries
  const buf01 = await p01;
  if (buf01) {
    koppenGeoRaster = await parseGeoraster(buf01);
    swapLayer(makeLayer(koppenGeoRaster));
  }

  // 1km arrives later — silently upgrade the display layer
  const buf1km = await p1km;
  if (buf1km) {
    const gr1km = await parseGeoraster(buf1km);
    swapLayer(makeLayer(gr1km));
  }
}

function getKoppenAt(lat, lng) {
  const g = koppenGeoRaster;
  if (!g || !g.values || !g.values[0]) return 0;
  const col = Math.floor((lng - g.xmin) / g.pixelWidth);
  const row = Math.floor((g.ymax - lat) / g.pixelHeight);
  if (row < 0 || row >= g.height || col < 0 || col >= g.width) return 0;
  return g.values[0][row][col];
}

function showKoppenPopup(latlng) {
  const v = getKoppenAt(latlng.lat, latlng.lng);
  if (!v || v < 1 || v > 30) return;
  const zone = BECK_ZONES[v];
  const [r, g, b] = BECK_COLORS[v];
  L.popup({ maxWidth: 240 })
    .setLatLng(latlng)
    .setContent(
      `<div class="kp-popup">` +
      `<div class="kp-popup-head"><span class="kp-swatch" style="background:rgb(${r},${g},${b})"></span><span class="kp-code">${zone.code}</span></div>` +
      `<div class="kp-desc">${zone.desc}</div>` +
      `<div class="kp-group">${zone.group}</div>` +
      `<button class="kp-climate-btn" onclick="openClimateAt(${latlng.lat},${latlng.lng})">↓ Load climate data</button>` +
      `</div>`
    )
    .openOn(map);
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════

function renderPins(taxa) {
  taxa.forEach(taxon => {
    const { lat, lng, rangeRadiusKm, coordinatePrecision } = taxon.mapPin;
    const color = genusColor(taxon.genus);

    const marker = L.marker([lat, lng], { icon: makeIcon(taxon), zIndexOffset: 100 });
    marker.bindTooltip(taxon.displayName, { direction: 'top' });
    marker.on('click', e => { L.DomEvent.stopPropagation(e); handlePinClick(e, taxon); });
    marker.addTo(map);

    let circle = null;
    if (rangeRadiusKm) {
      circle = L.circle([lat, lng], {
        radius:      rangeRadiusKm * 1000,
        color,
        fillColor:   color,
        fillOpacity: 0.07,
        weight:      1,
        opacity:     0.28,
        interactive: false
      }).addTo(map);
    }

    markerStore.set(taxon.id, { marker, circle, taxon });
  });

  updatePinCount();
}

function updatePinCount() {
  let n = 0;
  markerStore.forEach(({ marker }) => { if (map.hasLayer(marker)) n++; });
  // Update unmapped toggle label with pin count hint
  const toggleEl = document.getElementById('unmapped-toggle');
  if (toggleEl) {
    const cnt = document.getElementById('unmapped-count');
    // cnt text is set in buildUnmappedList
  }
}

function handlePinClick(e, taxon) {
  const clickPt = map.latLngToContainerPoint(e.latlng);
  const nearby  = [];

  markerStore.forEach(({ marker, taxon: t }) => {
    if (!map.hasLayer(marker)) return;
    const pt = map.latLngToContainerPoint(marker.getLatLng());
    const dx = pt.x - clickPt.x, dy = pt.y - clickPt.y;
    if (Math.sqrt(dx*dx + dy*dy) < 14) nearby.push(t);
  });

  if (nearby.length > 1) {
    showOverlapPopup(e.latlng, nearby);
  } else {
    openPanel(taxon);
    flyToTaxon(taxon);
  }
}

function showOverlapPopup(latlng, taxa) {
  const items = taxa.map(t =>
    `<div class="overlap-item" data-id="${esc(t.id)}">
      <div class="overlap-dot" style="background:${genusColor(t.genus)}"></div>
      ${esc(t.displayName)}
    </div>`
  ).join('');

  const popup = L.popup({ className: '', closeButton: false, offset: [0, -5] })
    .setLatLng(latlng)
    .setContent(`<div class="overlap-popup">
      <div class="overlap-popup-title">${taxa.length} species at this location</div>
      ${items}
    </div>`)
    .openOn(map);

  setTimeout(() => {
    document.querySelectorAll('.overlap-item').forEach(el => {
      el.addEventListener('click', () => {
        map.closePopup(popup);
        const t = taxa.find(x => x.id === el.dataset.id);
        if (t) { openPanel(t); flyToTaxon(t); }
      });
    });
  }, 0);
}

function flyToTaxon(taxon) {
  const prec = taxon.mapPin?.coordinatePrecision || 'exact';
  const zoom = FLY_ZOOM[prec] || 9;
  map.flyTo([taxon.mapPin.lat, taxon.mapPin.lng], zoom, { duration: 0.8 });
}

// ═══════════════════════════════════════════════════════════
//  REGION HIGHLIGHT
// ═══════════════════════════════════════════════════════════

function clearRegionHighlight() {
  if (regionHighlight) { map.removeLayer(regionHighlight); regionHighlight = null; }
}

async function highlightRegion(taxon) {
  clearRegionHighlight();
  const prec  = taxon.mapPin?.coordinatePrecision;
  const color = genusColor(taxon.genus);

  if (prec === 'regional' && taxon.mapPin?.regionCode) {
    if (!statesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_1_states_provinces.geojson');
        statesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.regionCode;
    const feat = statesGeoJSON.features.find(f =>
      f.properties.iso_3166_2 === code || f.properties.adm1_code === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }

  if (prec === 'country' && taxon.mapPin?.countryCode) {
    if (!countriesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
        countriesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.countryCode;
    const feat = countriesGeoJSON.features.find(f =>
      f.properties.ISO_A2 === code || f.properties.ADM0_A3 === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }
}

// ═══════════════════════════════════════════════════════════

function openPanel(taxon) {
  if (searchPanelOpen) closeLocationPanel();
  // Deselect previous marker
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon: prev } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(prev, false));
  }
  selectedId = taxon.id;
  markerStore.get(taxon.id).marker.setIcon(makeIcon(taxon, true));

  renderPanel(taxon);
  document.getElementById('side-panel').classList.add('open');
  highlightRegion(taxon);
  setUrlParam('taxon', taxon.id);
}

function closePanel() {
  if (searchPanelOpen) { closeLocationPanel(); return; }
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(taxon, false));
  }
  selectedId = null;
  document.getElementById('side-panel').classList.remove('open');
  clearRegionHighlight();
  setUrlParam('taxon', null);
  if (climateChart) { climateChart.destroy(); climateChart = null; }
}

function renderPanel(taxon) {
  const pin = taxon.mapPin || {};
  const cn  = taxon.climateNormals;

  // Location string
  const locParts = [];
  if (taxon.country) locParts.push(taxon.country);
  if (pin.elevationM != null) locParts.push(pin.elevationM + 'm');
  const locStr = locParts.join(' · ');

  const coordStr = (pin.lat != null && pin.lng != null)
    ? `${pin.lat.toFixed(2)}, ${pin.lng.toFixed(2)}`
    : '';

  // Badges
  let koppenBadge = '';
  if (taxon.koppenZone) {
    const zc = KOPPEN_COLORS[taxon.koppenZone] || '#888';
    koppenBadge = `<span class="badge badge-koppen" style="color:${zc};border-color:${zc}50;background:${zc}1a">
      ${esc(taxon.koppenZone)} · ${esc(taxon.koppenLabel || KOPPEN_LABELS[taxon.koppenZone] || '')}
    </span>`;
  }

  const elev = getElevBand(taxon);
  const elevBadge = elev
    ? `<span class="badge badge-muted">${esc(elev.charAt(0).toUpperCase()+elev.slice(1))}</span>` : '';

  const habitatName = taxon.habitatId
    ? (habitatsMap[taxon.habitatId] || taxon.habitatId.replace(/_/g,' ')) : '';
  const habitatBadge = habitatName
    ? `<span class="badge badge-muted">${esc(habitatName)}</span>` : '';

  const entryBadge = `<span class="badge badge-muted">${esc(ENTRY_LABELS[taxon.entryType] || taxon.entryType)}</span>`;

  // Climate section
  let climateHtml = '';
  if (cn && (cn.tempMax || cn.tempMin) && cn.precipMm) {
    const peakHigh    = cn.tempMax ? Math.max(...cn.tempMax) : null;
    const peakLow     = cn.tempMin ? Math.min(...cn.tempMin) : null;
    const annualPrecip = Math.round(cn.precipMm.reduce((a,b)=>a+b,0));
    const meanTemp    = cn.tempMean ? cn.tempMean.reduce((a,b)=>a+b,0)/12 : null;

    climateHtml = `
      <div class="climate-grid" id="climate-grid">
        <div class="climate-stat">
          <div class="climate-stat-label">Peak High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Peak Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annualPrecip}<span class="climate-stat-unit">mm</span></div>
        </div>
        ${meanTemp != null ? `<div class="climate-stat">
          <div class="climate-stat-label">Mean Temp</div>
          <div class="climate-stat-value" data-celsius="${meanTemp}">${toDisplay(meanTemp, tempUnit)}</div>
        </div>` : ''}
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(cn)}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data not yet recorded for this taxon</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(taxon.displayName)}</div>
    ${taxon.commonName ? `<div class="p-common-name">${esc(taxon.commonName)}</div>` : ''}
    ${locStr ? `<div class="p-location">${esc(locStr)}</div>` : ''}
    ${coordStr ? `<div class="p-location" style="margin-top:-8px;opacity:0.55">${coordStr}</div>` : ''}

    <div class="badge-row">${koppenBadge}${elevBadge}${habitatBadge}${entryBadge}</div>

    ${taxon.nativeRange ? `
      <div class="section-label">Native Range</div>
      <div class="description-text">${esc(taxon.nativeRange)}</div>` : ''}

    ${taxon.nativeHabitat ? `
      <div class="section-label">Habitat</div>
      <div class="description-text">${esc(taxon.nativeHabitat)}</div>` : ''}

    <div class="section-divider"></div>
    <div class="section-label">Climate</div>
    ${climateHtml}

    <a class="gallery-link" href="${GALLERY_BASE}${esc(taxon.slug)}" target="_blank">
      View in Bogman Gallery →
    </a>
  `;

  // Wire expand button
  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && cn) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening  = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(cn);
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  CLIMATE TABLE
// ═══════════════════════════════════════════════════════════

function buildClimateTable(cn) {
  const hasMean = !!(cn.tempMean && cn.tempMean.length);
  const rows = MONTHS.map((m, i) => {
    const hi    = cn.tempMax   ? cn.tempMax[i]   : null;
    const lo    = cn.tempMin   ? cn.tempMin[i]   : null;
    const mean  = hasMean       ? cn.tempMean[i]  : null;
    const prec  = cn.precipMm  ? cn.precipMm[i]  : null;
    return `<tr>
      <td>${m}</td>
      <td data-celsius="${hi}">${toDisplay(hi, tempUnit)}</td>
      <td data-celsius="${lo}">${toDisplay(lo, tempUnit)}</td>
      ${hasMean ? `<td data-celsius="${mean}">${toDisplay(mean, tempUnit)}</td>` : ''}
      <td>${prec != null ? Math.round(prec)+'mm' : '—'}</td>
    </tr>`;
  }).join('');

  const annHi   = cn.tempMax  ? Math.max(...cn.tempMax)              : null;
  const annLo   = cn.tempMin  ? Math.min(...cn.tempMin)              : null;
  const annPrec = cn.precipMm ? Math.round(cn.precipMm.reduce((a,b)=>a+b,0)) : null;

  return `<table class="climate-table">
    <thead><tr>
      <th>Month</th><th>High</th><th>Low</th>
      ${hasMean ? '<th>Mean</th>' : ''}
      <th>Precip</th>
    </tr></thead>
    <tbody>
      ${rows}
      <tr class="annual-row">
        <td>Annual</td>
        <td data-celsius="${annHi}">${toDisplay(annHi, tempUnit)}</td>
        <td data-celsius="${annLo}">${toDisplay(annLo, tempUnit)}</td>
        ${hasMean ? '<td>—</td>' : ''}
        <td>${annPrec != null ? annPrec+'mm' : '—'}</td>
      </tr>
    </tbody>
  </table>`;
}

//  LOCATION SEARCH
// ═══════════════════════════════════════════════════════════

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function nominatimZoom(result) {
  const rank = parseInt(result.place_rank) || 20;
  if (rank <= 4)  return 4;
  if (rank <= 8)  return 5;
  if (rank <= 12) return 7;
  if (rank <= 16) return 9;
  if (rank <= 22) return 11;
  return 13;
}

async function fetchNominatim(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1`;
  try {
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function fetchSearchClimateNormals(lat, lng) {
  // Archive API provides daily data only — aggregate to monthly normals client-side
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&start_date=1991-01-01&end_date=2020-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=UTC`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const raw = d.daily;
    if (!raw || !raw.time) return null;

    const tmaxSum = new Array(12).fill(0), tmaxCnt = new Array(12).fill(0);
    const tminSum = new Array(12).fill(0), tminCnt = new Array(12).fill(0);
    const precSum = new Array(12).fill(0);
    const precYears = Array.from({length: 12}, () => new Set());

    raw.time.forEach((date, i) => {
      const m = parseInt(date.substring(5, 7)) - 1; // 0–11
      const y = date.substring(0, 4);
      const tmax = raw.temperature_2m_max[i];
      if (tmax != null) { tmaxSum[m] += tmax; tmaxCnt[m]++; }
      const tmin = raw.temperature_2m_min[i];
      if (tmin != null) { tminSum[m] += tmin; tminCnt[m]++; }
      const p = raw.precipitation_sum[i];
      if (p != null) { precSum[m] += p; precYears[m].add(y); }
    });

    return {
      tempMax:  tmaxSum.map((s, m) => tmaxCnt[m] ? s / tmaxCnt[m] : null),
      tempMin:  tminSum.map((s, m) => tminCnt[m] ? s / tminCnt[m] : null),
      precipMm: precSum.map((s, m) => precYears[m].size ? s / precYears[m].size : null)
    };
  } catch { return null; }
}

function buildLocationPanel(state) {
  const { result, lat, lng, normals, loading } = state;
  const name = result._name || result.display_name.split(',')[0];
  const a = result.address || {};
  const subLabel = [a.state, a.country].filter(Boolean).join(', ');

  const v = getKoppenAt(lat, lng);
  let koppenBadgeHtml = '';
  if (v >= 1 && v <= 30) {
    const zone = BECK_ZONES[v];
    const [cr, cg, cb] = BECK_COLORS[v];
    koppenBadgeHtml = `<div class="badge-row"><span class="badge badge-koppen" style="color:rgb(${cr},${cg},${cb});border-color:rgba(${cr},${cg},${cb},0.3);background:rgba(${cr},${cg},${cb},0.1)">${esc(zone.code)} · ${esc(zone.desc)}</span></div>`;
  }

  let climateHtml;
  if (loading) {
    climateHtml = `<div class="climate-pending">Loading climate data…</div>`;
  } else if (normals && normals.tempMax && normals.tempMin && normals.precipMm) {
    const validMax = normals.tempMax.filter(x => x != null);
    const validMin = normals.tempMin.filter(x => x != null);
    const peakHigh = validMax.length ? Math.max(...validMax) : null;
    const peakLow  = validMin.length ? Math.min(...validMin) : null;
    const annPrec  = Math.round(normals.precipMm.reduce((a, b) => a + (b || 0), 0));
    climateHtml = `
      <div class="climate-grid">
        <div class="climate-stat"><div class="climate-stat-label">Peak High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div></div>
        <div class="climate-stat"><div class="climate-stat-label">Peak Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div></div>
        <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(normals)}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data unavailable for this location</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(name)}</div>
    ${subLabel ? `<div class="p-common-name">${esc(subLabel)}</div>` : ''}
    <div class="p-location">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
    ${koppenBadgeHtml}
    <div class="section-divider"></div>
    <div class="section-label">Climate (1991–2020 avg)</div>
    ${climateHtml}
  `;

  document.getElementById('side-panel').classList.add('open');

  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && normals && !loading) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(normals);
    });
  }
}

function closeLocationPanel() {
  searchPanelOpen = false;
  searchState = null;
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  document.getElementById('side-panel').classList.remove('open');
  if (climateChart) { climateChart.destroy(); climateChart = null; }
}

window.openClimateAt = async function(lat, lng) {
  map.closePopup();

  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  // Clear search bar since this is a raw map click, not a search result
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950', weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  const coordName = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
  const token = {};
  const fakeResult = { _name: coordName, display_name: coordName, lat: String(lat), lon: String(lng), place_rank: 30, address: {} };

  searchState = { result: fakeResult, lat, lng, normals: null, loading: true, token };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  const [geocode, normals] = await Promise.all([
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&format=json`, { headers: { 'Accept-Language': 'en' } })
      .then(r => r.ok ? r.json() : null).catch(() => null),
    fetchSearchClimateNormals(lat, lng)
  ]);

  if (!searchPanelOpen || !searchState || searchState.token !== token) return;

  if (geocode && geocode.display_name) {
    searchState.result = {
      _name: geocode.display_name.split(',')[0],
      display_name: geocode.display_name,
      lat: String(lat), lon: String(lng),
      place_rank: 30,
      address: geocode.address || {}
    };
  }
  searchState.normals = normals;
  searchState.loading = false;
  buildLocationPanel(searchState);
};

let searchCurrentSuggestions = [];
let searchHighlightedIdx = -1;

function renderSuggestions(results) {
  searchCurrentSuggestions = results;
  searchHighlightedIdx = -1;
  const el = document.getElementById('search-suggestions');
  if (!results.length) { el.classList.remove('open'); return; }
  el.innerHTML = results.map((r, i) => {
    const name = r.display_name.split(',')[0];
    const a = r.address || {};
    const sub = [a.state, a.country].filter(Boolean).join(', ') || (r.type || '').replace(/_/g, ' ');
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-name">${esc(name)}</div>
      ${sub ? `<div class="search-suggestion-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');
  el.classList.add('open');
}

function selectSearchResult(result) {
  const lat = parseFloat(result.lat);
  const lng = parseFloat(result.lon);
  const zoom = nominatimZoom(result);
  const name = result.display_name.split(',')[0];

  document.getElementById('search-input').value = name;
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  // Close taxon panel if open
  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }

  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  map.flyTo([lat, lng], zoom, { duration: 1.0 });

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950',
    weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  searchState = { result, lat, lng, normals: null, loading: true };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  fetchSearchClimateNormals(lat, lng).then(normals => {
    if (!searchPanelOpen || !searchState || searchState.result !== result) return;
    searchState.normals = normals;
    searchState.loading = false;
    buildLocationPanel(searchState);
  });
}

function initSearch() {
  const container   = document.getElementById('search-container');
  const input       = document.getElementById('search-input');
  const clearBtn    = document.getElementById('search-clear');
  const suggestions = document.getElementById('search-suggestions');

  L.DomEvent.disableClickPropagation(container);
  L.DomEvent.disableScrollPropagation(container);

  const doSearch = debounce(async q => {
    if (q.length < 2) { suggestions.classList.remove('open'); return; }
    const results = await fetchNominatim(q);
    if (input.value.trim() === q) renderSuggestions(results);
  }, 300);

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    if (!q) { suggestions.classList.remove('open'); return; }
    doSearch(q);
  });

  function updateHighlight() {
    document.querySelectorAll('.search-suggestion').forEach((el, i) => {
      el.classList.toggle('highlighted', i === searchHighlightedIdx);
    });
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      suggestions.classList.remove('open');
      input.blur();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      searchHighlightedIdx = Math.min(searchHighlightedIdx + 1, searchCurrentSuggestions.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      searchHighlightedIdx = Math.max(searchHighlightedIdx - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const idx = searchHighlightedIdx >= 0 ? searchHighlightedIdx : 0;
      if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
    }
  });

  suggestions.addEventListener('click', e => {
    const row = e.target.closest('.search-suggestion');
    if (!row) return;
    const idx = parseInt(row.dataset.idx);
    if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    suggestions.classList.remove('open');
    searchCurrentSuggestions = [];
    closeLocationPanel();
    input.focus();
  });

  document.addEventListener('click', e => {
    if (!container.contains(e.target)) suggestions.classList.remove('open');
  });
}

// ═══════════════════════════════════════════════════════════
//  FILTERS
// ═══════════════════════════════════════════════════════════

function buildFilterUI() {
  // Genus
  const genusEl = document.getElementById('filter-genus');
  genusEl.innerHTML = availableGenera.map(g => {
    const n = allMapTaxa.filter(t => t.genus === g).length;
    return `<label class="filter-label">
      <input type="checkbox" data-ftype="genus" data-val="${esc(g)}" checked>
      <span class="genus-dot" style="background:${genusColor(g)}"></span>
      ${esc(g)} <span class="filter-count">${n}</span>
    </label>`;
  }).join('');

  // Köppen groups
  const koppenEl = document.getElementById('filter-koppen');
  koppenEl.innerHTML = [
    ['A','Tropical'],['B','Arid'],['C','Temperate'],
    ['D','Continental'],['E','Polar / Highland'],['?','No zone data']
  ].map(([k, label]) => `<label class="filter-label">
    <input type="checkbox" data-ftype="koppen" data-val="${k}" checked>
    ${label}
  </label>`).join('');

  // Elevation bands
  const elevEl = document.getElementById('filter-elev');
  elevEl.innerHTML = [...ELEV_BANDS, '?'].map(b => `<label class="filter-label">
    <input type="checkbox" data-ftype="elev" data-val="${b}" checked>
    ${b === '?' ? 'Not set' : b.charAt(0).toUpperCase()+b.slice(1)}
  </label>`).join('');

  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', applyFilters)
  );
  document.getElementById('filter-reset').addEventListener('click', resetFilters);
}

function applyFilters() {
  const checkedGenera  = new Set([...document.querySelectorAll('[data-ftype=genus]:checked')].map(el => el.dataset.val));
  const checkedKoppen  = new Set([...document.querySelectorAll('[data-ftype=koppen]:checked')].map(el => el.dataset.val));
  const checkedElev    = new Set([...document.querySelectorAll('[data-ftype=elev]:checked')].map(el => el.dataset.val));

  const allGenera  = availableGenera.length;
  const isDefault  = checkedGenera.size === allGenera && checkedKoppen.size === 6 && checkedElev.size === ELEV_BANDS.length + 1;
  document.getElementById('filter-reset').style.display = isDefault ? 'none' : 'block';

  markerStore.forEach(({ marker, circle, taxon }) => {
    const genusOk  = checkedGenera.has(taxon.genus);
    const kg       = koppenGroup(taxon.koppenZone);
    const koppenOk = checkedKoppen.has(kg);
    const eb       = getElevBand(taxon) || '?';
    const elevOk   = checkedElev.has(eb) || (eb === '?' && checkedElev.has('?'));
    const show     = genusOk && koppenOk && elevOk;

    show ? marker.addTo(map) : map.removeLayer(marker);
    if (circle) show ? circle.addTo(map) : map.removeLayer(circle);
  });
}

function resetFilters() {
  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb => { cb.checked = true; });
  applyFilters();
}

// ═══════════════════════════════════════════════════════════
//  UNMAPPED LIST
// ═══════════════════════════════════════════════════════════

function buildUnmappedList() {
  const sorted = [...unmappedTaxa].sort((a, b) =>
    (a.genus + a.species + a.displayName).localeCompare(b.genus + b.species + b.displayName)
  );
  document.getElementById('unmapped-count').textContent = sorted.length;

  document.getElementById('unmapped-list').innerHTML = sorted.map(t => {
    const icons = [];
    if (!t.mapPin?.lat)     icons.push(`<span class="unmapped-icon" title="No coordinates">📍</span>`);
    if (!t.koppenZone)      icons.push(`<span class="unmapped-icon" title="No Köppen zone">🌡️</span>`);
    if (!t.mapPin?.elevationM) icons.push(`<span class="unmapped-icon" title="No elevation">↕</span>`);
    return `<div class="unmapped-row">
      <div class="unmapped-name" title="${esc(t.displayName)}">${esc(t.displayName)}</div>
      <div class="unmapped-country">${esc(t.country || '—')}</div>
      <div class="unmapped-icons">${icons.join('')}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
//  URL / DEEP LINK
// ═══════════════════════════════════════════════════════════

function setUrlParam(key, val) {
  const url = new URL(location.href);
  val ? url.searchParams.set(key, val) : url.searchParams.delete(key);
  history.replaceState(null, '', url);
}

function handleUrlParams() {
  const p    = new URLSearchParams(location.search);
  const txnId = p.get('taxon');
  const slug  = p.get('slug');
  let taxon = null;
  if (txnId)  taxon = allMapTaxa.find(t => t.id === txnId);
  if (!taxon && slug) taxon = allMapTaxa.find(t => t.slug === slug);
  if (taxon) { openPanel(taxon); flyToTaxon(taxon); }
}

// ═══════════════════════════════════════════════════════════
//  MOBILE SWIPE TO DISMISS
// ═══════════════════════════════════════════════════════════

function initMobileSwipe() {
  const panel  = document.getElementById('side-panel');
  const handle = document.getElementById('panel-drag-handle');
  const header = document.getElementById('panel-header');
  let startY = 0, dragging = false;

  function onStart(e) {
    startY   = e.touches[0].clientY;
    dragging = true;
    panel.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(e) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    panel.style.transform = '';
    if (dy > 80) closePanel();
  }

  [handle, header].forEach(el => {
    el.addEventListener('touchstart', onStart, { passive: true });
  });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend',  onEnd);
}

// ═══════════════════════════════════════════════════════════
//  ELIGIBILITY
// ═══════════════════════════════════════════════════════════

function isEligible(t) {
  if (t.mapPin?.override === true && t.mapPin?.includedOnMap === true) return true;
  return t.entryType === 'species' || t.entryType === 'location';
}

function hasCoords(t) {
  return t.mapPin?.lat != null && t.mapPin?.lng != null;
}

// ═══════════════════════════════════════════════════════════
//  MAIN INIT
// ═══════════════════════════════════════════════════════════

async function init() {
  setProgress(10);
  initMap();
  buildMapControls();
  initMobileSwipe();
  initSearch();

  // UI wiring
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('unit-f').addEventListener('click', () => setTempUnit('F'));
  document.getElementById('unit-c').addEventListener('click', () => setTempUnit('C'));
  document.getElementById('unit-f').classList.toggle('active', tempUnit === 'F');
  document.getElementById('unit-c').classList.toggle('active', tempUnit === 'C');

  document.getElementById('filter-toggle').addEventListener('click', e => {
    e.stopPropagation();
    const open = document.getElementById('filter-panel').classList.toggle('open');
    document.getElementById('filter-toggle').classList.toggle('active', open);
  });

  document.getElementById('unmapped-toggle').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('unmapped-panel').classList.toggle('open');
  });

  // Close filter/unmapped panels on map click
  map.on('click', () => {
    document.getElementById('filter-panel').classList.remove('open');
    document.getElementById('filter-toggle').classList.remove('active');
    document.getElementById('unmapped-panel').classList.remove('open');
  });

  document.getElementById('copy-csv').addEventListener('click', () => {
    const lines = ['id,slug,displayName,country,entryType'];
    unmappedTaxa.forEach(t =>
      lines.push(`${t.id},${t.slug},"${(t.displayName||'').replace(/"/g,'""')}",${t.country||''},${t.entryType}`)
    );
    navigator.clipboard?.writeText(lines.join('\n')).then(() => {
      const btn = document.getElementById('copy-csv');
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = 'Copy CSV'; }, 1600);
    });
  });

  setProgress(22);

  // Load species data
  try {
    const res  = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    setProgress(60);

    // Habitats lookup
    if (Array.isArray(data.habitats)) {
      data.habitats.forEach(h => { habitatsMap[h.id] = h.name; });
    }

    const eligible  = (data.taxa || []).filter(isEligible);
    allMapTaxa      = eligible.filter(hasCoords);
    unmappedTaxa    = eligible.filter(t => !hasCoords(t));

    // Collect genera present on map
    const genSet = new Set(allMapTaxa.map(t => t.genus));
    availableGenera = [...genSet].sort();
    availableGenera.forEach(g => activeFilters.genera.add(g));

    setProgress(75);
    renderPins(allMapTaxa);
    buildFilterUI();
    buildUnmappedList();
    setProgress(88);

    await loadKoppen();

    // Ensure pins sit above Köppen layer
    markerStore.forEach(({ marker }) => marker.bringToFront?.());

    setProgress(100);
    handleUrlParams();

  } catch (err) {
    console.error('Data load failed:', err);
    setProgress(100);
    document.getElementById('unmapped-count').textContent = '!';
  }
}

init();
</script>
