function buildSpeciesSidebarContent(entry) {
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }

  const photoHtml = entry.photo_url
    ? `<img class="sp-photo" src="${esc(entry.photo_url)}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="sp-photo-placeholder">🌿</div>`;

  // Headline climate stats
  const s       = entry.stats || {};
  const coldC   = s.tempMin?.p10;
  const heatC   = s.tempMax?.p90;
  const precMed = s.precip?.p50;
  const rhLo    = s.rhMean?.p25;
  const rhHi    = s.rhMean?.p75;

  const statsHtml = `
    <div class="sp-stats-grid">
      <div class="sp-stat-card">
        <div class="sp-stat-label">Cold limit</div>
        <div class="sp-stat-value">${toDisplay(coldC, tempUnit)}</div>
        <div class="sp-stat-sub">10th pct annual min</div>
      </div>
      <div class="sp-stat-card">
        <div class="sp-stat-label">Heat limit</div>
        <div class="sp-stat-value">${toDisplay(heatC, tempUnit)}</div>
        <div class="sp-stat-sub">90th pct annual max</div>
      </div>
      <div class="sp-stat-card">
        <div class="sp-stat-label">Annual rainfall</div>
        <div class="sp-stat-value">${precMed != null ? precMed + 'mm' : '—'}</div>
        <div class="sp-stat-sub">median across range</div>
      </div>
      <div class="sp-stat-card">
        <div class="sp-stat-label">Humidity</div>
        <div class="sp-stat-value">${rhLo != null && rhHi != null ? rhLo + '–' + rhHi + '%' : '—'}</div>
        <div class="sp-stat-sub">typical midrange</div>
      </div>
    </div>`;

  // Chart section — hemisphere toggle only shown if SH data exists
  const hasSH = !!entry.monthly_sh;
  const chartHtml = `
    <div class="sp-chart-section">
      <div class="sp-chart-header">
        <span class="sp-chart-title" id="sp-chart-title-text">Monthly climate</span>
        ${hasSH ? `<button class="sp-hemi-btn" id="sp-hemi-toggle">Southern ⇄</button>` : ''}
      </div>
      <div id="sp-chart-container"><canvas id="sp-climate-chart"></canvas></div>
      <div class="sp-chart-note">Temperatures corrected for elevation (6.5°C/1000m lapse rate). Precipitation and humidity are uncorrected.</div>
    </div>`;

  // Köppen zone distribution
  const koppenEntries = entry.koppen || [];
  const koppenTotal   = koppenEntries.reduce((s, [, c]) => s + c, 0);
  const MAX_KP        = 8;

  const koppenRowsHtml = (arr) => arr.map(([zone, count]) => {
    const info = BECK_ZONES[zone] || {};
    const pct  = koppenTotal ? Math.round(count / koppenTotal * 100) : 0;
    const [r,g,b] = BECK_COLORS[zone] || [128,128,128];
    return `<div class="sp-koppen-row">
      <span class="badge badge-koppen" style="color:rgb(${r},${g},${b});border-color:rgba(${r},${g},${b},0.3);background:rgba(${r},${g},${b},0.1);min-width:32px;text-align:center;font-size:10px">${info.code || zone}</span>
      <span class="sp-koppen-name">${esc(info.desc || 'Unknown')} <span style="font-size:10px">${esc(info.group || '')}</span></span>
      <span class="sp-koppen-pct">${pct}%</span>
    </div>`;
  }).join('');

  const koppenHtml = `
    <details class="inat-section" open>
      <summary>🌍 Climate zones (${koppenEntries.length})</summary>
      <div class="inat-section-body">
        <div id="sp-koppen-body">${koppenRowsHtml(koppenEntries.slice(0, MAX_KP))}</div>
        ${koppenEntries.length > MAX_KP
          ? `<div id="sp-koppen-ctrl"><button class="sp-expand-btn" id="sp-koppen-btn">Show all ${koppenEntries.length} zones ↓</button></div>`
          : ''}
      </div>
    </details>`;

  // Wikipedia excerpt
  const wiki    = entry.wikipedia_summary || '';
  const wikiUrl = entry.inat_url || '';
  let wikiHtml  = '';
  if (wiki) {
    const sentences = wiki.match(/[^.!?]+[.!?]+\s*/g) || [];
    const preview   = sentences.slice(0, 2).join('').trim();
    const truncated = wiki.length > preview.length + 10;
    wikiHtml = `
      <details class="inat-section">
        <summary>📖 About this species</summary>
        <div class="inat-section-body">
          <div class="sp-wiki-text" id="sp-wiki-text">${esc(preview)}${truncated ? '…' : ''}</div>
          ${truncated ? `<button class="sp-expand-btn" id="sp-wiki-expand" style="margin-top:8px">Read more ↓</button>` : ''}
          ${wikiUrl ? `<a class="inat-view-link" href="${esc(wikiUrl)}" target="_blank" rel="noopener" style="display:inline-flex;margin-top:10px">View on iNaturalist →</a>` : ''}
        </div>
      </details>`;
  }

  const sampleNote = `<div class="sp-sample-note">
    Climate envelope from ${entry.sample_count} representative locations (0.5° grid, dense-cluster selection).
    ${entry.obs_count.toLocaleString()} total sightings.
  </div>`;

  // Assemble and inject
  const inatUrl = entry.inat_url || '';
  document.getElementById('panel-content').innerHTML = `
    <div class="sp-header">
      ${photoHtml}
      <div class="sp-header-text">
        <div class="sp-scientific-name">${esc(entry.scientific_name)}</div>
        ${entry.common_name ? `<div class="sp-common-name">${esc(entry.common_name)}</div>` : ''}
        <div class="sp-meta">${entry.obs_count.toLocaleString()} sightings${inatUrl ? ` · <a href="${esc(inatUrl)}" target="_blank" rel="noopener">iNaturalist →</a>` : ''}</div>
      </div>
    </div>
    ${statsHtml}
    ${chartHtml}
    ${koppenHtml}
    ${wikiHtml}
    ${sampleNote}
  `;

  // Build chart
  const monthly = speciesHemi === 'sh' && entry.monthly_sh ? entry.monthly_sh : entry.monthly_nh;
  buildSpeciesClimateChart(monthly);

  // Hemisphere toggle
  document.getElementById('sp-hemi-toggle')?.addEventListener('click', () => {
    speciesHemi = speciesHemi === 'nh' ? 'sh' : 'nh';
    // Update title and button without rebuilding whole content
    const titleEl = document.getElementById('sp-chart-title-text');
    const btn     = document.getElementById('sp-hemi-toggle');
    if (titleEl) titleEl.textContent = speciesHemi === 'sh' ? 'Monthly climate (Southern hemisphere)' : 'Monthly climate';
    if (btn)     { btn.textContent = speciesHemi === 'sh' ? 'Northern ⇄' : 'Southern ⇄'; btn.classList.toggle('active-sh', speciesHemi === 'sh'); }
    const newMonthly = speciesHemi === 'sh' && entry.monthly_sh ? entry.monthly_sh : entry.monthly_nh;
    buildSpeciesClimateChart(newMonthly);
  });

  // Köppen expand/collapse
  let koppenExpanded = false;
  function renderKoppenItems() {
    const body = document.getElementById('sp-koppen-body');
    if (!body) return;
    body.innerHTML = koppenRowsHtml(koppenExpanded ? koppenEntries : koppenEntries.slice(0, MAX_KP));
    const ctrl = document.getElementById('sp-koppen-ctrl');
    if (ctrl) {
      const btn = ctrl.querySelector('#sp-koppen-btn');
      if (btn) {
        btn.textContent = koppenExpanded ? 'Show fewer ↑' : `Show all ${koppenEntries.length} zones ↓`;
        btn.onclick = () => { koppenExpanded = !koppenExpanded; renderKoppenItems(); };
      }
    }
  }
  if (koppenEntries.length > MAX_KP) {
    document.getElementById('sp-koppen-btn')?.addEventListener('click', () => {
      koppenExpanded = !koppenExpanded;
      renderKoppenItems();
    });
  }

  // Wikipedia expand
  if (wiki) {
    document.getElementById('sp-wiki-expand')?.addEventListener('click', () => {
      const el  = document.getElementById('sp-wiki-text');
      const btn = document.getElementById('sp-wiki-expand');
      if (el) el.textContent = wiki;
      if (btn) btn.remove();
    });
  }
}

function buildSpeciesClimateChart(monthly) {
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  const ctx = document.getElementById('sp-climate-chart');
  if (!ctx || !monthly) return;

  // p-index: 0=p25, 1=p50, 2=p75
  const pick = (arr, pi) => {
    if (!arr) return new Array(12).fill(null);
    let data = arr.map(v => v ? v[pi] : null);
    if (speciesHemi === 'sh') data = [...data.slice(6), ...data.slice(0, 6)];
    return data;
  };

  const SH_MONTHS = ['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'];
  const labels = speciesHemi === 'sh' ? SH_MONTHS : MONTHS;

  speciesClimateChart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { // band top — invisible border, fills downward to dataset[1]
          type: 'line', label: '_top',
          data: pick(monthly.tempMax, 2),  // p75 of tempMax
          borderWidth: 0, borderColor: 'transparent',
          backgroundColor: 'rgba(150,160,200,0.13)',
          fill: '+1', tension: 0.4, pointRadius: 0, yAxisID: 'yTemp',
        },
        { // band bottom — base of fill
          type: 'line', label: '_bot',
          data: pick(monthly.tempMin, 0),  // p25 of tempMin
          borderWidth: 0, borderColor: 'transparent',
          backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 0, yAxisID: 'yTemp',
        },
        {
          type: 'line', label: 'Avg High',
          data: pick(monthly.tempMax, 1),  // p50 of tempMax
          borderColor: 'rgba(255,140,60,0.85)', backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, yAxisID: 'yTemp',
        },
        {
          type: 'line', label: 'Avg Low',
          data: pick(monthly.tempMin, 1),  // p50 of tempMin
          borderColor: 'rgba(100,180,255,0.85)', backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, yAxisID: 'yTemp',
        },
        {
          type: 'bar', label: 'Precip',
          data: pick(monthly.precip, 1),   // p50 of precip
          backgroundColor: 'rgba(80,160,240,0.45)',
          borderColor: 'rgba(80,160,240,0.7)', borderWidth: 1, yAxisID: 'yPrecip',
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,

function selectInatTaxon(result) {
  const { taxonName, count } = result;
  document.getElementById('search-input').value = taxonName;
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  // Enable iNat layer if it's off
  if (!inatVisible) enableInatLayer();

  // Apply species filter and rebuild clusters
  inatSpeciesFilter = taxonName;
  searchInatTaxa._counts = null; // allow recount after filter change
  rebuildInatIndex();

  // Fit map to this species' observations
  const pts = [];
  const nameMatch = inatTaxa.findIndex(t => t[1] === taxonName);
  for (const o of inatObs) {
    if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) pts.push([o[OBS_LAT], o[OBS_LNG]]);
  }
  if (pts.length) {
    map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 9, animate: true, duration: 1.0 });
  }

  // Open species sidebar (async — loads species-data.json lazily)
  openSpeciesSidebar(result.taxonId, taxonName);
}

function initSearch() {
  const container   = document.getElementById('search-container');
  const input       = document.getElementById('search-input');
  const clearBtn    = document.getElementById('search-clear');
  const suggestions = document.getElementById('search-suggestions');

  L.DomEvent.disableClickPropagation(container);
  L.DomEvent.disableScrollPropagation(container);

  const doSearch = debounce(async q => {
    if (q.length < 2) { suggestions.classList.remove('open'); return; }
    // Show iNat species matches instantly (in-memory), then append location results
    const taxonResults = searchInatTaxa(q);
    if (taxonResults.length && input.value.trim() === q) renderSuggestions(taxonResults);
    const locationResults = await fetchNominatim(q);
    if (input.value.trim() === q) renderSuggestions([...taxonResults, ...locationResults]);
  }, 300);

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    if (!q) { suggestions.classList.remove('open'); return; }
    doSearch(q);
  });

  function updateHighlight() {
    document.querySelectorAll('.search-suggestion').forEach((el, i) => {
      el.classList.toggle('highlighted', i === searchHighlightedIdx);
    });
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      suggestions.classList.remove('open');
      input.blur();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      searchHighlightedIdx = Math.min(searchHighlightedIdx + 1, searchCurrentSuggestions.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      searchHighlightedIdx = Math.max(searchHighlightedIdx - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const idx = searchHighlightedIdx >= 0 ? searchHighlightedIdx : 0;
      if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
    }
  });

  suggestions.addEventListener('click', e => {
    const row = e.target.closest('.search-suggestion');
    if (!row) return;
    const idx = parseInt(row.dataset.idx);
    if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    suggestions.classList.remove('open');
    searchCurrentSuggestions = [];
    closeLocationPanel();
    if (inatSpeciesFilter) {
      inatSpeciesFilter = null;
      searchInatTaxa._counts = null;
      rebuildInatIndex();
    }
    inatSpeciesSidebarId     = null;
    inatNav.speciesTaxonId   = null;
    inatNav.speciesTaxonName = null;
    if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
    input.focus();
  });

  document.addEventListener('click', e => {
    if (!container.contains(e.target)) suggestions.classList.remove('open');
  });
}

function buildFilterUI() {
  // Genus
  const genusEl = document.getElementById('filter-genus');
  genusEl.innerHTML = availableGenera.map(g => {
    const n = allMapTaxa.filter(t => t.genus === g).length;
    return `<label class="filter-label">
      <input type="checkbox" data-ftype="genus" data-val="${esc(g)}" checked>
      <span class="genus-dot" style="background:${genusColor(g)}"></span>
      ${esc(g)} <span class="filter-count">${n}</span>
    </label>`;
  }).join('');

  // Köppen groups
  const koppenEl = document.getElementById('filter-koppen');
  koppenEl.innerHTML = [
    ['A','Tropical'],['B','Arid'],['C','Temperate'],
    ['D','Continental'],['E','Polar / Highland'],['?','No zone data']
  ].map(([k, label]) => `<label class="filter-label">
    <input type="checkbox" data-ftype="koppen" data-val="${k}" checked>
    ${label}
  </label>`).join('');

  // Elevation bands
  const elevEl = document.getElementById('filter-elev');
  elevEl.innerHTML = [...ELEV_BANDS, '?'].map(b => `<label class="filter-label">
    <input type="checkbox" data-ftype="elev" data-val="${b}" checked>
    ${b === '?' ? 'Not set' : b.charAt(0).toUpperCase()+b.slice(1)}
  </label>`).join('');

  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', applyFilters)
  );
  document.getElementById('filter-reset').addEventListener('click', resetFilters);
}

function applyFilters() {
  const checkedGenera  = new Set([...document.querySelectorAll('[data-ftype=genus]:checked')].map(el => el.dataset.val));
  const checkedKoppen  = new Set([...document.querySelectorAll('[data-ftype=koppen]:checked')].map(el => el.dataset.val));
  const checkedElev    = new Set([...document.querySelectorAll('[data-ftype=elev]:checked')].map(el => el.dataset.val));

  const allGenera  = availableGenera.length;
  const isDefault  = checkedGenera.size === allGenera && checkedKoppen.size === 6 && checkedElev.size === ELEV_BANDS.length + 1;
  document.getElementById('filter-reset').style.display = isDefault ? 'none' : 'block';

  markerStore.forEach(({ marker, circle, taxon }) => {
    const genusOk  = checkedGenera.has(taxon.genus);
    const kg       = koppenGroup(taxon.koppenZone);
    const koppenOk = checkedKoppen.has(kg);
    const eb       = getElevBand(taxon) || '?';
    const elevOk   = checkedElev.has(eb) || (eb === '?' && checkedElev.has('?'));
    const show     = genusOk && koppenOk && elevOk;

    show ? marker.addTo(map) : map.removeLayer(marker);
    if (circle) show ? circle.addTo(map) : map.removeLayer(circle);
  });
}

function resetFilters() {
  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb => { cb.checked = true; });
  applyFilters();
}

function buildUnmappedList() {

function setUrlParam(key, val) {
  const url = new URL(location.href);
  val ? url.searchParams.set(key, val) : url.searchParams.delete(key);
  history.replaceState(null, '', url);
}

function handleUrlParams() {
  const p    = new URLSearchParams(location.search);
  const txnId = p.get('taxon');
  const slug  = p.get('slug');
  let taxon = null;
  if (txnId)  taxon = allMapTaxa.find(t => t.id === txnId);
  if (!taxon && slug) taxon = allMapTaxa.find(t => t.slug === slug);
  if (taxon) { openPanel(taxon); flyToTaxon(taxon); }
}

function initMobileSwipe() {
  const panel  = document.getElementById('side-panel');
  const handle = document.getElementById('panel-drag-handle');
  const header = document.getElementById('panel-header');
  let startY = 0, dragging = false;

  function onStart(e) {
    startY   = e.touches[0].clientY;
    dragging = true;
    panel.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(e) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    panel.style.transform = '';
    if (dy > 80) closePanel();
  }

  [handle, header].forEach(el => {
    el.addEventListener('touchstart', onStart, { passive: true });
  });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend',  onEnd);
}

function isEligible(t) {
  if (t.mapPin?.override === true && t.mapPin?.includedOnMap === true) return true;
  return t.entryType === 'species' || t.entryType === 'location';
}

function hasCoords(t) {
  return t.mapPin?.lat != null && t.mapPin?.lng != null;
}

async function init() {
  setProgress(10);

  initSearch();

  document.getElementById('panel-close').addEventListener('click', closePanel);

    document.getElementById('filter-toggle').classList.remove('active');

  });

  document.getElementById('copy-csv').addEventListener('click', () => {

      lines.push(`${t.id},${t.slug},"${(t.displayName||'').replace(/"/g,'""')}",${t.country||''},${t.entryType}`)
    );
    navigator.clipboard?.writeText(lines.join('\n')).then(() => {
      const btn = document.getElementById('copy-csv');
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = 'Copy CSV'; }, 1600);
    });
  });

  setProgress(22);

  // Load species data
  try {
    const res  = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    setProgress(60);

    // Habitats lookup
    if (Array.isArray(data.habitats)) {
      data.habitats.forEach(h => { habitatsMap[h.id] = h.name; });
    }

    const eligible  = (data.taxa || []).filter(isEligible);
    allMapTaxa      = eligible.filter(hasCoords);
    unmappedTaxa    = eligible.filter(t => !hasCoords(t));

    // Collect genera present on map
    const genSet = new Set(allMapTaxa.map(t => t.genus));
    availableGenera = [...genSet].sort();
    availableGenera.forEach(g => activeFilters.genera.add(g));

    setProgress(75);
    renderPins(allMapTaxa);
    buildFilterUI();
    buildUnmappedList();
    setProgress(88);

    await loadKoppen();

    // Ensure pins sit above Köppen layer
    markerStore.forEach(({ marker }) => marker.bringToFront?.());

    setProgress(100);
    handleUrlParams();
    buildInatFilterPanel();
    scheduleInatPrefetch();

    // Close iNat panel on map click
    map.on('click', () => {
      document.getElementById('inat-panel').classList.remove('open');
    });

  } catch (err) {
    console.error('Data load failed:', err);
    setProgress(100);
    document.getElementById('unmapped-count').textContent = '!';
  }
}

// ── Inline worker (Supercluster runs off main thread) ─────

const INAT_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js');
let sc = null;
self.onmessage = function(e) {
  const { type } = e.data;
  if (type === 'load') {
    sc = new Supercluster({ radius: 120, maxZoom: 16, minPoints: 3 });
    sc.load(e.data.features);
    self.postMessage({ type: 'loaded', count: e.data.features.length });
  }
  if (type === 'getClusters') {
    const clusters = sc ? sc.getClusters(e.data.bbox, e.data.zoom) : [];
    self.postMessage({ type: 'clusters', clusters, zoom: e.data.zoom });
  }
  if (type === 'getLeaves') {
    const leaves = sc ? sc.getLeaves(e.data.clusterId, e.data.limit || Infinity, e.data.offset || 0) : [];
    self.postMessage({ type: 'leaves', leaves, clusterId: e.data.clusterId });
  }
};`;

function initInatWorker() {
  if (inatWorker) inatWorker.terminate();
  const blob = new Blob([INAT_WORKER_SRC], { type: 'application/javascript' });
  inatWorker = new Worker(URL.createObjectURL(blob));
  inatWorkerReady = false;
  inatWorker.onmessage = handleWorkerMessage;
  inatWorker.onerror   = err => console.error('iNat worker error:', err);
}

function handleWorkerMessage(e) {
  const { type } = e.data;
  if (type === 'loaded') {
    inatWorkerReady = true;
    setInatStatus('');
    renderInatClusters();
  }
  if (type === 'clusters') {
    drawInatClusters(e.data.clusters, e.data.zoom);
  }
  if (type === 'leaves') {
    const { leaves, clusterId } = e.data;
    inatNav.clusterLeaves = leaves;
    openSidePanelForInat();
    renderInatSpeciesList(leaves);
  }
}

// ── Data loading ──────────────────────────────────────────

function inatDataUrl(genus) {
  return genus === 'all' ? './inat/all.json' : `./inat/${genus.toLowerCase()}.json`;
}

async function loadInatAll() {
  setInatStatus('Loading observations…', true);
  try {
    const res  = await fetch(inatDataUrl('all'));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    inatTaxa     = data.taxa;
    inatObs      = data.obs;
    inatAllLoaded = true;
    INAT_GENERA.forEach(g => inatLoadedGenera.add(g));
    rebuildInatIndex();
  } catch (err) {
    console.error('Failed to load inat/all.json:', err);
    setInatStatus('Data unavailable — run the fetch script first');
  }
}

async function loadInatGenus(genus) {
  if (inatLoadedGenera.has(genus) || inatAllLoaded) return;
  setInatStatus(`Loading ${genus}…`, true);
  try {
    const res  = await fetch(inatDataUrl(genus));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Merge taxa — remap indices
    const offset = inatTaxa.length;
    inatTaxa.push(...data.taxa);
    for (const o of data.obs) {
      inatObs.push([o[0], o[1], o[2], o[3] + offset, o[4], o[5], o[6], o[7]]);
    }
    inatLoadedGenera.add(genus);
    setInatStatus('');
    rebuildInatIndex();
  } catch (err) {
    console.error(`Failed to load inat/${genus}.json:`, err);
    setInatStatus(`Could not load ${genus} data`);
  }
}

// ── Feature building ──────────────────────────────────────

// obs layout: [id, lat, lng, taxon_idx, date, flags, photo_id, koppen]
const OBS_ID=0, OBS_LAT=1, OBS_LNG=2, OBS_TI=3, OBS_DATE=4, OBS_FLAGS=5, OBS_PHOTO=6, OBS_KOP=7;
const F_NEEDSID=1, F_OBSCURED=2, F_PHOTO=4;

function buildInatFeatures() {
  const features = [];
  for (const o of inatObs) {
    const taxon  = inatTaxa[o[OBS_TI]];
    if (!taxon) continue;
    const genus  = taxon[2];
    const flags  = o[OBS_FLAGS];
    const koppen = o[OBS_KOP];
    // Filter
    if (inatSpeciesFilter ? taxon[1] !== inatSpeciesFilter : !inatFilters.genera.has(genus)) continue;
    if ((flags & F_NEEDSID) && !inatFilters.needsId) continue;
    if (!inatFilters.koppen.has(koppen) && koppen !== 0) continue;
    features.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [o[OBS_LNG], o[OBS_LAT]] },
      properties: {
        obs_id:      o[OBS_ID],
        lat:         o[OBS_LAT],
        lng:         o[OBS_LNG],
        taxon_idx:   o[OBS_TI],
        date:        o[OBS_DATE],
        flags,
        photo_id:    o[OBS_PHOTO],
        koppen,
        genus,
        taxon_name:  taxon[1],
        common_name: taxon[3],
      }
    });
  }
  return features;
}

function rebuildInatIndex() {
  if (!inatWorker) return;
  setInatStatus('Indexing…', true);
  const features = buildInatFeatures();
  inatWorker.postMessage({ type: 'load', features });
}

// ── Rendering ─────────────────────────────────────────────

function renderInatClusters() {
  if (!inatWorkerReady || !inatVisible) return;
  const bounds = map.getBounds();
  const bbox   = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
  const zoom   = Math.floor(map.getZoom());
  inatWorker.postMessage({ type: 'getClusters', bbox, zoom });
}

function drawInatClusters(clusters, zoom) {
  inatClusterGroup.clearLayers();
  inatRectGroup.clearLayers();

  for (const f of clusters) {
    const props = f.properties;

    if (props.cluster) {
      // ── Cluster circle ──────────────────────────────
      const count = props.point_count;
      const size  = Math.max(28, Math.min(60, 20 + Math.log2(count) * 7));
      const hue   = Math.max(0, 120 - count / 50);  // green → orange → red
      const icon  = L.divIcon({
        className: '',
        html: `<div class="inat-cluster-icon" style="width:${size}px;height:${size}px;background:hsl(${hue},70%,40%);font-size:${size < 36 ? 10 : 12}px">${count > 999 ? Math.round(count/1000)+'k' : count}</div>`,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2],
      });
      const marker = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { icon, zIndexOffset: 50 });
      marker.on('click', e => {
        L.DomEvent.stopPropagation(e);
        inatNav.clusterLatlng = e.latlng;
        inatWorker.postMessage({ type: 'getLeaves', clusterId: props.cluster_id });
      });
      inatClusterGroup.addLayer(marker);

    } else {
      // ── Individual observation ───────────────────────
      const { lat, lng, flags, photo_id, genus, obs_id, taxon_name, common_name, date } = props;
      const color    = INAT_GENUS_COLORS[genus] || '#aaa';
      const obscured = !!(flags & F_OBSCURED);

      if (obscured) {
        // Draw the iNat 0.2° uncertainty box
        const swLat = Math.floor(lat / 0.2) * 0.2;
        const swLng = Math.floor(lng / 0.2) * 0.2;
        const rect  = L.rectangle([[swLat, swLng], [swLat + 0.2, swLng + 0.2]], {
          className:   'inat-obscured-rect',
          color,
          fillColor:   color,
          fillOpacity: 0.08,
          weight:      1.5,
          dashArray:   '5,4',
          interactive: true,
        });
        rect.on('click', e => { L.DomEvent.stopPropagation(e); openInatObsPanel(f); });
        inatRectGroup.addLayer(rect);
      } else {
        const marker = L.circleMarker([lat, lng], {
          radius:      5,
          color:       '#fff',
          fillColor:   color,
          weight:      1.5,
          fillOpacity: 0.85,
          opacity:     0.9,
          interactive: true,
        });
        marker.on('click', e => { L.DomEvent.stopPropagation(e); openInatObsPanel(f); });
        inatClusterGroup.addLayer(marker);
      }
    }
  }
}

// ── Side panel — species list ─────────────────────────────

function openSidePanelForInat() {
  // Close species panel if open, preserve search panel logic
  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
    if (lightChart)   { lightChart.destroy();   lightChart   = null; }
  }
  if (searchPanelOpen) {
    searchPanelOpen = false;
    searchState = null;
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  }
  document.getElementById('side-panel').classList.add('open');
}

function renderInatSpeciesList(leaves) {
  inatNav.mode = 'species-list';
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  openSidePanelForInat();

  // Count by taxon name
  const counts = {};
  for (const lf of leaves) {
    const name = lf.properties.taxon_name || 'Unknown';
    counts[name] = (counts[name] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const coord = inatNav.clusterLatlng
    ? `${Math.abs(inatNav.clusterLatlng.lat).toFixed(2)}°${inatNav.clusterLatlng.lat>=0?'N':'S'}, ${Math.abs(inatNav.clusterLatlng.lng).toFixed(2)}°${inatNav.clusterLatlng.lng>=0?'E':'W'}`
    : '';

  const rows = sorted.map(([name, cnt]) => {
    const sample = leaves.find(lf => lf.properties.taxon_name === name);
    const genus  = sample?.properties.genus || '';
    const color  = INAT_GENUS_COLORS[genus] || '#aaa';
    return `<div class="inat-species-row" data-species="${esc(name)}">
      <div class="inat-species-name">
        <span class="inat-genus-dot" style="background:${color}"></span>
        ${esc(name)}
      </div>
      <span class="inat-species-count">${cnt}</span>
    </div>`;
  }).join('');

  const backToSpecies = inatNav.speciesTaxonId
    ? `<button class="inat-panel-back" id="inat-back-species-sidebar">← Species Info</button>`
    : '';

  document.getElementById('panel-content').innerHTML = `
    ${backToSpecies}
    <div class="inat-cluster-title">${leaves.length.toLocaleString()} iNat sightings</div>
    <div class="inat-cluster-sub">${coord} · ${sorted.length} species</div>
    <div class="inat-species-list">${rows}</div>
  `;

  document.getElementById('inat-back-species-sidebar')?.addEventListener('click', () => {
    openSpeciesSidebar(inatNav.speciesTaxonId, inatNav.speciesTaxonName);
  });

  document.querySelectorAll('.inat-species-row').forEach(el => {
    el.addEventListener('click', () => {
      inatNav.speciesName = el.dataset.species;
      renderInatObsList(inatNav.clusterLeaves.filter(lf => lf.properties.taxon_name === el.dataset.species));
    });
  });
}

// ── Side panel — observation list ────────────────────────

const INAT_OBS_PAGE = 20;

function renderInatObsList(leaves, offset = 0) {
  inatNav.mode = 'obs-list';
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }

  const page    = leaves.slice(offset, offset + INAT_OBS_PAGE);
  const hasMore = leaves.length > offset + INAT_OBS_PAGE;

  const backBtn = `<button class="inat-panel-back" id="inat-back-species">← Species list</button>`;

  const cards = page.map(lf => obsCard(lf)).join('');

  const content = `
    ${backBtn}
    <div class="inat-cluster-title" style="font-style:italic">${esc(inatNav.speciesName)}</div>
    <div class="inat-cluster-sub">${leaves.length} sightings in this area</div>
    <div class="inat-obs-list" id="inat-obs-list">${cards}</div>
    ${hasMore ? `<button class="inat-load-more" id="inat-load-more" data-offset="${offset + INAT_OBS_PAGE}">Load more (${leaves.length - offset - INAT_OBS_PAGE} remaining)</button>` : ''}
  `;

  if (offset === 0) {
    document.getElementById('panel-content').innerHTML = content;
  } else {
    document.getElementById('inat-obs-list').insertAdjacentHTML('beforeend', cards);
    document.getElementById('inat-load-more')?.remove();
    if (hasMore) {
      document.getElementById('panel-scroll').insertAdjacentHTML('beforeend',
        `<button class="inat-load-more" id="inat-load-more" data-offset="${offset + INAT_OBS_PAGE}">Load more (${leaves.length - offset - INAT_OBS_PAGE} remaining)</button>`);
    }
  }

  // Wire events
  document.getElementById('inat-back-species')?.addEventListener('click', () => {
    renderInatSpeciesList(inatNav.clusterLeaves);
  });
  document.querySelectorAll('.inat-obs-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      inatNav.obsFeature = leaves[idx];
      openInatObsPanel(leaves[idx]);
    });
  });
  document.getElementById('inat-load-more')?.addEventListener('click', e => {
    const nextOffset = parseInt(e.target.dataset.offset);
    renderInatObsList(leaves, nextOffset);
  });
}

function obsCard(lf, idx = 0) {
  const p       = lf.properties;
  const hasPhoto = !!(p.flags & F_PHOTO);
  const photoEl  = hasPhoto && p.photo_id
    ? `<img class="inat-obs-thumb" src="${INAT_PHOTO_BASE}${p.photo_id}/square.jpeg" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="inat-obs-thumb-placeholder">🌿</div>`;
  const qBadge   = (p.flags & F_NEEDSID)
    ? `<span class="inat-badge inat-badge-nid">Needs ID</span>`
    : `<span class="inat-badge inat-badge-rg">Research</span>`;
  const obsBadge = (p.flags & F_OBSCURED) ? `<span class="inat-badge inat-badge-obs">Approx.</span>` : '';
  return `<div class="inat-obs-card" data-idx="${idx}">
    ${photoEl}
    <div class="inat-obs-meta">
      <div class="inat-obs-taxon">${esc(p.taxon_name)}</div>
      <div class="inat-obs-date">${p.date || '—'}</div>
      <div class="inat-obs-badges">${qBadge}${obsBadge}</div>
    </div>
  </div>`;
}

// ── Side panel — observation detail ──────────────────────

  inatNav.obsFeature = feature;
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  openSidePanelForInat();

  const p        = feature.properties;
  const hasPhoto = !!(p.flags & F_PHOTO);
  const obscured = !!(p.flags & F_OBSCURED);
  const qBadge   = (p.flags & F_NEEDSID)
    ? `<span class="inat-badge inat-badge-nid">Needs ID</span>`
    : `<span class="inat-badge inat-badge-rg">Research grade</span>`;
  const obsBadge = obscured ? `<span class="inat-badge inat-badge-obs">Location approx. (obscured)</span>` : '';

  const kv = p.koppen;
  let koppenBadge = '';
  if (kv >= 1 && kv <= 30) {
    const zone = BECK_ZONES[kv];
    const [r,g,b] = BECK_COLORS[kv];
    koppenBadge = `<span class="badge badge-koppen" style="color:rgb(${r},${g},${b});border-color:rgba(${r},${g},${b},0.3);background:rgba(${r},${g},${b},0.1)">${zone.code}</span>`;
  }

  const backBtn = inatNav.clusterLeaves
    ? `<button class="inat-panel-back" id="inat-back-obs">← ${inatNav.speciesName ? 'Sightings' : 'Species list'}</button>`
    : '';

  const coordStr = obscured
    ? `~${p.lat.toFixed(2)}, ${p.lng.toFixed(2)} (obscured)`
    : `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;

  document.getElementById('panel-content').innerHTML = `
    ${backBtn}
    <div class="p-species-name">${esc(p.taxon_name)}</div>
    ${p.common_name ? `<div class="p-common-name">${esc(p.common_name)}</div>` : ''}
    <div class="p-location">${coordStr}</div>
    <div class="badge-row" style="margin-top:8px">${qBadge}${obsBadge}${koppenBadge}</div>
    <a class="inat-view-link" href="${INAT_OBS_URL}${p.obs_id}" target="_blank" rel="noopener">View on iNaturalist →</a>

    ${hasPhoto ? `
    <details class="inat-section" open id="inat-sec-photos">
      <summary>📷 Photos</summary>
      <div class="inat-section-body">
        <div id="inat-photo-gallery" class="inat-detail-photo-gallery">
          <div class="inat-detail-photo-loading"></div>
        </div>
      </div>
    </details>` : ''}

    <details class="inat-section" open id="inat-sec-details">
      <summary>🌿 Sighting Details</summary>
      <div class="inat-section-body">
        <div id="inat-detail-body">
          <div class="inat-detail-photo-loading" style="height:40px;border-radius:4px;margin:4px 0 8px"></div>
        </div>
      </div>
    </details>

    <details class="inat-section" id="inat-sec-climate">
      <summary>🌡️ Climate Data${obscured ? ' (approx. location)' : ''}</summary>
      <div class="inat-section-body">
        <div id="inat-climate-body">
          <div class="climate-pending" style="padding:8px 0 4px">Expand to load climate data for this location</div>
        </div>
      </div>
    </details>
  `;

  document.getElementById('inat-back-obs')?.addEventListener('click', () => {
    if (climateChart) { climateChart.destroy(); climateChart = null; }
    if (lightChart)   { lightChart.destroy();   lightChart   = null; }
    if (inatNav.speciesName && inatNav.clusterLeaves) {
      renderInatObsList(inatNav.clusterLeaves.filter(lf => lf.properties.taxon_name === inatNav.speciesName));
    } else if (inatNav.clusterLeaves) {
      renderInatSpeciesList(inatNav.clusterLeaves);
    }
  });

  // Lazy-load climate data the first time that section is opened
  let climateLoaded = false;
  document.getElementById('inat-sec-climate')?.addEventListener('toggle', function () {
    if (this.open && !climateLoaded) {
      climateLoaded = true;
      loadInatClimateSection(p.lat, p.lng);
    }
  });

  const gen = ++inatDetailGen;
  fetchInatObsDetail(p.obs_id, gen);
}

async function fetchInatObsDetail(obsId, gen) {
  try {
    const res  = await fetch(`${INAT_API_OBS}${obsId}?`);
    if (!res.ok || gen !== inatDetailGen) return;
    const data = await res.json();
    if (gen !== inatDetailGen) return;   // navigated away while waiting for JSON parse
    const obs  = data.results?.[0];
    if (!obs) return;

    // Photos
    const gallery = document.getElementById('inat-photo-gallery');
    if (gallery && obs.photos?.length) {
      gallery.innerHTML = obs.photos.map(ph => {
        const src = ph.url?.replace('square', 'medium') || '';
        return `<img class="inat-detail-photo" src="${src}" loading="lazy" onerror="this.style.display='none'" title="${esc(ph.attribution || '')}">`;
      }).join('');
    } else if (gallery) {
      gallery.remove();
    }

    // Detail body
    const body = document.getElementById('inat-detail-body');
    if (!body) return;

    let html = '';

    // Observer
    if (obs.user?.login) {
      html += `<div class="inat-detail-label">Observer</div>
        <div style="font-size:12px;color:var(--text-primary);margin-bottom:10px">
          ${esc(obs.user.name || obs.user.login)}
          <span style="color:var(--text-muted)"> @${esc(obs.user.login)}</span>
        </div>`;
    }

    // Notes
    if (obs.description?.trim()) {
      html += `<div class="inat-detail-label">Notes</div>
        <div class="inat-detail-notes">${esc(obs.description)}</div>`;
    }

    // Identifications
    const ids = (obs.identifications || []).filter(id => id.current);
    if (ids.length) {
      html += `<div class="inat-detail-label">Identifications</div>
        <div style="margin-bottom:12px">${ids.map(id => `
          <div class="inat-detail-id-row">
            <div>
              <div class="inat-detail-id-taxon">${esc(id.taxon?.name || '—')}</div>
              <div class="inat-detail-id-user">@${esc(id.user?.login || '?')}${id.body ? ` · ${esc(id.body.slice(0, 80))}` : ''}</div>
            </div>
          </div>`).join('')}
        </div>`;
    }

    body.innerHTML = html;
  } catch (err) {
    if (gen !== inatDetailGen) return;
    const body = document.getElementById('inat-detail-body');
    if (body) body.innerHTML = '<div style="font-size:11px;color:var(--text-muted)">Could not load details</div>';
  }
}

// ── Inline climate section for obs detail ─────────────────

async function loadInatClimateSection(lat, lng) {
  const body = document.getElementById('inat-climate-body');
  if (!body) return;
  body.innerHTML = '<div class="climate-pending">Loading climate data…</div>';

  if (climateChart) { climateChart.destroy(); climateChart = null; }
  if (lightChart)   { lightChart.destroy();   lightChart   = null; }

  const [normals, rh] = await Promise.all([
    fetchSearchClimateNormals(lat, lng).catch(() => null),
    fetchRHNormals(lat, lng).catch(() => null),
  ]);

  const b = document.getElementById('inat-climate-body');
  if (!b) return; // navigated away

  if (!normals?.tempMax) {
    b.innerHTML = '<div class="climate-pending">Climate data unavailable for this location</div>';
    return;
  }
  if (rh) { normals.rhHigh = rh.rhHigh; normals.rhLow = rh.rhLow; normals.rhMean = rh.rhMean; }

  const validMax = normals.tempMax.filter(x => x != null);
  const validMin = normals.tempMin.filter(x => x != null);
  const peakHigh = validMax.length ? Math.max(...validMax) : null;
  const peakLow  = validMin.length ? Math.min(...validMin) : null;
  const annPrec  = Math.round(normals.precipMm.reduce((a, v) => a + (v || 0), 0));
  const validDLI = normals.dli ? normals.dli.filter(x => x != null) : [];
  const avgDLI   = validDLI.length ? validDLI.reduce((a, v) => a + v, 0) / validDLI.length : null;
  const validRH  = normals.rhMean ? normals.rhMean.filter(v => v != null) : [];
  const annRH    = validRH.length ? validRH.reduce((a, v) => a + v, 0) / validRH.length : null;

  b.innerHTML = `
    <div class="climate-grid" style="margin-top:4px">
      <div class="climate-stat"><div class="climate-stat-label">Avg High</div>
        <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div></div>
      <div class="climate-stat"><div class="climate-stat-label">Avg Low</div>
        <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div></div>
      <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
        <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
      ${avgDLI != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg DLI</div>
        <div class="climate-stat-value">${avgDLI.toFixed(1)}<span class="climate-stat-unit">mol/m²</span></div></div>` : ''}
      ${annRH != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg RH</div>
        <div class="climate-stat-value">${Math.round(annRH)}<span class="climate-stat-unit">%</span></div></div>` : ''}
    </div>
    <div class="section-label" style="margin-top:12px">Temperature &amp; Precipitation</div>
    <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
    ${buildClimateTable(normals)}
    ${normals.daylightHrs ? `
      <div class="section-divider"></div>
      <div class="section-label">Light &amp; Atmosphere</div>
      <div class="chart-wrap"><canvas id="light-chart"></canvas></div>
      ${buildLightTable(normals)}
    ` : ''}
  `;

  buildClimateChart(normals);
  if (normals.daylightHrs) buildLightChart(normals);
}

// ── Filter panel UI ───────────────────────────────────────

function buildInatFilterPanel() {
  const isMobile = window.innerWidth < 1024;

  // Genera checkboxes
  const genChecks = document.getElementById('inat-genera-checks');
  genChecks.innerHTML = INAT_GENERA.map(g => `
    <label class="inat-check-label">
      <input type="checkbox" class="inat-genus-cb" data-genus="${g}" ${!isMobile ? 'checked' : ''}>
      <span class="inat-genus-dot" style="background:${INAT_GENUS_COLORS[g]}"></span>
      ${g}
    </label>`).join('');

  // Koppen checkboxes (grouped + collapsible)
  const kopChecks = document.getElementById('inat-koppen-checks');
  kopChecks.innerHTML = INAT_KOPPEN_GROUPS.map(grp => `
    <div style="margin-bottom:6px">
      <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;letter-spacing:0.05em">${grp.label}</div>
      ${grp.zones.map(z => `
        <label class="inat-check-label" style="padding-left:8px">
          <input type="checkbox" class="inat-koppen-cb" data-kv="${z.v}" checked>
          ${z.c}
        </label>`).join('')}
    </div>`).join('');

  // Collapsible sections
  document.querySelectorAll('.inat-section-head').forEach(head => {
    head.addEventListener('click', () => {
      const target = document.getElementById(head.dataset.target);
      target.classList.toggle('hidden');
      head.classList.toggle('collapsed');
    });
  });

  // Genus checkboxes → filter + load data
  document.getElementById('inat-genera-all').addEventListener('click', () => {
    document.querySelectorAll('.inat-genus-cb').forEach(cb => { cb.checked = true; });
    applyInatFilters();
  });
  document.querySelectorAll('.inat-genus-cb').forEach(cb => {
    cb.addEventListener('change', applyInatFilters);
  });

  // Quality
  document.getElementById('inat-rg').addEventListener('change',  applyInatFilters);
  document.getElementById('inat-nid').addEventListener('change', applyInatFilters);

  // Köppen
  document.getElementById('inat-koppen-all').addEventListener('click', () => {
    document.querySelectorAll('.inat-koppen-cb').forEach(cb => { cb.checked = true; });
    applyInatFilters();
  });
  document.querySelectorAll('.inat-koppen-cb').forEach(cb => {
    cb.addEventListener('change', applyInatFilters);
  });

  // Visible toggle
  document.getElementById('inat-visible-toggle').addEventListener('change', e => {
    inatVisible = e.target.checked;
    if (inatVisible) {
      enableInatLayer();
    } else {
      disableInatLayer();
    }
  });
}

function applyInatFilters() {
  // Genera
  inatFilters.genera = new Set(
    [...document.querySelectorAll('.inat-genus-cb:checked')].map(cb => cb.dataset.genus)
  );
  // Quality
  inatFilters.needsId = document.getElementById('inat-nid').checked;
  // Koppen
  inatFilters.koppen  = new Set(
    [...document.querySelectorAll('.inat-koppen-cb:checked')].map(cb => parseInt(cb.dataset.kv))
  );

  if (!inatVisible) return;

  // On mobile: load needed genus files; on desktop: all.json already loaded
  if (window.innerWidth < 1024 && !inatAllLoaded) {
    Promise.all([...inatFilters.genera].filter(g => !inatLoadedGenera.has(g)).map(loadInatGenus))
      .then(() => rebuildInatIndex());
  } else {
    rebuildInatIndex();
  }
}

// ── Layer enable/disable ──────────────────────────────────

async function enableInatLayer() {
  if (!inatClusterGroup) {
    inatClusterGroup = L.layerGroup().addTo(map);
    inatRectGroup    = L.layerGroup().addTo(map);
  } else {
    if (!map.hasLayer(inatClusterGroup)) inatClusterGroup.addTo(map);
    if (!map.hasLayer(inatRectGroup))    inatRectGroup.addTo(map);
  }
  initInatWorker();

  const isMobile = window.innerWidth < 1024;
  if (!isMobile && !inatAllLoaded) {
    await loadInatAll();
  } else if (isMobile && !inatAllLoaded) {
    const toLoad = [...inatFilters.genera].filter(g => !inatLoadedGenera.has(g));
    if (toLoad.length) {
      await Promise.all(toLoad.map(loadInatGenus));
    } else {
      rebuildInatIndex();
    }
  } else {
    rebuildInatIndex();
  }

  map.on('moveend', renderInatClusters);
  map.on('zoomend', renderInatClusters);
}

function disableInatLayer() {
  if (inatClusterGroup) inatClusterGroup.clearLayers();
  if (inatRectGroup)    inatRectGroup.clearLayers();
  map.off('moveend', renderInatClusters);
  map.off('zoomend', renderInatClusters);
}

// ── Status helper ─────────────────────────────────────────

function setInatStatus(msg, loading = false) {
  const el  = document.getElementById('inat-status');
  const bar = document.getElementById('inat-loading-bar');
  if (msg) { el.textContent = msg; el.style.display = 'block'; } else { el.style.display = 'none'; }
  bar.style.display = loading ? 'block' : 'none';
}

// ── Desktop prefetch (3s after map loads) ─────────────────

function scheduleInatPrefetch() {
  if (window.innerWidth < 1024) return;
  setTimeout(() => {
    fetch(inatDataUrl('all'), { priority: 'low' }).catch(() => {}); // warm browser cache silently
  }, 3000);
}

// ═══════════════════════════════════════════════════════════

init();
</script>

</html>
