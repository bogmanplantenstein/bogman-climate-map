function toDisplay(celsius, unit) {
  if (celsius == null) return '—';
  return unit === 'F'
    ? Math.round(celsius * 9/5 + 32) + '°F'
    : Math.round(celsius) + '°C';
}

// Numeric-only conversion (no unit suffix) — for building ranges.
function toNum(celsius, unit) {
  return unit === 'F' ? Math.round(celsius * 9/5 + 32) : Math.round(celsius);
}

// "lo–hi°U" range, always rendered low→high regardless of input order.
function toDisplayRange(loC, hiC, unit) {
  if (loC == null || hiC == null) return '—';
  const a = toNum(loC, unit), b = toNum(hiC, unit);
  return `${Math.min(a, b)}–${Math.max(a, b)}°${unit}`;
}

function koppenGroup(code) {
  if (!code) return '?';
  const g = code[0];
  return ['A','B','C','D','E','H'].includes(g) ? g : '?';
}

function getElevBand(taxon) {
  return taxon.elevationBand || taxon.mapPin?.elevationBand || null;
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pinHtml(genus, precise, selected) {
  const color = genusColor(genus);

  const scale = selected ? 'transform:scale(1.45)' : '';
  return `<div style="transition:transform 0.15s;${scale}">
    <svg width="20" height="20" viewBox="0 0 20 20" style="display:block">
      <circle cx="10" cy="10" r="8" fill="${color}" stroke="white" stroke-width="2" ${dash} opacity="${op}"/>
    </svg>
  </div>`;
}

  const precise = !taxon.mapPin || taxon.mapPin.coordinatePrecision === 'exact';

    className: '',

    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -14]
  });
}

// ═══════════════════════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════════════════════

function updateKoppenBlur() {
  const pane = map.getPane('koppenPane');
  if (!pane) return;
  const z = map.getZoom();
  // 0.1° ≈ 11km resolution; meaningful through zoom ~8
  const blur    = z <= 9 ? 0 : z === 10 ? 1 : 2;
  const opacity = z <= 10 ? 1 : z === 11 ? 0.6 : z === 12 ? 0.25 : 0;
  pane.style.filter  = blur > 0 ? `blur(${blur}px)` : '';
  pane.style.opacity = opacity;
}

function initMap() {
  map = L.map('map', {
    center: [20, 10], zoom: 3,
    minZoom: 2, maxZoom: 16,
    zoomControl: false,
    worldCopyJump: true
  });

  map.createPane('koppenPane');
  map.getPane('koppenPane').style.zIndex = 250;
  map.on('zoomend', updateKoppenBlur);

  // georaster-layer occasionally drops async tile renders on zoom, leaving blank
  // bands — most visible fully zoomed out, where the missing tile repeats across
  // world copies. Force a repaint once the view settles to fill any gaps. On
  // pan (moveend) only bother at low zoom, where those world-copies appear, so
  // we don't needlessly repaint during normal use.
  const redrawKoppen = debounce(() => {
    if (koppenVisible && koppenLayer && typeof koppenLayer.redraw === 'function') koppenLayer.redraw();
  }, 200);
  map.on('zoomend', redrawKoppen);
  map.on('moveend', () => { if (map.getZoom() <= 4) redrawKoppen(); });

  // Re-render map tiles whenever the side panel finishes opening/closing.
  // Without this Leaflet leaves a blank strip where the panel was.
  document.getElementById('side-panel').addEventListener('transitionend', e => {
    if (e.propertyName === 'width') map.invalidateSize({ animate: false });
  });

  // Labels pane sits above the Köppen overlay so country names are always readable
  map.createPane('labelsPane');
  map.getPane('labelsPane').style.zIndex = 350;
  map.getPane('labelsPane').style.pointerEvents = 'none';

  darkTiles = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
    { attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>', subdomains: 'abcd', maxZoom: 20 }
  ).addTo(map);

  darkLabelsTiles = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',
    { pane: 'labelsPane', subdomains: 'abcd', maxZoom: 20 }
  ).addTo(map);

  satTiles = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: '© Esri, Maxar, Earthstar Geographics', maxZoom: 20 }
  );

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Close panel when clicking empty map
  map.on('click', e => {
    if (selectedId) { closePanel(); return; }
    if (searchPanelOpen) { closeLocationPanel(); return; }
    // Priority order: soil popup takes precedence when its layer is active so
    // clicks on the soil overlay surface point-specific values; otherwise fall
    // back to the Köppen popup if that overlay is visible.
    if (activeSoilLayer)                showSoilPopup(e.latlng);
    else if (koppenVisible && koppenGeoRaster) showKoppenPopup(e.latlng);
  });
}

// ═══════════════════════════════════════════════════════════
//  MAP CONTROLS (tile toggle, Köppen toggle)

function buildMapControls() {

    options: { position: 'topright' },

      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => {
        satelliteActive = !satelliteActive;
        if (satelliteActive) {
          map.removeLayer(darkTiles); map.removeLayer(darkLabelsTiles); satTiles.addTo(map);
          if (koppenLayer) koppenLayer.setOpacity(0.35);

  // Köppen toggle
  const KoppenCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {

      });

    }

  const LEGEND_GROUPS = [
    { label: 'Tropical (A)', zones: [
      [1,'Af','Rainforest'],[2,'Am','Monsoon'],[3,'Aw','Savannah']
    ]},
    { label: 'Arid (B)', zones: [
      [4,'BWh','Hot Desert'],[5,'BWk','Cold Desert'],
      [6,'BSh','Hot Steppe'],[7,'BSk','Cold Steppe']
    ]},
    { label: 'Temperate (C)', zones: [
      [8,'Csa','Med. Hot Summer'],[9,'Csb','Med. Warm Summer'],[10,'Csc','Med. Cold Summer'],
      [11,'Cwa','Dry Winter, Hot'],[12,'Cwb','Dry Winter, Warm'],[13,'Cwc','Dry Winter, Cold'],
      [14,'Cfa','Humid Subtropical'],[15,'Cfb','Oceanic'],[16,'Cfc','Subpolar Oceanic']
    ]},
    { label: 'Cold (D)', zones: [
      [17,'Dsa','Dry Summer, Hot'],[18,'Dsb','Dry Summer, Warm'],
      [19,'Dsc','Dry Summer, Cold'],[20,'Dsd','Dry Summer, Very Cold'],
      [21,'Dwa','Dry Winter, Hot'],[22,'Dwb','Dry Winter, Warm'],
      [23,'Dwc','Dry Winter, Cold'],[24,'Dwd','Dry Winter, Very Cold'],
      [25,'Dfa','No Dry Season, Hot'],[26,'Dfb','No Dry Season, Warm'],
      [27,'Dfc','Subarctic'],[28,'Dfd','Very Cold Subarctic']

  const LegendCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {

      btn.innerHTML = `<span class="map-btn-icon">${BMG_ICONS.grid}</span>`;
      const panel = L.DomUtil.create('div', 'koppen-legend-panel', wrap);

      // Re-renderable: the legend's contents depend on selectedKoppenCodes
      // so applyLegendFilters needs to redraw rows + clear button when the
      // filter set changes. Exposed via window._bmgKoppenLegendRender.
      function render() {
        const filterActive = selectedKoppenCodes.size > 0;
        let html = filterActive
          ? `<button class="legend-clear-btn" id="koppen-legend-clear">Clear filter (${selectedKoppenCodes.size}) ×</button>`
          : '';
        for (const group of LEGEND_GROUPS) {
          html += `<div class="legend-group-label">${group.label}</div>`;
          for (const [idx, code, desc] of group.zones) {
            const [r,g,b] = BECK_COLORS[idx];
            const sel = selectedKoppenCodes.has(idx);
            html += `<div class="legend-row${sel ? ' selected' : ''}" data-koppen-code="${idx}" title="${desc.replace(/"/g, '&quot;')} — click to filter by this zone"><span class="legend-swatch" style="background:rgb(${r},${g},${b})"></span><span class="legend-code">${code}</span><span class="legend-desc">${desc}</span></div>`;
          }

        panel.innerHTML = html;
        panel.classList.toggle('has-filter', filterActive);
        // Re-attach handlers (innerHTML wipes previous bindings)
        panel.querySelector('#koppen-legend-clear')?.addEventListener('click', (e) => {
          e.stopPropagation();
          clearKoppenFilter();
        });
      }
      render();
      window._bmgKoppenLegendRender = render;

      // Single delegated click handler on the panel — handles row clicks
      // regardless of how many times render() rewrites the innerHTML.
      L.DomEvent.disableClickPropagation(panel);
      panel.addEventListener('click', (e) => {
        const row = e.target.closest('.legend-row');

      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => {
        const open = panel.classList.toggle('open');

  // Soil layer control
  const SoilCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const wrap  = L.DomUtil.create('div', 'soil-layer-wrap');
      const btn   = L.DomUtil.create('button', 'map-btn', wrap);

      const panel = L.DomUtil.create('div', 'soil-layer-panel', wrap);

      const options = [
        ['none',     'Off',             ''],
        ['wrb',      'Soil Type (WRB)', 'Classification'],
        ['phh2o',    'pH',              'Acidity / alkalinity'],
        ['soc',      'Organic Carbon',  'Peat & organic matter'],
        ['nitrogen', 'Nitrogen',        'Total soil nitrogen'],
        ['sand',     'Sand Content',    'Texture & drainage'],

        `<div class="soil-panel-title">Soil Layer</div>` +
        options.map(([val, label, sub]) =>
          `<label class="soil-radio-row">
            <input type="radio" name="soil-layer" value="${val}"${val === 'none' ? ' checked' : ''}>
            <div>
              <div class="soil-radio-label">${label}</div>
              ${sub ? `<div class="soil-radio-sub">${sub}</div>` : ''}

          </label>`
        ).join('');

      // Keep button highlight in sync with both panel-open and active-layer states
      const syncBtn = () => btn.classList.toggle('active', panel.classList.contains('open') || activeSoilLayer != null);

      panel.querySelectorAll('input[type=radio]').forEach(radio => {
        radio.addEventListener('change', () => {
          if (radio.checked) {
            setSoilLayer(radio.value === 'none' ? null : radio.value);

      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => {
        panel.classList.toggle('open');
        syncBtn();

        document.querySelector('.koppen-legend-panel')?.classList.remove('open');
        document.querySelector('.koppen-legend-wrap .map-btn')?.classList.remove('active');
      });

      // Dismiss panel on map click
      map.on('click', () => { panel.classList.remove('open'); syncBtn(); });
      L.DomEvent.disableClickPropagation(wrap);
      return wrap;

  });

  // Helper: close every "sightings" panel except the one whose ID is passed

  // exclusion between the iNat, filter, and unmapped panels — only one is
  // open at a time so they don't visually compete for the same slot at
  // right: 54px.
  const SIGHTINGS_PANELS = [
    { panel: 'inat-panel',     toggle: 'inat-toggle'     },
    { panel: 'filter-panel',   toggle: 'filter-toggle'   },
    { panel: 'unmapped-panel', toggle: 'unmapped-toggle' },

  function closeOtherSightingsPanels(exceptPanelId) {
    for (const { panel, toggle } of SIGHTINGS_PANELS) {

  const InatCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {

      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => {

  // Soil-key toggle (companion to LegendCtrl for the Köppen key). Toggles

  const SoilLegendCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const btn = L.DomUtil.create('button', 'map-btn');
      btn.id        = 'soil-legend-toggle';
      btn.title     = 'Soil colour key';
      btn.innerHTML = `<span class="map-btn-icon">${BMG_ICONS.palette}</span>`;
      const syncBtn = () => {
        const enabled = activeSoilLayer != null;
        btn.classList.toggle('disabled', !enabled);
        btn.classList.toggle('active', enabled && soilLegendVisible);
        btn.title = enabled
          ? (soilLegendVisible ? 'Hide soil colour key' : 'Show soil colour key')
          : 'Soil colour key (enable a soil layer first)';
      };
      // Expose so setSoilLayer can refresh state when layer changes.
      window._bmgSoilLegendBtnSync = syncBtn;
      syncBtn();
      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => {
        if (activeSoilLayer == null) return;   // no-op when disabled
        soilLegendVisible = !soilLegendVisible;
        try { localStorage.setItem('bmg_soil_legend_hidden', soilLegendVisible ? '0' : '1'); } catch {}
        updateSoilLegend(activeSoilLayer);
        syncBtn();
      });

    }

  // The gallery-pin toggle (GalleryCtrl), gallery filter panel (FilterCtrl) and
  // unmapped-taxa toggle (UnmappedCtrl) were removed when the climate map was
  // decoupled from the Bogman gallery. The map no longer renders curated gallery

  // Info / about toggle — opens the data-sources & methodology dialog from the
  // top-right toolbar. Mirrors the bottom-right floating "i" button, but stays
  // accessible when the side panel is open (which can cover the corner one).
  const InfoCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const btn = L.DomUtil.create('button', 'map-btn');
      btn.id        = 'info-toggle';
      btn.title     = 'About this map · data sources';
      btn.innerHTML = `<span class="map-btn-icon">${BMG_ICONS.info}</span>`;
      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => bmgOpenInfo());

    }
  });

  // Guided-tour launcher — sits under the About button. Lazily loads the
  // isolated tutorial scripts (tutorial/*.js) on first click, then opens the
  // walkthrough picker. Everything is guarded: if the tour fails to load, the
  // map is entirely unaffected (this button is the only thing that references it).
  const HelpCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const btn = L.DomUtil.create('button', 'map-btn');
      btn.id        = 'tour-toggle';
      btn.title     = 'Guided tour · how to use this map';
      btn.innerHTML = `<span class="map-btn-icon">${BMG_ICONS.help}</span>`;
      L.DomEvent.on(btn, 'click', L.DomEvent.stop);
      L.DomEvent.on(btn, 'click', () => bmgOpenTour());
      return btn;
    }
  });

  // Small uppercase label control used to introduce each functional group of
  // buttons in the top-right stack ("LAYER" / "KEYS" / "SPECIES"). Replaces
  // the previous invisible SpacerCtrl with explicit labels so users can see
  // what each group is for. Inserted as Leaflet controls so they nest into
  // the same .leaflet-top.leaflet-right flow as the buttons.
  function makeLabelCtrl(text) {
    return L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const el = L.DomUtil.create('div', 'leaflet-control-group-label');
        el.textContent = text;
        return el;
      }

  // Top-right control stack, grouped + labelled:
  //   [LAYER]   basemap, Köppen overlay, Soil layer
  //   [KEYS]    Köppen colour key, Soil colour key
  //   [SPECIES] iNat panel
  //   [ABOUT]   data sources / methodology dialog
  // Within each group, controls are ordered by frequency of use.
  new (makeLabelCtrl('Layer'))().addTo(map);
  new TileCtrl().addTo(map);
  new KoppenCtrl().addTo(map);
  new SoilCtrl().addTo(map);

  new (makeLabelCtrl('Keys'))().addTo(map);
  new LegendCtrl().addTo(map);
  new SoilLegendCtrl().addTo(map);

  new (makeLabelCtrl('Species'))().addTo(map);
  new InatCtrl().addTo(map);

  new (makeLabelCtrl('About'))().addTo(map);
  new InfoCtrl().addTo(map);
  new HelpCtrl().addTo(map);
}

// Guided-tour loader. Isolated from the map: the tutorial lives in tutorial/*.js
// and is only fetched when the user clicks the "?" control. Failures are
// swallowed so a broken/absent tour never affects the map itself.
function bmgOpenTour() {
  if (window.BMG_TOUR) { window.BMG_TOUR.openPicker(); return; }
  const add = src => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  add('tutorial/tour-content.js')
    .then(() => add('tutorial/tour.js'))
    .then(() => { if (window.BMG_TOUR) window.BMG_TOUR.openPicker(); })
    .catch(err => console.error('Guided tour failed to load:', err));
}

// ═══════════════════════════════════════════════════════════
//  KÖPPEN OVERLAY
// ═══════════════════════════════════════════════════════════

function koppenCodeFromProps(props) {
  return props.CODE || props.code || props.Cls || props.GRIDCODE || props.Koppen || null;
}

// Hoisted so applyLegendFilters can pass it to koppenLayer.updateColors()
// after the selectedKoppenCodes set changes. Closes over the live set so a
// single function reference reflects current filter state on each evaluation.
//
// When a filter is active, non-selected zones return a UNIFORM dim grey
// (not their own dimmed colour) — this avoids visible tile-edge artifacts
// from per-pixel rgba blending and prevents the original Köppen colours
// from clashing visually with the selected ones. Selected zones render in
// full saturation so they stand out clearly against the dim background.
function koppenColorFn(values) {
  const v = values[0];
  if (!v || v < 1 || v > 30) return null;
  const c = BECK_COLORS[v];
  if (!c) return null;
  if (selectedKoppenCodes.size === 0 || selectedKoppenCodes.has(v)) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  // Uniform dark grey for ALL non-selected zones. Matches the dark basemap
  // tone so non-selected areas read as "muted background" without colour
  // information that could distract from the selection.
  return 'rgb(38,42,48)';
}

async function loadKoppen() {
  const PATH_01 = './koppen_geiger_tif/1991_2020/koppen_geiger_0p1.tif';
  try {
    const buf = await fetch(PATH_01).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
    if (!buf) return;
    koppenGeoRaster = await parseGeoraster(buf);
    koppenLayer = new GeoRasterLayer({
      georaster: koppenGeoRaster, pane: 'koppenPane',
      opacity: satelliteActive ? 0.35 : 0.55,
      resolution: 64, pixelValuesToColorFn: koppenColorFn,
      // Reduce the tile churn that makes georaster-layer drop async renders:
      // don't add tiles mid zoom-animation, and only refresh after motion stops.
      // Combined with the zoomend/moveend redraw, this fills the blank squares.
      updateWhenZooming: false, updateWhenIdle: true
    });
    if (koppenVisible) koppenLayer.addTo(map);
    updateKoppenBlur();
  } catch { /* overlay unavailable */ }
}

// ═══════════════════════════════════════════════════════════
//  SOIL LAYER — WMS + LEGEND + POINT DATA
// ═══════════════════════════════════════════════════════════

function setSoilLayer(key) {
  // Remove current active WMS layer from map
  if (activeSoilLayer && soilWmsCache[activeSoilLayer]) {
    map.removeLayer(soilWmsCache[activeSoilLayer]);
  }
  activeSoilLayer = key;
  if (!key) {
    updateSoilLegend(null);
    window._bmgSoilLegendBtnSync?.();   // disables Soil-key button
    return;
  }

  const def = SOIL_LAYERS[key];
  // Build lazily — only create the WMS layer object once per key
  if (!soilWmsCache[key]) {
    soilWmsCache[key] = L.tileLayer.wms(
      `https://maps.isric.org/mapserv?map=/map/${def.wmsMap}.map`,
      {
        layers:      def.wmsLayer,
        format:      'image/png',
        transparent: true,
        version:     '1.1.1',
        opacity:     0.65,
        attribution: 'Soil: <a href="https://www.isric.org" target="_blank">ISRIC SoilGrids</a>',
        zIndex:      300,
      }
    );
  }
  soilWmsCache[key].addTo(map);
  // Respect any active WRB legend filter. WMS tiles are server-rendered so
  soilWmsCache[key].setOpacity(0.65);
  updateSoilLegend(key);
  // Refresh Soil-key button enabled/active state to reflect the new layer.
  window._bmgSoilLegendBtnSync?.();
}

function updateSoilLegend(key) {
  const el = document.getElementById('soil-legend');
  if (!el) return;
  // Hide if no layer is active OR the user has explicitly toggled the legend
  // off via the Soil-key button in the top-right Keys group.
  if (!key || !SOIL_LAYERS[key] || !soilLegendVisible) {
    el.classList.remove('visible', 'wrb-mode');
    el.innerHTML = '';
    return;
  }

  const def = SOIL_LAYERS[key];

  if (def.legend === 'gradient') {
    // Gradient legends (pH, SOC, nitrogen, sand) — same compact strip as before
    el.classList.remove('wrb-mode');
    el.innerHTML =
      `<div class="soil-legend-title">${def.label}</div>` +
      `<div class="soil-legend-gradient" style="background:${def.gradCss}"></div>` +
      `<div class="soil-legend-labels"><span>${def.gradMin}</span><span>${def.gradMax}</span></div>` +
      `<span class="soil-legend-src">SoilGrids 250m · ISRIC</span>`;
    el.classList.add('visible');
    return;
  }

  // WRB categorical — collapsible 2-column grid of swatches using ISRIC's
  // official WMS palette (extracted from the GetLegendGraphic image, see
  // WRB_GROUPS), so legend swatches match the rendered overlay tiles. This
  // is a static reference key — clicks on items are intentionally a no-op
  // (per-class WMS masking isn't possible; click-to-filter was removed).
  const wrbExpanded = (() => {
    try { return localStorage.getItem('bmg_wrb_legend_collapsed') !== '1'; }
    catch { return true; }
  })();

  const items = Object.entries(WRB_GROUPS)
    .sort(([, a], [, b]) => a.name.localeCompare(b.name))
    .map(([code, g]) => `
      <div class="wrb-legend-item" title="${g.desc.replace(/"/g, '&quot;')}">
        <span class="wrb-swatch" style="background:${g.color}"></span>
        <span class="wrb-name">${g.name}</span>
      </div>`).join('');

  el.classList.add('wrb-mode');
  el.innerHTML =
    `<details class="wrb-legend-details"${wrbExpanded ? ' open' : ''}>
       <summary>
         <span class="wrb-legend-title">${def.label}</span>
         <span class="wrb-legend-chevron">▾</span>
       </summary>
       <div class="wrb-legend-grid">${items}</div>
       <span class="soil-legend-src">SoilGrids 250m · ISRIC · 30 reference soil groups</span>
     </details>`;
  el.classList.add('visible');

  // Persist collapse state across sessions
  el.querySelector('.wrb-legend-details')?.addEventListener('toggle', (e) => {
    try { localStorage.setItem('bmg_wrb_legend_collapsed', e.target.open ? '0' : '1'); } catch {}
  });
}

// ── SoilGrids REST API (point query) ─────────────────────
// Uses two separate endpoints:
//   /properties/query  — continuous properties (pH, SOC, nitrogen)
//   /classification/query — WRB soil group (categorical, own endpoint)
// Mixing &property=wrb into the properties request causes HTTP 500.

async function fetchSoilData(lat, lng) {
  // 15s timeout so a slow/stalled SoilGrids endpoint doesn't leave the popup
  // showing "Loading…" indefinitely. AbortController aborts both requests.
  const ctrl = new AbortController();
  const timeoutId = setTimeout(() => ctrl.abort(), 15000);
  try {
    const coord = `lon=${lng.toFixed(4)}&lat=${lat.toFixed(4)}`;
    const [propsRes, classRes] = await Promise.all([
      fetch(`https://rest.isric.org/soilgrids/v2.0/properties/query?${coord}` +
            `&property=phh2o&property=soc&property=nitrogen&property=sand&depth=0-5cm&value=mean`, { signal: ctrl.signal }),
      fetch(`https://rest.isric.org/soilgrids/v2.0/classification/query?${coord}&number_classes=1`, { signal: ctrl.signal }),
    ]);

    // Parse continuous properties
    let ph = null, soc = null, nitrogen = null, sand = null;
    if (propsRes.ok) {
      const json   = await propsRes.json();
      const layers = json?.properties?.layers;
      if (Array.isArray(layers)) {
        const parse = name => {
          const layer = layers.find(l => l.name === name);
          if (!layer) return null;
          const raw = layer.depths?.[0]?.values?.mean;
          if (raw == null) return null;
          const d = layer.unit_measure?.d_factor ?? 1;
          return d > 0 ? raw / d : raw;
        };
        ph       = parse('phh2o');
        soc      = parse('soc');
        nitrogen = parse('nitrogen');
        sand     = parse('sand');
      }
    }

    // Parse WRB classification — response is a flat object with wrb_class_name at top level.
    // wrb_class_value is a 0-based index; we use wrb_class_name → WRB_NAME_TO_CODE instead
    // so the result matches our 1-based WRB_GROUPS keys.
    let wrb = null;
    if (classRes.ok) {
      const json = await classRes.json();
      const name = json?.wrb_class_name ?? null;
      if (name) wrb = WRB_NAME_TO_CODE[name] ?? null;
    }

    if (ph == null && soc == null && nitrogen == null && sand == null && wrb == null) return null;
    return { wrb, ph, soc, nitrogen, sand };
  } catch { return null; }
  finally { clearTimeout(timeoutId); }
}

function renderSoilBody(data) {
  if (!data) {
    return `<div class="soil-loading">Soil data unavailable for this location.</div>`;
  }

  const wrb = data.wrb != null ? WRB_GROUPS[data.wrb] : null;

  const typeHtml = wrb
    ? `<div class="soil-type-row">
         <span class="soil-type-swatch" style="background:${wrb.color}"></span>
         <div>
           <div class="soil-type-name">${wrb.name}</div>
           <div class="soil-type-desc">${wrb.desc}</div>
         </div>
       </div>`
    : '';

  const ph   = data.ph       != null ? data.ph.toFixed(1)                  : null;
  const soc  = data.soc      != null ? Math.round(data.soc)                : null;
  const nit  = data.nitrogen != null ? data.nitrogen.toFixed(1)            : null;
  // Sand is stored in g/kg (0–1000); divide by 10 to display as percentage.
  const sand = data.sand     != null ? Math.round(data.sand / 10)          : null;

  const cards = [
    ph   != null ? { label: 'pH',          value: ph,   unit: ''  } : null,
    soc  != null ? { label: 'Org. Carbon', value: soc,  unit: 'g/kg' } : null,
    nit  != null ? { label: 'Nitrogen',    value: nit,  unit: 'g/kg' } : null,
    sand != null ? { label: 'Sand',        value: sand, unit: '%' } : null,
  ].filter(Boolean);

  const propsHtml = cards.length
    ? `<div class="soil-props-grid">` +
        cards.map(c =>
          `<div class="soil-prop-card">
             <div class="soil-prop-label">${c.label}</div>
             <div class="soil-prop-value">${c.value}<span class="soil-prop-unit">${c.unit ? ' ' + c.unit : ''}</span></div>
           </div>`
        ).join('') +
      `</div>`
    : '';

  return typeHtml + propsHtml +
    `<div class="soil-data-note">SoilGrids 250 m (ISRIC), surface 0–5 cm.</div>`;
}

// ── Soil precomputed data helpers ─────────────────────────────────────────────

function getGridKey(lat, lng) {
  return `${Math.floor(lat / 0.5)}:${Math.floor(lng / 0.5)}`;
}

function lsSoilGet(key) {
  // Returns undefined (never stored), null (cached no-data), or object (valid data)
  const raw = lsGet('bmg_soil_' + key);
  if (raw === null) return undefined;       // not in storage
  if (raw === 'null') return null;           // cached ocean / no-data
  try { return JSON.parse(raw); } catch { return undefined; }
}

function lsSoilSet(key, data) {
  lsSet('bmg_soil_' + key, data === null ? 'null' : JSON.stringify(data));
}

function loadSoilCache() {
  if (!soilCachePromise) {
    soilCachePromise = fetch('./inat/soil-cache.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(d => {
        // Strip internal metadata key before storing — cell keys are "row:col" format
        const { _v: _ignored, ...cells } = d;
        soilCacheData = cells;
        return cells;
      })
      .catch(err => {
        console.warn('soil-cache.json not yet available:', err.message);
        soilCachePromise = null;  // allow retry on next call
        return null;
      });
  }
  return soilCachePromise;
}

function loadSpeciesSoilData() {
  if (!speciesSoilPromise) {
    speciesSoilPromise = fetch('./inat/species-soil.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(d => { speciesSoilData = d.species; return d.species; })
      .catch(err => {
        console.warn('species-soil.json not yet available:', err.message);
        speciesSoilPromise = null;  // allow retry on next call
        return null;
      });
  }
  return speciesSoilPromise;
}

// Lookup chain: precomputed grid → localStorage → precomputed fetch → live API + cache
async function getSoilForLocation(lat, lng) {
  const key = getGridKey(lat, lng);

  // 1. Already-loaded precomputed cache (fastest — in-memory)
  if (soilCacheData && key in soilCacheData) return soilCacheData[key];

  // 2. localStorage (cells fetched live in previous sessions)
  const cached = lsSoilGet(key);
  if (cached !== undefined) return cached;

  // 3. Try to load the precomputed cache file (may already be in-flight)
  const cache = await loadSoilCache();
  if (cache && key in cache) return cache[key];

  // 4. Live API fallback for locations outside the precomputed grid
  const data = await fetchSoilData(lat, lng);
  lsSoilSet(key, data);
  return data;
}

// Display precomputed species-level soil summary
function renderSpeciesSoilBody(entry) {
  // entry: { wrb: [{code, pct}, ...], ph, soc, nitrogen, sand, cells }
  let html = '';

  if (entry.wrb && entry.wrb.length) {
    html += entry.wrb.slice(0, 3).map(w => {
      const grp = WRB_GROUPS[w.code];
      if (!grp) return '';
      const pct = Math.round(w.pct * 100);
      return `<div class="soil-type-row">
        <span class="soil-type-swatch" style="background:${grp.color}"></span>
        <div>
          <div class="soil-type-name">${esc(grp.name)}<span style="opacity:.55;font-size:.85em;margin-left:5px">${pct}%</span></div>
          <div class="soil-type-desc">${esc(grp.desc)}</div>
        </div>
      </div>`;
    }).join('');
  }

  const ph   = entry.ph       != null ? entry.ph.toFixed(1)              : null;
  const soc  = entry.soc      != null ? Math.round(entry.soc)            : null;
  const nit  = entry.nitrogen != null ? entry.nitrogen.toFixed(1)        : null;
  const sand = entry.sand     != null ? Math.round(entry.sand / 10)      : null;

  const cards = [
    ph   != null ? { label: 'pH',          value: ph,   unit: ''  } : null,
    soc  != null ? { label: 'Org. Carbon', value: soc,  unit: 'g/kg' } : null,
    nit  != null ? { label: 'Nitrogen',    value: nit,  unit: 'g/kg' } : null,
    sand != null ? { label: 'Sand',        value: sand, unit: '%' } : null,
  ].filter(Boolean);

  if (cards.length) {
    html += `<div class="soil-props-grid">` +
      cards.map(c =>
        `<div class="soil-prop-card">
           <div class="soil-prop-label">${c.label}</div>
           <div class="soil-prop-value">${c.value}<span class="soil-prop-unit">${c.unit ? ' ' + c.unit : ''}</span></div>
         </div>`
      ).join('') +
      `</div>`;
  }

  html += `<div class="soil-data-note">Median across species range. SoilGrids 250 m (ISRIC), surface 0–5 cm.</div>`;
  return html || `<div class="soil-loading">No soil data available for this species.</div>`;
}

// Called after panel innerHTML is set; updates #soil-section-body when data arrives.
async function loadAndRenderSoilSection(lat, lng) {
  const myToken = ++soilFetchToken;
  const data    = await getSoilForLocation(lat, lng);
  // Bail if a newer request superseded this one, or the section was removed
  if (soilFetchToken !== myToken) return;
  const body = document.getElementById('soil-section-body');
  if (!body) return;
  body.innerHTML = renderSoilBody(data);
}

// For the species sidebar — uses precomputed species-soil.json when available,
// falls back to centroid of loaded observations.
async function loadSpeciesSoilSection(taxonId, taxonName) {
  const body = document.getElementById('soil-section-body');
  if (!body) return;

  const myToken = soilFetchToken;  // capture before any awaits

  // 1. Try precomputed species-soil.json (fast, pre-loaded)
  const speciesSoil = await loadSpeciesSoilData();
  if (soilFetchToken !== myToken || !body.isConnected) return;

  if (speciesSoil && speciesSoil[taxonId]) {
    body.innerHTML = renderSpeciesSoilBody(speciesSoil[taxonId]);
    return;
  }

  // 2. Centroid fallback using observation points (requires iNat layer loaded)
  const pts = [];
  for (const o of inatObs) {
    if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) pts.push([o[OBS_LAT], o[OBS_LNG]]);
  }

  if (!pts.length) {
    body.innerHTML = `<div class="soil-loading">Enable iNaturalist layer to load soil data.</div>`;
    return;
  }

  // Centroid of all observation points
  const lat = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const lng = pts.reduce((s, p) => s + p[1], 0) / pts.length;

  // Reuse the token-guarded loader — species panel rebuilds on each navigation
  await loadAndRenderSoilSection(lat, lng);
}

// Decide if a species lives "in the tropics" — used to hide the seasonal-shift
// toggle, since equatorial species have weak seasons and shifting by 6 months
// produces a near-identical chart. Definition: median |latitude| < 23.5°
// (Tropic of Cancer / Capricorn). Result is cached per taxon name for the
// session. Falls back to FALSE (show the toggle) if obs data isn't loaded yet.
function isSpeciesTropical(taxonName) {
  if (speciesTropicalCache.has(taxonName)) return speciesTropicalCache.get(taxonName);
  if (!inatObs.length || !inatTaxa.length) return false;
  const absLats = [];
  for (const o of inatObs) {
    if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) {
      absLats.push(Math.abs(o[OBS_LAT]));
    }
  }
  if (!absLats.length) {
    // No obs found — don't cache, so a later load can re-evaluate
    return false;
  }
  absLats.sort((a, b) => a - b);
  const median = absLats[Math.floor(absLats.length / 2)];
  const tropical = median < 23.5;
  speciesTropicalCache.set(taxonName, tropical);
  return tropical;
}

function buildSoilSectionHtml(autoOpen = false) {
  return `<details class="inat-section" style="margin-top:8px"${autoOpen ? ' open' : ''}>
    <summary><span class="bmg-section-icon">${BMG_ICONS.layers}</span>Soil Data</summary>
    <div class="inat-section-body" id="soil-section-body">
      <div class="soil-loading">Loading soil data…</div>
    </div>
  </details>`;
}

function getKoppenAt(lat, lng) {
  const g = koppenGeoRaster;
  if (!g || !g.values || !g.values[0]) return 0;
  const col = Math.floor((lng - g.xmin) / g.pixelWidth);
  const row = Math.floor((g.ymax - lat) / g.pixelHeight);
  if (row < 0 || row >= g.height || col < 0 || col >= g.width) return 0;
  return g.values[0][row][col];
}

function showKoppenPopup(latlng) {
  const v = getKoppenAt(latlng.lat, latlng.lng);
  if (!v || v < 1 || v > 30) return;
  const zone = BECK_ZONES[v];
  const [r, g, b] = BECK_COLORS[v];
  L.popup({ maxWidth: 240 })
    .setLatLng(latlng)
    .setContent(
      `<div class="kp-popup">` +
      `<div class="kp-popup-head"><span class="kp-swatch" style="background:rgb(${r},${g},${b})"></span><span class="kp-code">${zone.code}</span></div>` +
      `<div class="kp-desc">${zone.desc}</div>` +
      `<div class="kp-group">${zone.group}</div>` +
      `<button class="kp-climate-btn" onclick="openClimateAt(${latlng.lat},${latlng.lng})">↓ Load climate data</button>` +
      `</div>`
    )
    .openOn(map);
}

// In-session cache for exact-point soil queries used by the on-click popup.
// Keyed by lat/lng rounded to ~100m so repeat clicks on the same area are
// instant. NOT persisted (clears on reload) — different from the 0.5° grid
// cache in soilCacheData / lsSoilGet which is for broad-area lookups.
// IMPORTANT: only cache successful responses. Caching a null/failed fetch
// would prevent the user from ever getting data for that spot in this
// session (e.g. transient SoilGrids API hiccup → permanent "unavailable"
// until reload). Failed fetches return null but don't poison the cache.
const popupSoilCache = new Map();
async function fetchExactPointSoil(lat, lng) {
  const k = `${lat.toFixed(3)}:${lng.toFixed(3)}`;
  if (popupSoilCache.has(k)) return popupSoilCache.get(k);
  const data = await fetchSoilData(lat, lng);
  if (data) popupSoilCache.set(k, data);
  return data;
}

// On-click soil popup. Calls SoilGrids LIVE for the exact click coordinates
// rather than using getSoilForLocation (which would return data for the
// representative point of the surrounding 0.5° grid cell — that point can be
// tens of km away from the click and in a different soil region). Costs ~1s
// per fresh click (cached in popupSoilCache for repeat clicks).
//
// Includes the WRB classification + all four continuous properties (pH, SOC,
// nitrogen, sand) in one popup.
async function showSoilPopup(latlng) {
  const popup = L.popup({ maxWidth: 300 })
    .setLatLng(latlng)
    .setContent('<div class="soil-popup loading">Loading soil data…</div>')
    .openOn(map);

  const data = await fetchExactPointSoil(latlng.lat, latlng.lng);
  // Bail if user closed the popup mid-fetch (Leaflet replaces popup on each open)
  if (!popup.isOpen()) return;

  if (!data) {
    // null can mean ocean/glacier (genuine no-data) OR a transient network
    // failure. We don't cache nulls (so retries work) and the message
    // acknowledges both possibilities without being alarming.
    popup.setContent('<div class="soil-popup">No soil data returned for this point. If this is over land, click again to retry — the SoilGrids server may have been slow.</div>');
    return;
  }

  const wrb = data.wrb != null && data.wrb > 0 ? WRB_GROUPS[data.wrb] : null;
  const headHtml = wrb
    ? `<div class="kp-popup-head">
         <span class="kp-swatch" style="background:${wrb.color}"></span>
         <span class="kp-code" style="font-size:14px">${wrb.name}</span>
       </div>
       <div class="kp-desc">${wrb.desc}</div>`
    : `<div class="kp-group" style="margin-bottom:6px">Continuous properties only</div>`;

  // Continuous properties — show only those present. Sand is stored as g/kg
  // (0-1000) per SoilGrids convention; divide by 10 to display as percent.
  const props = [];
  if (data.ph       != null) props.push({ label: 'pH',       value: data.ph.toFixed(1),                unit: '' });
  if (data.soc      != null) props.push({ label: 'Org. C',   value: Math.round(data.soc),              unit: 'g/kg' });
  if (data.nitrogen != null) props.push({ label: 'Nitrogen', value: data.nitrogen.toFixed(1),          unit: 'g/kg' });
  if (data.sand     != null) props.push({ label: 'Sand',     value: Math.round(data.sand / 10),        unit: '%' });

  const propsHtml = props.length
    ? `<div class="soil-popup-props">${props.map(p => `
        <div class="soil-popup-prop">
          <div class="soil-popup-prop-label">${p.label}</div>
          <div class="soil-popup-prop-value">${p.value}${p.unit ? `<span class="soil-popup-prop-unit">${p.unit}</span>` : ''}</div>
        </div>`).join('')}</div>`
    : '';

  popup.setContent(
    `<div class="soil-popup">
       ${headHtml}
       ${propsHtml}
       <span class="soil-popup-src">SoilGrids 250m · ISRIC · surface 0–5 cm</span>
     </div>`
  );
}

// ═══════════════════════════════════════════════════════════
//  PIN RENDERING
// ═══════════════════════════════════════════════════════════

function renderPins(taxa) {
  // Skip addTo when the gallery toggle is off — saves N add+remove Leaflet ops
  // at startup (default is off). The toggle handler calls applyFilters() which
  // will addTo on demand.
  taxa.forEach(taxon => {
    const { lat, lng, rangeRadiusKm, coordinatePrecision } = taxon.mapPin;
    const color = genusColor(taxon.genus);

    const marker = L.marker([lat, lng], { icon: makeIcon(taxon), zIndexOffset: 100 });
    marker.bindTooltip(taxon.displayName, { direction: 'top' });
    marker.on('click', e => { L.DomEvent.stopPropagation(e); handlePinClick(e, taxon); });
    if (gallerySpeciesVisible) marker.addTo(map);

    let circle = null;
    if (rangeRadiusKm) {
      circle = L.circle([lat, lng], {
        radius:      rangeRadiusKm * 1000,
        color,
        fillColor:   color,
        fillOpacity: 0.07,
        weight:      1,
        opacity:     0.28,
        interactive: false
      });
      if (gallerySpeciesVisible) circle.addTo(map);
    }

    markerStore.set(taxon.id, { marker, circle, taxon });
  });
}

// ═══════════════════════════════════════════════════════════
//  OVERLAP DETECTION
// ═══════════════════════════════════════════════════════════

function handlePinClick(e, taxon) {
  const clickPt = map.latLngToContainerPoint(e.latlng);
  const nearby  = [];

  markerStore.forEach(({ marker, taxon: t }) => {
    if (!map.hasLayer(marker)) return;
    const pt = map.latLngToContainerPoint(marker.getLatLng());
    const dx = pt.x - clickPt.x, dy = pt.y - clickPt.y;
    if (Math.sqrt(dx*dx + dy*dy) < 14) nearby.push(t);
  });

  if (nearby.length > 1) {
    showOverlapPopup(e.latlng, nearby);
  } else {
    openPanel(taxon);
    flyToTaxon(taxon);
  }
}

function showOverlapPopup(latlng, taxa) {
  const items = taxa.map(t =>
    `<div class="overlap-item" data-id="${esc(t.id)}">
      <div class="overlap-dot" style="background:${genusColor(t.genus)}"></div>
      ${esc(t.displayName)}
    </div>`
  ).join('');

  const popup = L.popup({ className: '', closeButton: false, offset: [0, -5] })
    .setLatLng(latlng)
    .setContent(`<div class="overlap-popup">
      <div class="overlap-popup-title">${taxa.length} species at this location</div>
      ${items}
    </div>`)
    .openOn(map);

  setTimeout(() => {
    document.querySelectorAll('.overlap-item').forEach(el => {
      el.addEventListener('click', () => {
        map.closePopup(popup);
        const t = taxa.find(x => x.id === el.dataset.id);
        if (t) { openPanel(t); flyToTaxon(t); }
      });
    });
  }, 0);
}

function flyToTaxon(taxon) {
  const prec = taxon.mapPin?.coordinatePrecision || 'exact';
  const zoom = FLY_ZOOM[prec] || 9;
  map.flyTo([taxon.mapPin.lat, taxon.mapPin.lng], zoom, { duration: 0.8 });
}

// ═══════════════════════════════════════════════════════════
//  REGION HIGHLIGHT
// ═══════════════════════════════════════════════════════════

function clearRegionHighlight() {
  if (regionHighlight) { map.removeLayer(regionHighlight); regionHighlight = null; }
}

async function highlightRegion(taxon) {
  clearRegionHighlight();
  const prec  = taxon.mapPin?.coordinatePrecision;
  const color = genusColor(taxon.genus);

  if (prec === 'regional' && taxon.mapPin?.regionCode) {
    if (!statesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_1_states_provinces.geojson');
        statesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.regionCode;
    const feat = statesGeoJSON.features.find(f =>
      f.properties.iso_3166_2 === code || f.properties.adm1_code === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }

  if (prec === 'country' && taxon.mapPin?.countryCode) {
    if (!countriesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
        countriesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.countryCode;
    const feat = countriesGeoJSON.features.find(f =>
      f.properties.ISO_A2 === code || f.properties.ADM0_A3 === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }
}

// ═══════════════════════════════════════════════════════════
//  SIDE PANEL — OPEN / CLOSE
// ═══════════════════════════════════════════════════════════

function openPanel(taxon) {
  if (searchPanelOpen) closeLocationPanel();
  // Deselect previous marker
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon: prev } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(prev, false));
  }
  selectedId = taxon.id;
  markerStore.get(taxon.id).marker.setIcon(makeIcon(taxon, true));

  renderPanel(taxon);
  document.getElementById('side-panel').classList.add('open');
  highlightRegion(taxon);
  setDeepLink('taxon', taxon.id);
}

function closePanel() {
  closeGalleryLightbox();   // never leave a lightbox floating over a closed panel
  hideRestoreTab();         // a real close clears any minimized state too
  if (searchPanelOpen) { closeLocationPanel(); return; }
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(taxon, false));
  }
  selectedId = null;
  document.getElementById('side-panel').classList.remove('open');
  clearRegionHighlight();
  setDeepLink(null);   // drop any deep-link param (taxon/sp/obs/at)
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  navClear();   // dropping the panel discards back-history
}

// Minimize: hide the panel WITHOUT discarding its content or state, and show a
// restore tab. Unlike closePanel(), this keeps selectedId / searchState / the
// nav stack / charts / the deep link intact so restorePanel() reopens the exact
// same view. Closing the lightbox is fine (it floats above the panel).
function minimizePanel() {
  const panel = document.getElementById('side-panel');
  if (!panel.classList.contains('open')) return;
  closeGalleryLightbox();
  panel.classList.remove('open');
  panel.classList.add('minimized');
  document.body.classList.remove('panel-open');   // let mobile controls reappear
  showRestoreTab();
}
function restorePanel() {
  const panel = document.getElementById('side-panel');
  panel.classList.remove('minimized');
  panel.classList.add('open');
  document.body.classList.add('panel-open');
  hideRestoreTab();
}
function showRestoreTab() {
  // Label the tab by what's open, so it's clear what will reopen.
  let label = 'Reopen';
  if (searchPanelOpen) label = 'Location';
  else if (inatNav.mode === 'species-sidebar') label = 'Species';
  else if (inatNav.mode === 'obs-detail') label = 'Observation';
  else if (inatNav.mode === 'obs-list' || inatNav.mode === 'gallery') label = 'List';
  else if (inatNav.mode === 'species-list') label = 'Sightings';
  else if (selectedId) label = 'Species';
  const lbl = document.getElementById('panel-restore-label');
  if (lbl) lbl.textContent = label;
  document.getElementById('panel-restore-tab')?.classList.add('show');
}
function hideRestoreTab() {
  // Guard against re-entrancy: this is called from a MutationObserver on
  // #side-panel's class. Mutating that class unconditionally here re-triggers
  // the observer → calls this again → infinite loop → hard page freeze. Only
  // touch the class when it actually needs changing.
  const panel = document.getElementById('side-panel');
  if (panel && panel.classList.contains('minimized')) panel.classList.remove('minimized');
  const tab = document.getElementById('panel-restore-tab');
  if (tab && tab.classList.contains('show')) tab.classList.remove('show');
}

function renderPanel(taxon) {
  const pin = taxon.mapPin || {};
  const cn  = taxon.climateNormals;

  // Location string
  const locParts = [];
  if (taxon.country) locParts.push(taxon.country);
  if (pin.elevationM != null) locParts.push(pin.elevationM + 'm');
  const locStr = locParts.join(' · ');

  const coordStr = (pin.lat != null && pin.lng != null)
    ? `${pin.lat.toFixed(2)}, ${pin.lng.toFixed(2)}`
    : '';

  // Badges
  let koppenBadge = '';
  if (taxon.koppenZone) {
    const zc = KOPPEN_COLORS[taxon.koppenZone] || '#888';
    koppenBadge = `<span class="badge badge-koppen" style="color:${zc};border-color:${zc}50;background:${zc}1a">
      ${esc(taxon.koppenZone)} · ${esc(taxon.koppenLabel || KOPPEN_LABELS[taxon.koppenZone] || '')}
    </span>`;
  }

  const elev = getElevBand(taxon);
  const elevBadge = elev
    ? `<span class="badge badge-muted">${esc(elev.charAt(0).toUpperCase()+elev.slice(1))}</span>` : '';

  const habitatName = taxon.habitatId
    ? (habitatsMap[taxon.habitatId] || taxon.habitatId.replace(/_/g,' ')) : '';
  const habitatBadge = habitatName
    ? `<span class="badge badge-muted">${esc(habitatName)}</span>` : '';

  const entryBadge = `<span class="badge badge-muted">${esc(ENTRY_LABELS[taxon.entryType] || taxon.entryType)}</span>`;

  // Climate section
  let climateHtml = '';
  if (cn && (cn.tempMax || cn.tempMin) && cn.precipMm) {
    const peakHigh    = cn.tempMax ? Math.max(...cn.tempMax) : null;
    const peakLow     = cn.tempMin ? Math.min(...cn.tempMin) : null;
    const annualPrecip = Math.round(cn.precipMm.reduce((a,b)=>a+b,0));
    const meanTemp    = cn.tempMean ? cn.tempMean.reduce((a,b)=>a+b,0)/12 : null;

    climateHtml = `
      <div class="climate-grid" id="climate-grid">
        <div class="climate-stat">
          <div class="climate-stat-label">Peak High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Peak Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annualPrecip}<span class="climate-stat-unit">mm</span></div>
        </div>
        ${meanTemp != null ? `<div class="climate-stat">
          <div class="climate-stat-label">Mean Temp</div>
          <div class="climate-stat-value" data-celsius="${meanTemp}">${toDisplay(meanTemp, tempUnit)}</div>
        </div>` : ''}
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(cn)}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data not yet recorded for this taxon</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(taxon.displayName)}</div>
    ${taxon.commonName ? `<div class="p-common-name">${esc(taxon.commonName)}</div>` : ''}
    ${locStr ? `<div class="p-location">${esc(locStr)}</div>` : ''}
    ${coordStr ? `<div class="p-location" style="margin-top:-8px;opacity:0.55">${coordStr}</div>` : ''}

    <div class="badge-row">${koppenBadge}${elevBadge}${habitatBadge}${entryBadge}</div>

    ${taxon.nativeRange ? `
      <div class="section-label">Native Range</div>
      <div class="description-text">${esc(taxon.nativeRange)}</div>` : ''}

    ${taxon.nativeHabitat ? `
      <div class="section-label">Habitat</div>
      <div class="description-text">${esc(taxon.nativeHabitat)}</div>` : ''}

    <div class="section-divider"></div>
    <div class="section-label">Climate</div>
    ${climateHtml}

    <a class="gallery-link" href="${GALLERY_BASE}${esc(taxon.slug)}" target="_blank">
      View in Bogman Gallery →
    </a>
  `;

  // Wire expand button
  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && cn) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening  = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(cn);
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  CLIMATE TABLE
// ═══════════════════════════════════════════════════════════

// The "Extreme High/Low" stat boxes = peak/trough of the monthly extreme band:
// the hottest month's p90 daily high and the coldest month's p10 daily low.
// Defined here so the boxes, the chart band, and the table's Annual row all
// use one source and never disagree.
function extremeBoxVals(cn) {
  const hi = (cn.tempMaxHi || []).filter(v => v != null);
  const lo = (cn.tempMinLo || []).filter(v => v != null);
  return {
    extHigh: hi.length ? Math.max(...hi) : null,
    extLow:  lo.length ? Math.min(...lo) : null,
  };
}

// Collapsible "how these numbers are calculated" block, shared by the
// observation-detail and clicked-location climate panels (both use the same
// live NASA POWER computation).
function climateMethodologyHtml() {
  return `<details class="climate-method">
    <summary>How these numbers are calculated</summary>
    <div class="climate-method-body">
      <p><strong>Source:</strong> NASA POWER (MERRA-2 reanalysis), daily max/min 2&nbsp;m air temperature, 2014–2023 (10&nbsp;years). Daily values are grouped by calendar month.</p>
      <ul>
        <li><strong>High / Low</strong> (each month) — the <em>average</em> of that month's daily highs / lows.</li>
        <li><strong>Ext High / Ext Low</strong> (each month) — the <em>p90</em> of daily highs and <em>p10</em> of daily lows (a hot/cold day that month, beaten by ~10% of days).</li>
        <li><strong>Avg High / Avg Low</strong> boxes — the hottest month's average high and the coldest month's average low.</li>
        <li><strong>Extreme High / Extreme Low</strong> boxes — the hottest month's p90 high and the coldest month's p10 low (the peak/trough of the dashed band on the chart, so box and chart always agree).</li>
      </ul>
      <p><strong>Elevation correction:</strong> NASA's grid sits at a smoothed model elevation. Temperatures are shifted to the actual ground elevation using a <em>humidity-aware lapse rate</em> — dry air cools faster with height (~9.8&nbsp;°C/km), humid air slower (~4–6&nbsp;°C/km), so each month's rate is blended by its relative humidity (typically ~5.5–8&nbsp;°C/km). This is a physically-based estimate; it can't capture local inversions or cold-air pooling.</p>
      <p><strong>Obscured sightings:</strong> the exact location is hidden by iNaturalist within a ~22&nbsp;km box, so the elevation (and therefore temperature) is given as a range across that box.</p>
    </div>
  </details>`;
}

// Species-sidebar explainer. The species envelope is built by aggregating per
// 0.5° grid cell (one climate sample per cell) across everywhere the species is
// observed, so most numbers have two levels: a statistic within each cell's
// daily data, then a statistic across cells.
function speciesMethodologyHtml(entry) {
  const n = entry?.sample_count;
  return `<details class="climate-method">
    <summary>How these numbers are calculated</summary>
    <div class="climate-method-body">
      <p><strong>Source:</strong> NASA POWER (MERRA-2), 2019–2023. The species' observations are grouped into 0.5° (~55&nbsp;km) grid cells${n ? ` (${n.toLocaleString()} occupied cells here)` : ''}; one climate sample is taken per cell and elevation-corrected with the same humidity-aware lapse rate used elsewhere.</p>
      <p>Within each cell: <em>avg high/low</em> = hottest/coldest month's mean daily high/low; <em>hot/cold extreme</em> = hottest month's p90 daily high and coldest month's p10 daily low. Then across the species' cells:</p>
      <ul>
        <li><strong>Avg High / Avg Low</strong> — the <em>mean</em> across cells (a typical site in the range).</li>
        <li><strong>Typical Hot / Cold Extreme</strong> — the <em>mean</em> across cells of each cell's hot/cold extreme.</li>
        <li><strong>Heat Limit / Cold Limit</strong> — the <em>p90 / p10 across cells</em> of those extremes: the hot/cold edge of the range. (p90/p10 rather than the absolute max/min so a single bad cell can't define the limit, while genuine extremes are still kept.)</li>
      </ul>
      <p><strong>Chart:</strong> the shaded band is the p25–p75 spread of monthly averages <em>across sites</em> (how conditions vary place to place); the dashed lines are the daily hot/cold extremes (median across sites). <strong>Elevation range</strong> is the 10th–90th percentile of occupied-cell elevations.</p>
    </div>
  </details>`;
}

function buildClimateTable(cn) {
  const hasMean    = !!(cn.tempMean && cn.tempMean.length);
  const hasExtHi   = !!(cn.tempMaxHi && cn.tempMaxHi.some(v => v != null));
  const hasExtLo   = !!(cn.tempMinLo && cn.tempMinLo.some(v => v != null));
  const hasRH      = !!(cn.rhMean && cn.rhMean.some(v => v != null));

  const rows = MONTHS.map((m, i) => {
    const hi    = cn.tempMax   ? cn.tempMax[i]   : null;
    const lo    = cn.tempMin   ? cn.tempMin[i]   : null;
    const exHi  = hasExtHi     ? cn.tempMaxHi[i] : null;
    const exLo  = hasExtLo     ? cn.tempMinLo[i] : null;
    const mean  = hasMean      ? cn.tempMean[i]  : null;
    const rhAvg = hasRH        ? cn.rhMean[i]    : null;
    const prec  = cn.precipMm  ? cn.precipMm[i]  : null;
    return `<tr>
      <td>${m}</td>
      <td data-celsius="${hi}">${toDisplay(hi, tempUnit)}</td>
      ${hasExtHi ? `<td data-celsius="${exHi}">${toDisplay(exHi, tempUnit)}</td>` : ''}
      <td data-celsius="${lo}">${toDisplay(lo, tempUnit)}</td>
      ${hasExtLo ? `<td data-celsius="${exLo}">${toDisplay(exLo, tempUnit)}</td>` : ''}
      ${hasMean ? `<td data-celsius="${mean}">${toDisplay(mean, tempUnit)}</td>` : ''}
      ${hasRH   ? `<td>${rhAvg != null ? Math.round(rhAvg) + '%' : '—'}</td>` : ''}
      <td>${prec != null ? Math.round(prec)+'mm' : '—'}</td>
    </tr>`;
  }).join('');

  const annHi   = cn.tempMax  ? Math.max(...cn.tempMax)              : null;
  const annLo   = cn.tempMin  ? Math.min(...cn.tempMin)              : null;
  // Annual extreme = peak/trough of the monthly extreme band: the hottest
  // month's p90 daily high and the coldest month's p10 daily low. This is the
  // same value shown in the "Extreme High/Low" stat boxes, so they always agree.
  const annExHi = hasExtHi ? Math.max(...cn.tempMaxHi.filter(v => v != null)) : null;
  const annExLo = hasExtLo ? Math.min(...cn.tempMinLo.filter(v => v != null)) : null;
  const annPrec = cn.precipMm ? Math.round(cn.precipMm.reduce((a,b)=>a+b,0)) : null;
  const validRH = hasRH ? cn.rhMean.filter(v => v != null) : [];
  const annRH   = validRH.length ? validRH.reduce((a,b)=>a+b,0) / validRH.length : null;

  return `<table class="climate-table">
    <thead><tr>
      <th>Month</th>
      <th>High</th>
      ${hasExtHi ? '<th title="Typical monthly heat extreme (p90 of daily highs)">Ext High</th>' : ''}
      <th>Low</th>
      ${hasExtLo ? '<th title="Typical monthly cold extreme (p10 of daily lows)">Ext Low</th>' : ''}
      ${hasMean ? '<th>Mean</th>' : ''}
      ${hasRH   ? '<th title="Mean relative humidity">RH Avg</th>' : ''}
      <th>Precip</th>
    </tr></thead>
    <tbody>
      ${rows}
      <tr class="annual-row">
        <td>Annual</td>
        <td data-celsius="${annHi}">${toDisplay(annHi, tempUnit)}</td>
        ${hasExtHi ? `<td data-celsius="${annExHi}">${annExHi != null ? toDisplay(annExHi, tempUnit) : '—'}</td>` : ''}
        <td data-celsius="${annLo}">${toDisplay(annLo, tempUnit)}</td>
        ${hasExtLo ? `<td data-celsius="${annExLo}">${annExLo != null ? toDisplay(annExLo, tempUnit) : '—'}</td>` : ''}
        ${hasMean ? '<td>—</td>' : ''}
        ${hasRH   ? `<td>${annRH != null ? Math.round(annRH) + '%' : '—'}</td>` : ''}
        <td>${annPrec != null ? annPrec+'mm' : '—'}</td>
      </tr>
    </tbody>
  </table>`;
}

function buildClimateChart(cn) {
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  const ctx = document.getElementById('climate-chart');
  if (!ctx) return;

  // Extreme range datasets — drawn first so the avg lines render on top.
  // The two extreme lines are styled as a translucent band: the cold-extreme
  // line fills upward to the hot-extreme line, creating a shaded envelope
  // that shows the "typical extreme range" each month. Legend hides the
  // individual extreme entries (underscore-prefixed) to reduce clutter;
  // tooltips still show all four numbers.
  const hasExtremes = !!(cn.tempMaxHi && cn.tempMinLo);

  climateChart = new Chart(ctx, {
    data: {
      labels: MONTHS,
      datasets: [
        ...(hasExtremes ? [
          {
            type: 'line',
            label: 'Extreme high',
            data: cn.tempMaxHi,
            borderColor: 'rgba(255,140,60,0.32)',
            backgroundColor: 'rgba(255,140,60,0.12)',
            fill: '+1',                  // fills down to the next dataset (Extreme low)
            tension: 0.4,
            pointRadius: 0,
            borderWidth: 1,
            borderDash: [4, 3],
            yAxisID: 'yTemp',
          },
          {
            type: 'line',
            label: 'Extreme low',
            data: cn.tempMinLo,
            borderColor: 'rgba(100,180,255,0.32)',
            backgroundColor: 'transparent',
            fill: false,
            tension: 0.4,
            pointRadius: 0,
            borderWidth: 1,
            borderDash: [4, 3],
            yAxisID: 'yTemp',
          },
        ] : []),
        {
          type: 'line',
          label: 'Avg high',
          data: cn.tempMax,
          borderColor: 'rgba(255,140,60,0.95)',
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.4,
          pointRadius: 2,
          pointHoverRadius: 5,
          borderWidth: 2,
          yAxisID: 'yTemp'
        },
        {
          type: 'line',
          label: 'Avg low',
          data: cn.tempMin,
          borderColor: 'rgba(100,180,255,0.95)',
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.4,
          pointRadius: 2,
          pointHoverRadius: 5,
          borderWidth: 2,
          yAxisID: 'yTemp'
        },
        {
          type: 'bar',
          label: 'Precip',
          data: cn.precipMm,
          backgroundColor: 'rgba(80,160,240,0.45)',
          borderColor:     'rgba(80,160,240,0.7)',
          borderWidth: 1,
          yAxisID: 'yPrecip'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: 'rgba(255,255,255,0.55)', font: { size: 11 }, boxWidth: 12 }
        },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#8b949e',
          callbacks: {
            label(ctx) {
              // Precip is the only non-temperature dataset on this chart
              if (ctx.dataset.label === 'Precip')
                return `Precip: ${ctx.raw != null ? Math.round(ctx.raw) : '—'}mm`;
              return `${ctx.dataset.label}: ${toDisplay(ctx.raw, tempUnit)}`;
            }
          }
        }
      },
      scales: {
        yTemp: {
          type: 'linear', position: 'left',
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 }, callback: v => toDisplay(v, tempUnit) }
        },
        yPrecip: {
          type: 'linear', position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { color: 'rgba(80,160,240,0.65)', font: { size: 10 }, callback: v => Math.round(v)+'mm' }
        },
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 } }
        }
      }
    }
  });
}

        }

      interaction: { mode: 'index', intersect: false },

function buildLightTable(cn) {
  const hasPPFD = cn.ppfd && cn.ppfd.some(v => v != null);

  // RH Avg used to live here, but it's been moved to buildClimateTable so that
  // temperature / precipitation / humidity all live in one table. This table
  // now strictly covers light & atmosphere (daylight, DLI, PPFD).
  const rows = MONTHS.map((mon, i) => {
    const dl   = cn.daylightHrs?.[i];
    const dli  = cn.dli?.[i];
    const ppfd = cn.ppfd?.[i];
    return `<tr>
      <td>${mon}</td>
      <td>${dl  != null ? dl.toFixed(1) + 'h' : '—'}</td>
      <td>${dli != null ? dli.toFixed(1)       : '—'}</td>
      ${hasPPFD ? `<td>${ppfd != null ? Math.round(ppfd) : '—'}</td>` : ''}
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;margin-bottom:16px">
    <table class="climate-table">
      <thead><tr>
        <th>Month</th>
        <th>Daylight</th>
        <th title="Daily Light Integral (mol photons/m²/day)">DLI</th>
        ${hasPPFD ? '<th title="Avg PPFD during daylight (μmol/m²/s)">PPFD</th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function setTempUnit(unit) {
  tempUnit = unit;
  lsSet('bmg_temp_unit', unit);
  document.getElementById('unit-f')?.classList.toggle('active', unit === 'F');
  document.getElementById('unit-c').classList.toggle('active', unit === 'C');

  // Update all visible temperature values
  document.querySelectorAll('[data-celsius]').forEach(el => {
    const c = parseFloat(el.dataset.celsius);
    if (!isNaN(c)) el.textContent = toDisplay(c, unit);
  });
  // Temperature ranges (obscured-cell boxes): data-celsius-range="loC,hiC"
  document.querySelectorAll('[data-celsius-range]').forEach(el => {
    const [lo, hi] = el.dataset.celsiusRange.split(',').map(parseFloat);
    if (!isNaN(lo) && !isNaN(hi)) el.textContent = toDisplayRange(lo, hi, unit);
  });

  // Rebuild chart with new unit
  if (climateChart && selectedId) {
    const entry = markerStore.get(selectedId);
    if (entry?.taxon?.climateNormals) buildClimateChart(entry.taxon.climateNormals);
  } else if (climateChart && searchPanelOpen && searchState?.normals) {
    buildClimateChart(searchState.normals);
  }

  // Climate-match comparison view: re-render so its temperature chart converts too
  // (detected by the presence of its canvas in the current panel).
  if (speciesCompareCtx && document.getElementById('cmp-temp-chart')) {
    renderSpeciesComparePanel(speciesCompareCtx.state, speciesCompareCtx.m, speciesCompareCtx.matches);
  }
}
